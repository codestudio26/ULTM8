name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Cross-tenant isolation gate (ultm8-tenant-isolation §5): required to merge, from
  # day one — not bolted on once more modules exist. Runs the RLS integration suite
  # against a real Postgres service container.
  cross-tenant-isolation:
    name: Cross-tenant isolation gate (required)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ultm8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Phase 5 — first Redis usage in this codebase (otp-delivery,
      # class-occurrence-generation). No auth needed for CI's own throwaway instance.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Superuser connection — used for migrations and RLS-bypassing fixture setup.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ultm8?schema=public
      # Set only after the migration creates the ultm8_app/ultm8_jobs roles (step below).
      DATABASE_URL_APP: postgresql://ultm8_app:changeme@localhost:5432/ultm8?schema=public
      DATABASE_URL_JOBS: postgresql://ultm8_jobs:changeme@localhost:5432/ultm8?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-secret-not-for-production-use-only-32-chars-min

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Apply migration (creates schema, RLS policies, ultm8_app/ultm8_auth roles)
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Run cross-tenant isolation test suite
        working-directory: apps/api
        run: npx jest --config ./test/jest-e2e.json --runInBand

  # Everything else that doesn't need a live database (build, unit tests).
  build-and-unit-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build
        run: npx turbo run build

      - name: Unit tests
        run: npx turbo run test
