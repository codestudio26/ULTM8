# Render Blueprint — the apps/api STAGING backend: the NestJS API plus a Key
# Value (Redis) instance. Postgres is on Supabase; both portals are on Vercel
# (see each app's vercel.json). Step-by-step setup: docs/deploy/STAGING-RUNBOOK.md.
# Deploy via Render's dashboard: New + -> Blueprint -> this repo/branch.
#
# Commands run from the repo root (no `rootDir`): this is an npm-workspaces
# monorepo, and `npm install` needs the root package.json/lockfile.
#
# Every `sync: false` value is entered once in Render's own UI, never in git:
# Render prompts for them when the Blueprint is created.
#
# Postgres lives on Supabase, not Render: Render's free Postgres expires 30
# days after creation, while Supabase's free tier only pauses after 7 days of
# no activity. So `DATABASE_URL` is `sync: false` (Supabase's connection
# string), and there is no `databases:` block.
#
# NODE_ENV=production turns on apps/api's boot-time env check
# (src/common/config/validate-env.ts). The API refuses to start without every
# scoped DATABASE_URL_* (an unset one would silently fall back to the
# superuser and bypass RLS), REDIS_URL, CORS_ALLOWED_ORIGINS, PORTAL_BASE_URL,
# and four distinct 32+ character signing secrets.

# Service names carry "staging" so they never collide with the older hand-made
# ultm8-api/ultm8-redis services in the same Render workspace.

databases: []

services:
  - name: ultm8-staging-redis
    type: keyvalue
    plan: free
    region: oregon
    # BullMQ needs Redis to never drop keys: under an evicting policy (Render's
    # default is allkeys-lru) a full instance would silently delete queued jobs.
    # The API logs "Eviction policy is allkeys-lru. It should be noeviction"
    # on boot until this is set.
    maxmemoryPolicy: noeviction
    # `ipAllowList` is mandatory on a Key Value service. Empty means "internal
    # only": ultm8-staging-api still reaches it over Render's private network via
    # REDIS_URL/fromService below, and nothing on the internet can.
    ipAllowList: []

  - name: ultm8-staging-api
    type: web
    runtime: node
    plan: free
    region: oregon
    # TEMPORARY (one deploy): /v1/docs needs no Redis, so the fixed API can take
    # over from the old instance that holds all 50 free Redis connections.
    # Revert to /v1/health right after.
    healthCheckPath: /v1/docs
    # Build steps, in order:
    # - Install only apps/api's workspace plus root tooling. A full install
    #   pulls in Expo/Vite and once hung for 3+ hours on Render's free builder.
    #   `--include=dev` is required because NODE_ENV=production (below) would
    #   otherwise skip the devDependencies the build needs (nest CLI, prisma
    #   CLI, turbo).
    # - `prisma migrate deploy`, as the superuser (DATABASE_URL). Idempotent:
    #   it applies only pending migrations.
    # - rotate-role-passwords.js sets each scoped role's password to the one
    #   in its DATABASE_URL_* (the migrations create them with 'changeme').
    buildCommand: >-
      npm install --workspace=apps/api --include-workspace-root=true --include=dev &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
      node apps/api/scripts/rotate-role-passwords.js &&
      npx turbo run build --filter=@ultm8/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Superuser connection: Supabase's "Session pooler" connection string
      # (port 5432, IPv4-compatible; the direct db.<ref>.supabase.co host is
      # IPv6-only). Used for migrations, role-password rotation and the dev
      # seeds. The running API never queries as this user.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: ultm8-staging-redis
          type: keyvalue
          property: connectionString

      # Scoped, RLS-subject roles: one connection string each, same Supabase
      # session-pooler host as DATABASE_URL, with the user swapped (pooler
      # usernames are "<role>.<project-ref>") and a strong password YOU choose.
      # rotate-role-passwords.js applies that password to the role on every
      # deploy. Append `&connection_limit=2` (or `?connection_limit=2`): six
      # pools share Supabase free tier's small pooler limit.
      - key: DATABASE_URL_APP
        sync: false
      - key: DATABASE_URL_AUTH
        sync: false
      - key: DATABASE_URL_JOBS
        sync: false
      - key: DATABASE_URL_DISCOVERY
        sync: false
      - key: DATABASE_URL_PLATFORM_ADMIN
        sync: false
      - key: DATABASE_URL_GRADING_ERASURE
        sync: false

      # Signing secrets: generated fresh by Render, distinct, never reused
      # across environments.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_JWT_SECRET
        generateValue: true
      - key: QR_CLASS_TOKEN_SECRET
        generateValue: true
      - key: QR_STUDENT_TOKEN_SECRET
        generateValue: true
      # Spec §8.3's 15-minute access token. The refresh-token endpoint exists
      # now, so there's no need for the old track-b "2h" debug value.
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: PLATFORM_ADMIN_JWT_TTL
        value: 5m
      - key: PLATFORM_ADMIN_IMPERSONATION_TTL_SECONDS
        value: "600"
      - key: QR_ATTENDANCE_TOKEN_TTL_SECONDS
        value: "20"
      - key: KID_MODE_TOKEN_TTL_SECONDS
        value: "300"
      - key: STEP_UP_TOKEN_TTL_SECONDS
        value: "300"

      # Browser origins: the two Vercel portals (plus the student web app if
      # used), comma-separated, exact scheme+host, no trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # The School Portal's public URL, for links in emails (coach invites).
      - key: PORTAL_BASE_URL
        sync: false

      # Vendors: optional for staging. The API boots without them, and each
      # feature fails until its keys are set (the API logs which are missing).
      # Stripe: TEST-mode keys only on staging.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_RETURN_URL
        sync: false
      - key: STRIPE_CONNECT_REFRESH_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: NOTIFICATIONS_FROM_EMAIL
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: CLOUDFLARE_STREAM_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
