<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DojoHQ Grading Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:oklch(98% 0.004 95); --surface:oklch(100% 0 0); --surface-2:oklch(97% 0.004 95);
    --border:oklch(90% 0.006 95); --text:oklch(22% 0.01 95); --text-muted:oklch(48% 0.012 95); --text-faint:oklch(62% 0.01 95);
    --sidebar-bg:oklch(19% 0.02 265); --sidebar-text:oklch(88% 0.01 265); --sidebar-text-dim:oklch(62% 0.02 265); --sidebar-active:oklch(27% 0.03 265);
    --accent:oklch(72% 0.15 75); --accent-ink:oklch(19% 0.02 265); --accent-tint:oklch(96% 0.03 75); --accent-border:oklch(75% 0.1 75);
    --info:oklch(45% 0.13 210); --info-bg:oklch(95% 0.025 210); --info-border:oklch(75% 0.09 210);
    --success:oklch(35% 0.1 148); --success-bg:oklch(94% 0.045 148); --success-border:oklch(70% 0.11 148);
    --danger:oklch(42% 0.16 25); --danger-bg:oklch(94% 0.05 25); --danger-border:oklch(72% 0.12 25);
    --shadow: 0 16px 40px oklch(20% 0.02 95 / 0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:oklch(15% 0.012 260); --surface:oklch(20% 0.014 260); --surface-2:oklch(23% 0.015 260);
      --border:oklch(30% 0.016 260); --text:oklch(93% 0.006 95); --text-muted:oklch(70% 0.012 95); --text-faint:oklch(55% 0.012 95);
      --accent-tint:oklch(28% 0.05 75); --accent-border:oklch(55% 0.12 75);
      --info-bg:oklch(26% 0.05 210); --info-border:oklch(45% 0.1 210); --info:oklch(78% 0.08 210);
      --success-bg:oklch(24% 0.05 148); --success-border:oklch(45% 0.1 148); --success:oklch(78% 0.1 148);
      --danger-bg:oklch(26% 0.06 25); --danger-border:oklch(48% 0.12 25); --danger:oklch(80% 0.1 25);
      --shadow: 0 16px 40px oklch(0% 0 0 / 0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:oklch(15% 0.012 260); --surface:oklch(20% 0.014 260); --surface-2:oklch(23% 0.015 260);
    --border:oklch(30% 0.016 260); --text:oklch(93% 0.006 95); --text-muted:oklch(70% 0.012 95); --text-faint:oklch(55% 0.012 95);
    --accent-tint:oklch(28% 0.05 75); --accent-border:oklch(55% 0.12 75);
    --info-bg:oklch(26% 0.05 210); --info-border:oklch(45% 0.1 210); --info:oklch(78% 0.08 210);
    --success-bg:oklch(24% 0.05 148); --success-border:oklch(45% 0.1 148); --success:oklch(78% 0.1 148);
    --danger-bg:oklch(26% 0.06 25); --danger-border:oklch(48% 0.12 25); --danger:oklch(80% 0.1 25);
    --shadow: 0 16px 40px oklch(0% 0 0 / 0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Work Sans",ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif; margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  input,textarea{font-family:inherit; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13.5px;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  .btn{border:none; border-radius:9px; font-weight:700; font-size:13.5px; padding:10px 16px; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:none; border:1px solid var(--border); color:var(--text); font-weight:600;}
  .btn-danger-outline{background:none; border:1px solid var(--border); color:var(--danger); font-weight:600;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .chip{border-radius:999px; font-size:12.5px; font-weight:600; padding:6px 12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .chip.on{border-color:var(--accent-border); background:var(--accent-tint); color:var(--text);}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px;}
  .stepper{display:inline-flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .stepper button{width:28px; height:30px; background:var(--surface-2); border:none; font-size:15px; font-weight:700; color:var(--text-muted);}
  .stepper .val{min-width:44px; text-align:center; font-size:13.5px; font-weight:700; padding:0 4px;}
  .swatch{width:24px; height:24px; border-radius:7px; border:2px solid transparent; cursor:pointer; flex:0 0 auto;}
  .swatch.on{border-color:var(--text);}
  .toggle{width:40px; height:23px; border-radius:999px; border:none; position:relative; padding:2.5px; flex:0 0 auto;}
  .toggle .knob{width:18px; height:18px; border-radius:999px; background:oklch(99% 0 0); transition:transform .12s;}
  .modal-backdrop{position:fixed; inset:0; background:oklch(15% 0.01 95 / 0.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{width:460px; max-width:100%; background:var(--surface); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); max-height:86vh; overflow:auto;}
  .toast{position:fixed; top:20px; right:20px; z-index:60; background:var(--surface); border:1px solid var(--success-border); box-shadow:var(--shadow); border-radius:12px; padding:14px 16px; display:flex; align-items:flex-start; gap:10px; max-width:360px;}
  a{color:var(--info);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============== DATA ============== */
var uid = 0;
function nextId(prefix){ uid++; return prefix + "-" + uid; }

/* Tag color used ONLY on the IBJJF Black Belt tier (0-6 Stripes) — every
   colour-belt rung's tag is BLACK ("#17181A"), so this specific red is what
   actually distinguishes "Black Belt and up" from everything else. Shared
   between buildIbjjfRankDefs() (which paints the tag) and isYearsRank()
   (which gates on it), so the two can never drift apart. */
var IBJJF_BLACK_TAG_COLOR = "#C23B3B";

/* The default (and only, out of the box) style is the full IBJJF ladder —
   same 26 ranks "Start from template" builds, just with fixed, readable
   ids (instead of runtime nextId() ids) so seed students below can point
   at a specific rank reliably. */
function buildDefaultIbjjfStyle(){
  var defs = buildIbjjfRankDefs();
  var coralSlugs = { "Red/Black Belt (7th Degree)":"red-black-7", "Red/White Belt (8th Degree)":"red-white-8", "Red Belt (9th Degree)":"red-9" };
  // Gate to promote INTO Purple (checked while at Blue Belt · 4 Stripes) and
  // into Green/Black (checked while at Green Belt · 4 Stripes) — same two
  // demo gates as before, now anchored to each belt's 0-stripe rung.
  var skillMap = { "purple":["rnc","ss","gr","ab","td"], "green-black":["gr"] };
  var ranks = defs.map(function(d){
    var id;
    if(coralSlugs[d.name]){
      id = coralSlugs[d.name];
    } else {
      var base = d.name.replace(/\s*·.*$/,'').replace(/\s*Belt$/,'').trim().toLowerCase().replace(/\//g,'-').replace(/\s+/g,'-');
      var n = d.stripeTiers && d.stripeTiers.length ? d.stripeTiers[0].count : 0;
      id = n===0 ? base : base+'-'+n;
    }
    return { id:id, name:d.name, order:d.order, color:d.color, secondaryColor:d.secondaryColor,
      tagColor:d.tagColor||null, coralAccent:d.coralAccent||null, stripeTiers:d.stripeTiers,
      classCount:d.classCount, minDays:d.minDays, weeklyCap:d.weeklyCap, scope:d.scope.slice(),
      skills:(skillMap[id]||[]).slice() };
  });
  return { id:"bjj", name:"Brazilian Jiu-Jitsu (IBJJF)",
    classTypes:["Kids Fundamentals","Kids Sparring","Adult Fundamentals","Adult Sparring","Competition Team"],
    ranks:ranks };
}

var DB = {
  styles: [ buildDefaultIbjjfStyle() ],
  skills: [
    { id:"rnc",  name:"Rear Naked Choke",     description:"Back control finish — seatbelt grip, choke with the forearm across the neck.", styleId:"bjj" },
    { id:"ss",   name:"Scissor Sweep",        description:"Classic guard sweep using a scissoring leg motion to off-balance the opponent.", styleId:"bjj" },
    { id:"gr",   name:"Guard Retention",      description:"Recover guard and frame against a passing opponent under live pressure.", styleId:"bjj" },
    { id:"ab",   name:"Armbar from Guard",    description:"Isolate the arm from closed guard and finish with hip extension.", styleId:"bjj" },
    { id:"td",   name:"Takedown Defense",     description:"Sprawl and frame to stop a double-leg attempt.", styleId:"bjj" }
  ],
  students: [
    { id:"mia",   name:"Mia Alvarez",   styleId:"bjj", rankId:"grey-white", since:"14 Jan 2026", classesAttended:5,  skillStatus:{},
      history:[ {rankId:"grey-white", type:"promotion", date:"14 Jan 2026", by:"Gus (Owner)", note:""} ] },
    { id:"noah",  name:"Noah Kim",      styleId:"bjj", rankId:"yellow-black-2", since:"3 Mar 2026", classesAttended:20, skillStatus:{},
      history:[ {rankId:"yellow-black-2", type:"promotion", date:"3 Mar 2026", by:"Coach Marco", note:""} ] },
    { id:"theo",  name:"Theo Brandt",   styleId:"bjj", rankId:"green-4",  since:"20 Sep 2025", classesAttended:20, skillStatus:{gr:"signed"},
      history:[ {rankId:"green-4", type:"promotion", date:"20 Sep 2025", by:"Gus (Owner)", note:""} ] },
    { id:"alex",  name:"Alex Chen",     styleId:"bjj", rankId:"blue-4",   since:"12 Mar 2026", classesAttended:35, skillStatus:{rnc:"signed",ss:"signed",gr:"signed",ab:"signed",td:"learning"},
      history:[ {rankId:"blue-4", type:"promotion", date:"12 Mar 2026", by:"Gus (Owner)", note:""} ] },
    { id:"priya", name:"Priya Nair",    styleId:"bjj", rankId:"purple-4", since:"1 Jan 2025", classesAttended:30, skillStatus:{},
      history:[ {rankId:"purple-4", type:"promotion", date:"1 Jan 2025", by:"Gus (Owner)", note:""} ] },
    { id:"jamie", name:"Jamie Ortiz",   styleId:"bjj", rankId:"brown-3",  since:"2 Jun 2024", classesAttended:20, skillStatus:{},
      history:[ {rankId:"brown-3", type:"promotion", date:"2 Jun 2024", by:"Coach Priya", note:""} ] },
    { id:"derek", name:"Derek Osei",    styleId:"bjj", rankId:"black",  since:"18 Nov 2023", classesAttended:50, skillStatus:{},
      history:[ {rankId:"black", type:"promotion", date:"18 Nov 2023", by:"Gus (Owner)", note:"Awarded Black Belt after 9 years on the mat."} ] },
    { id:"sofia", name:"Sofia Reyes",   styleId:"bjj", rankId:"black-3", since:"5 May 2016", classesAttended:140, skillStatus:{},
      history:[ {rankId:"black-3", type:"promotion", date:"5 May 2016", by:"Gus (Owner)", note:""} ] },
    { id:"kenji", name:"Kenji Watanabe",styleId:"bjj", rankId:"red-black-7", since:"10 Oct 2005", classesAttended:320, skillStatus:{},
      history:[ {rankId:"red-black-7", type:"promotion", date:"10 Oct 2005", by:"Gus (Owner)", note:"Red/Black Belt (7th Degree) — competition committee award."} ] }
  ],
  events: [
    { id:"autumn", title:"Autumn Grading Day — BJJ Blue → Purple", date:"21 Nov 2026", venue:"Riverside — Main Mat", status:"scheduled",
      participants:[ {id:"mia",name:"Mia Alvarez",result:null}, {id:"theo",name:"Theo Brandt",result:null}, {id:"kai",name:"Kai Sato",result:null}, {id:"ren",name:"Ren Okafor",result:null} ] },
    { id:"summer", title:"Summer Grading Day — BJJ White → Blue", date:"9 Aug 2026", venue:"Riverside — Main Mat", status:"completed",
      participants:[ {id:"lee",name:"Lee Park",result:"pass"}, {id:"vera",name:"Vera Nowak",result:"pass"} ] }
  ],
  settings: { feeOn:false, channels:{inapp:true,email:true,push:false,sms:false},
    instructors:[ {id:"marco",name:"Coach Marco",perm:{bjj:true}}, {id:"priyaCoach",name:"Coach Priya",perm:{bjj:true}}, {id:"theoCoach",name:"Coach Theo",perm:{bjj:true}} ] }
};

/* rank names referenced only in seed history that aren't in the ladder (older stripe levels) — label fallback */
var HISTORIC_RANK_LABELS = { white2s:"White Belt · 2 Stripes", white3s:"White Belt · 3 Stripes" };

var UI = {
  page:"ranks",
  selectedStyleId:"bjj",
  selectedRankId:"blue-4",
  createStyleOpen:false,
  createStyleTab:"template",
  templatePickId:"ibjjf",
  templateStyleNameDraft:"",
  newStyleNameDraft:"",
  scratchBaseTemplateId:null,
  confirmDeleteStyleId:null,
  editStyleNameOpen:false,
  editStyleNameDraft:"",
  editStyleNameError:false,
  rankFormOpen:false,
  rankFormMode:"add",
  rankFormEditId:null,
  rankDraft:null,
  rankNameError:false,
  stripeClipboard:null,
  applyStripesOpen:false,
  applyStripesTargets:[],

  skillFilter:"all",
  skillFormOpen:false,
  expandedSkillId:null,

  selectedStudentId:"alex",
  gradeOpen:false,
  downgradeOpen:false,
  gradePickedRankId:null,

  eventsView:"list",
  selectedEventId:null,
  scheduleOpen:false,

  toast:null
};

/* ============== HELPERS ============== */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getStyle(id){ return DB.styles.find(function(s){ return s.id===id; }); }
function getRank(styleId, rankId){ var st=getStyle(styleId); return st && st.ranks.find(function(r){ return r.id===rankId; }); }
function rankLabel(styleId, rankId){ var r=getRank(styleId, rankId); if(r) return r.name; return HISTORIC_RANK_LABELS[rankId] || rankId; }
function nextRank(styleId, rankId){
  var st=getStyle(styleId); var cur=getRank(styleId, rankId);
  if(!st||!cur) return null;
  return st.ranks.find(function(r){ return r.order===cur.order+1; }) || null;
}
function skillsForStyle(styleId){ return DB.skills.filter(function(s){ return s.styleId===styleId; }); }
function skillName(id){ var s=DB.skills.find(function(x){ return x.id===id; }); return s?s.name:id; }

/* Ranks from Black Belt onward in the IBJJF template carry a tagColor (Black
   Belt) or a coralAccent (the coral belts) — a marker set only by the IBJJF
   rank builder, never by any other template or a hand-built custom rank. It
   doubles as the "years-only gating" flag: classes aren't counted and skills
   aren't required past this point, only time-in-rank. */
function isYearsRank(r){ return !!(r && (r.tagColor===IBJJF_BLACK_TAG_COLOR || r.coralAccent)); }
function daysToYears(days){ return Math.round(days/365); }
function yearsToDays(years){ return years*365; }
function daysSince(dateStr){
  var then = new Date(dateStr);
  if(isNaN(then.getTime())) return 0;
  var now = new Date();
  return Math.max(0, Math.floor((now-then)/86400000));
}
var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatToday(){
  var d = new Date();
  return d.getDate()+" "+MONTH_NAMES[d.getMonth()]+" "+d.getFullYear();
}
function rankReqSummaryText(r){
  if(isYearsRank(r)){
    var y = daysToYears(r.minDays);
    return y+' year'+(y===1?'':'s');
  }
  return r.classCount+' classes · '+r.minDays+' days';
}

function computeEligibility(student){
  var cur = getRank(student.styleId, student.rankId);
  var nr = nextRank(student.styleId, student.rankId);
  if(!nr) return {hasNext:false};
  if(isYearsRank(cur)){
    var signedCount = 0;
    nr.skills.forEach(function(sid){ if(student.skillStatus[sid]==="signed") signedCount++; });
    var elapsedDays = daysSince(student.since);
    var yearsOk = elapsedDays >= cur.minDays;
    return { hasNext:true, nextRank:nr, yearsGated:true, elapsedDays:elapsedDays, requiredDays:cur.minDays,
      classesOk:true, skillsOk:true, eligible:yearsOk, signedCount:signedCount, needSkills:nr.skills.length };
  }
  // Colour-belt gating normally reads the requirement off the NEXT rank —
  // that's what a rank's classCount/skills represent: what it takes to be
  // promoted INTO it. The one place that breaks is the single transition
  // INTO the years-only tier (today: Brown Belt · 4 Stripes -> Black Belt):
  // Black Belt's own classCount/skills are intentionally zeroed (years is
  // its only gate from there on), so reading requirements off it here would
  // make that one promotion trivially free regardless of attendance. Falling
  // back to the CURRENT rank's own numbers in that one case reproduces
  // exactly the same requirement every other stripe on the belt already
  // uses (every rung of a belt shares the same classCount/skills) — nothing
  // about Brown Belt's own progression changes, and every other colour-belt
  // transition is untouched since isYearsRank(nr) is only ever true right
  // at this one boundary.
  var reqSource = isYearsRank(nr) ? cur : nr;
  var reqSignedCount = 0;
  reqSource.skills.forEach(function(sid){ if(student.skillStatus[sid]==="signed") reqSignedCount++; });
  var classesOk = student.classesAttended >= reqSource.classCount;
  var skillsOk = reqSignedCount >= reqSource.skills.length;
  return { hasNext:true, nextRank:nr, yearsGated:false, classesOk:classesOk, skillsOk:skillsOk, eligible: classesOk && skillsOk, signedCount:reqSignedCount, needSkills:reqSource.skills.length };
}

/* ============== BELT SWATCH (base + secondary + tiered stripes) ============== */
function stripeMarksArray(r){
  var tiers = (r.stripeTiers && r.stripeTiers.length) ? r.stripeTiers : [];
  var marks = [];
  tiers.forEach(function(t){
    for(var i=0;i<t.count;i++) marks.push(t.color||"#1A1A1A");
  });
  return marks;
}
function totalStripes(r){ return stripeMarksArray(r).length; }
function stripesSummaryText(tiers){
  tiers = (tiers||[]).filter(function(t){ return t.count>0; });
  if(!tiers.length) return "no stripes";
  return tiers.map(function(t){ return t.count+" "+t.color.toUpperCase()+" stripe"+(t.count===1?"":"s"); }).join(" + ");
}
/* The coral / red degree belts (7th-9th) aren't built from the usual
   tag+stripes pattern — they're their own fixed decorative bar, matching
   IBJJF's own chart: red — metal accent — a white zone with red degree
   bars — white gap — metal accent — red — then the belt's own main color
   filling the rest. 7th & 8th degree use a SILVER accent; 9th degree
   switches to GOLD and its main color is red, so the bar reads as one
   continuous red mass at the end, exactly like the reference chart. */
function coralBeltBar(r, width, height){
  var mainColor = r.secondaryColor || r.color;
  var accent = r.coralAccent;
  var radius = Math.max(3, Math.round(height*0.16));
  var stripeCount = 7;
  var segs = [
    {w:0.08, bg:"#C23B3B"},
    {w:0.05, bg:accent},
    {w:0.32, bg:"#FFFFFF", stripes:true},
    {w:0.05, bg:"#FFFFFF"},
    {w:0.05, bg:accent},
    {w:0.07, bg:"#C23B3B"}
  ];
  var html = '<div style="display:flex; align-items:stretch; width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; overflow:hidden; border:1px solid #17181A; flex:0 0 auto;">';
  segs.forEach(function(s){
    var segW = Math.max(1, Math.round(width*s.w));
    if(s.stripes){
      var barW = Math.max(1, Math.round(segW/(stripeCount*2.2)));
      var gap = Math.max(1, Math.round((segW - barW*stripeCount)/(stripeCount+1)));
      var bars = "";
      for(var i=0;i<stripeCount;i++){
        bars += '<div style="position:absolute; left:'+(gap+i*(barW+gap))+'px; top:0; bottom:0; width:'+barW+'px; background:#C23B3B;"></div>';
      }
      html += '<div style="position:relative; flex:0 0 '+segW+'px; background:'+s.bg+';">'+bars+'</div>';
    } else {
      html += '<div style="flex:0 0 '+segW+'px; background:'+s.bg+';"></div>';
    }
  });
  html += '<div style="flex:1; background:'+mainColor+';"></div>';
  html += '</div>';
  return html;
}

/* A belt drawn as a strap laid flat: the belt's own color fills the body,
   and a tip on the left holds the stripe marks as thin vertical bars,
   matching how a real belt (and IBJJF's own degree charts) actually look.
   Every colour belt carries a BLACK tag by default — sewn on regardless of
   how many stripes have been earned — except Black Belt, which carries a
   RED tag instead (rank.tagColor carries that choice; leaving it unset
   keeps the belt tag-less). A bicolor belt (e.g. Grey/White) is two
   horizontal lanes of solid color running the belt's FULL length — real
   belts are stitched from two strips of fabric side by side lengthwise,
   not cut diagonally. The coral/red degree belts (7th-9th) skip all of
   this and use coralBeltBar instead — see rank.coralAccent above. */
function beltSwatch(r, width, height){
  width = width || 96;
  height = height || Math.round(width*0.30);
  var radius = Math.max(3, Math.round(height*0.16));
  var marks = stripeMarksArray(r);

  if(r.coralAccent){
    return coralBeltBar(r, width, height);
  }
  var tagBg = r.tagColor || "#0E0E10";

  /* Bicolor kids belts (e.g. Grey/White) are the belt's base colour on the
     top AND bottom thirds, with the secondary colour running straight
     through the middle third — not two equal halves, and no gap between
     the bands — the way a real belt's contrast stripe is sewn straight
     down the middle. This same 3-band pattern continues on BOTH sides of
     the black tag, so it reads as one continuous belt with the tag simply
     laid over a small stretch of it. */
  function body(extraStyle){
    if(!r.secondaryColor){
      return '<div style="flex:1; background:'+r.color+'; '+(extraStyle||"")+'"></div>';
    }
    return '<div style="flex:1; display:flex; flex-direction:column; '+(extraStyle||"")+'">'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '<div style="flex:1; background:'+r.secondaryColor+';"></div>'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '</div>';
  }
  function laneSegment(w){
    return '<div style="flex:0 0 '+w+'px; display:flex; flex-direction:column;">'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '<div style="flex:1; background:'+r.secondaryColor+';"></div>'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '</div>';
  }

  if(!marks.length && !r.tagColor){
    if(!r.secondaryColor){
      return '<div style="width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; background:'+r.color+'; border:1px solid #17181A; flex:0 0 auto;"></div>';
    }
    return '<div style="display:flex; flex-direction:column; width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; overflow:hidden; border:1px solid #17181A; flex:0 0 auto;">'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '<div style="flex:1; background:'+r.secondaryColor+';"></div>'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '</div>';
  }

  /* A real belt only has room for 6 stripe positions on its tip (enough for
     a full Black Belt degree run, 1st through 6th). Once more than 6
     degrees are earned, a new one doesn't add a 7th bar — it replaces the
     oldest bar in place, so the belt always shows the 6 MOST RECENT degrees.
     Every bar is a FIXED width, sized off the 6-slot maximum rather than
     the actual count, and the bars are left-aligned in the tip — so a belt
     with 2 stripes isn't drawn any wider or thinner than one with 6, it
     simply has fewer bars filled in from the left. */
  var MAX_VISIBLE = 6;
  var visible = marks.length>MAX_VISIBLE ? marks.slice(marks.length-MAX_VISIBLE) : marks;
  var tipW = Math.max(Math.round(width*0.34), MAX_VISIBLE*5+8);
  if(tipW > width-6) tipW = Math.max(6, width-6);
  var barW = Math.max(1, Math.round(tipW/(MAX_VISIBLE*2.2)));
  var gap = Math.max(1, Math.round(tipW/(MAX_VISIBLE*6)));
  var bars = visible.map(function(c){ return '<div style="flex:0 0 '+barW+'px; align-self:stretch; background:'+c+';"></div>'; }).join("");
  var tagSegment = '<div style="flex:0 0 '+tipW+'px; background:'+tagBg+'; display:flex; align-items:center; justify-content:flex-start; gap:'+gap+'px; padding-left:'+gap+'px;">'+bars+'</div>';

  /* Bicolor belts show a small lead-in stretch of the 3-band pattern before
     the tag, so the belt reads as continuous fabric with the tag laid on
     top of it, not a solid black block replacing the belt's own colour. */
  var leadIn = r.secondaryColor ? laneSegment(Math.max(4, Math.round(width*0.09))) : "";

  return '<div style="display:flex; align-items:stretch; width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; overflow:hidden; border:1px solid #17181A; flex:0 0 auto;">'+
    leadIn + tagSegment +
    body() +
    '</div>';
}

function render(){
  var page = "";

  if(UI.page==="ranks"){ page = RanksPage(); crumb = crumbHtml("Grading","Styles & Ranks"); }
  else if(UI.page==="skills"){ page = SkillsPage(); crumb = crumbHtml("Grading","Skill Library"); }

  else if(UI.page==="events"){ page = EventsPage(); crumb = crumbHtml("Grading","Grading Events"); }
  else if(UI.page==="settings"){ page = SettingsPage(); crumb = crumbHtml("Grading","Settings"); }

  var html = '<div style="display:flex; width:100%; min-height:100vh; background:var(--bg);">';

function afterRender(){
  var ta = document.getElementById("downgradeReason");
  if(ta){
    ta.addEventListener("input", function(e){
      var ok = e.target.value.trim().length > 0;
      var btn = document.getElementById("downgradeConfirmBtn");
      if(btn){ btn.disabled = !ok; btn.style.opacity = ok ? "1" : ".45"; }
    });
  }
  if(UI.selectNameOnRender){
    UI.selectNameOnRender = false;
    var nameInput = document.getElementById("rankNameInput");
    if(nameInput){ nameInput.focus(); nameInput.select(); }
  }
  if(UI.selectStyleNameOnRender){
    UI.selectStyleNameOnRender = false;
    var styleNameInput = document.getElementById("styleNameEditInput");
    if(styleNameInput){ styleNameInput.focus(); styleNameInput.select(); }
  }
  /* Keep free-text drafts in sync with UI state on every keystroke — NOT via
     render(), which would fight the caret — so that a re-render triggered by
     an unrelated control (a stripe stepper, a style-tag toggle, etc.) rebuilds
     these inputs from the up-to-date value instead of snapping back to stale
     state and silently discarding what was typed. */
  var rankNameEl = document.getElementById("rankNameInput");
  if(rankNameEl) rankNameEl.addEventListener("input", function(e){ if(UI.rankDraft) UI.rankDraft.name = e.target.value; });
  var skillNameEl = document.getElementById("newSkillNameInput");
  if(skillNameEl) skillNameEl.addEventListener("input", function(e){ UI.newSkillNameDraft = e.target.value; });
  var skillDescEl = document.getElementById("newSkillDescInput");
  if(skillDescEl) skillDescEl.addEventListener("input", function(e){ UI.newSkillDescDraft = e.target.value; });
  var templateNameEl = document.getElementById("templateStyleNameInput");
  if(templateNameEl) templateNameEl.addEventListener("input", function(e){ UI.templateStyleNameDraft = e.target.value; });
  var newStyleNameEl = document.getElementById("newStyleNameInput");
  if(newStyleNameEl) newStyleNameEl.addEventListener("input", function(e){ UI.newStyleNameDraft = e.target.value; });
  var styleNameEditEl = document.getElementById("styleNameEditInput");
  if(styleNameEditEl){
    styleNameEditEl.addEventListener("input", function(e){ UI.editStyleNameDraft = e.target.value; });
    styleNameEditEl.addEventListener("keydown", function(e){
      if(e.key==="Enter") App.saveStyleName();
      else if(e.key==="Escape") App.cancelEditStyleName();
    });
  }
}

/* Builds a fresh {name, classTypes, ranks} draft from a template id — shared by
   "Start from template", "Build from scratch" (when based on a template), and
   nothing else touches DB.styles here, so callers are free to rename the result
   before saving it. */

    var defs = buildIbjjfRankDefs();

function buildIbjjfRankDefs(){
  var WHITE="#FFFFFF", RED=IBJJF_BLACK_TAG_COLOR, BLACK="#17181A", SILVER="#B8BCC2", GOLD="#D9A441";

  // Every colour belt — every kids belt from White through Green/Black, plus
  // the adult Blue, Purple, Brown and Black belts — is 5 SEPARATE ranks on
  // the ladder, 0 through 4 stripes, each its own rung a student is promoted
  // into (same pattern as Black Belt's 0-through-6 rungs below), rather than
  // one rank with an editable stripe count. Degree marks are WHITE only —
  // real BJJ belts don't use coloured stripes on the adult ranks; colour is
  // reserved for the belt itself (and, on Black and Red, for the tag sewn
  // onto the tip — see tagColor below). Red/Black, Red/White and Red Belt
  // are themselves degree milestones, so they carry no stripes of their own.
  var K = ["Kids Fundamentals"], KS = ["Kids Fundamentals","Kids Sparring"], A = ["Adult Fundamentals"], AS = ["Adult Fundamentals","Adult Sparring"], COMP = ["Adult Sparring","Competition Team"];

  // Splits one belt's total classes/days evenly across its 5 stripe rungs
  // (0 stripes carries no " · N Stripes" suffix, matching Black Belt).
  function colourRungs(name, color, secondaryColor, classTotal, dayTotal, weeklyCap, scope){
    var perClass = Math.round(classTotal/5), perDay = Math.round(dayTotal/5);
    var rows = [];
    for(var n=0;n<=4;n++){
      var rowName = n===0 ? name : name+' · '+n+' Stripe'+(n===1?'':'s');
      rows.push([rowName, color, secondaryColor, [{count:n,color:WHITE}], perClass, perDay, weeklyCap, scope, BLACK, null]);
    }
    return rows;
  }
  // Black Belt is 7 SEPARATE ranks on the ladder — 0 stripes (fresh Black
  // Belt) through 6 stripes (6th degree) — each its own rung a student is
  // promoted into, same white stripe marks as every other colour belt.
  // Beyond 6 stripes a Black Belt promotes into the Red/Black (7th Degree)
  // coral belt instead of a 7th rung here.
  function blackTier(n){ return [{count:n,color:WHITE}]; }

  // tagColor is the small tab sewn onto the belt's tip, independent of the
  // belt's own colour — EVERY colour belt (kids and adult alike) carries a
  // black tag by default, always visible even before any stripe is earned;
  // Black Belt is the one exception, with a red tag instead. The coral/red
  // degree belts (7th-9th) use their own coralAccent look instead (below).
  //
  // coralAccent marks the three coral/red degree belts, which are built as
  // a fixed decorative bar rather than the usual tag+stripes: red — metal
  // accent — a white stripe zone with red bars — white gap — metal accent —
  // red — then the belt's own main colour filling the rest. 7th and 8th
  // degree use a SILVER accent; 9th degree switches to GOLD and its main
  // colour is red, so the bar reads as one continuous red mass at the end.
  var defs = []
    .concat(colourRungs("White Belt",        "#FFFFFF", null,      40,  180, 3, K))
    .concat(colourRungs("Grey/White Belt",   "#9CA3AF", "#FFFFFF", 40,  180, 3, K))
    .concat(colourRungs("Grey Belt",         "#9CA3AF", null,      90,  365, 3, K))
    .concat(colourRungs("Grey/Black Belt",   "#9CA3AF", "#17181A", 90,  365, 3, KS))
    .concat(colourRungs("Yellow/White Belt", "#F0C419", "#FFFFFF", 90,  365, 3, KS))
    .concat(colourRungs("Yellow Belt",       "#F0C419", null,      90,  365, 3, KS))
    .concat(colourRungs("Yellow/Black Belt", "#F0C419", "#17181A", 90,  365, 3, KS))
    .concat(colourRungs("Orange/White Belt", "#E8792B", "#FFFFFF", 90,  365, 3, KS))
    .concat(colourRungs("Orange Belt",       "#E8792B", null,      90,  365, 3, KS))
    .concat(colourRungs("Orange/Black Belt", "#E8792B", "#17181A", 90,  365, 3, KS))
    .concat(colourRungs("Green/White Belt",  "#3FA66B", "#FFFFFF", 90,  365, 3, KS))
    .concat(colourRungs("Green Belt",        "#3FA66B", null,      90,  365, 3, KS))
    .concat(colourRungs("Green/Black Belt",  "#3FA66B", "#17181A", 90,  365, 4, KS))
    .concat(colourRungs("Blue Belt",         "#3B5FCB", null,      200, 730, 4, A))
    .concat(colourRungs("Purple Belt",       "#6B3FA0", null,      160, 548, 4, AS))
    .concat(colourRungs("Brown Belt",        "#7A4A22", null,      130, 365, 4, AS))
    .concat([
      // IBJJF Black Belt-and-up: classCount and weeklyCap are both 0 (neither
      // classes nor a weekly cap are tracked from Black Belt onward —
      // years-in-rank is the only gate) and minDays holds the official IBJJF
      // years-per-degree figure (as days, years*365): 3-3-3-5-5-5-7-7-10,
      // Red (9th) is the top rank with nothing to wait for.
      ["Black Belt",                   "#17181A", null,      blackTier(0),                 0, 1095,  0, COMP, RED,   null],
      ["Black Belt · 1 Stripe",        "#17181A", null,      blackTier(1),                  0, 1095,  0, COMP, RED,   null],
      ["Black Belt · 2 Stripes",       "#17181A", null,      blackTier(2),                  0, 1095,  0, COMP, RED,   null],
      ["Black Belt · 3 Stripes",       "#17181A", null,      blackTier(3),                 0, 1825,  0, COMP, RED,   null],
      ["Black Belt · 4 Stripes",       "#17181A", null,      blackTier(4),                 0, 1825,  0, COMP, RED,   null],
      ["Black Belt · 5 Stripes",       "#17181A", null,      blackTier(5),                 0, 1825,  0, COMP, RED,   null],
      ["Black Belt · 6 Stripes",       "#17181A", null,      blackTier(6),                 0, 2555,  0, COMP, RED,   null],
      ["Red/Black Belt (7th Degree)",  "#C23B3B", "#17181A", [],                          0, 2555,  0, COMP, null,  SILVER],
      ["Red/White Belt (8th Degree)",  "#C23B3B", "#FFFFFF", [],                          0, 3650,  0, COMP, null,  SILVER],
      ["Red Belt (9th Degree)",        "#C23B3B", null,      [],                          0, 0,     0, COMP, null,  GOLD]
    ]);

  return defs.map(function(d,i){
    return { name:d[0], order:i+1, color:d[1], secondaryColor:d[2], stripeTiers:d[3], classCount:d[4], minDays:d[5], weeklyCap:d[6], scope:d[7].slice(), tagColor:d[8], coralAccent:d[9] };
  });
}

    '</div></div>';

function stripeTiersHtml(d){
  var tiers = d.stripeTiers && d.stripeTiers.length ? d.stripeTiers : [{count:0,color:"#1A1A1A"}];
  var total = tiers.reduce(function(sum,t){return sum+t.count;},0);
  var html = '<div style="display:flex; flex-direction:column; gap:8px; min-width:250px;">';
  tiers.forEach(function(t, i){
    html += '<div style="display:flex; align-items:center; gap:9px;">'+
      '<div class="stepper"><button onclick="App.stepDraftTier('+i+',-1,0,12)">−</button><span class="val">'+t.count+'</span><button onclick="App.stepDraftTier('+i+',1,0,12)">+</button></div>'+
      '<input type="color" value="'+esc(t.color)+'" onchange="App.setDraftTierColor('+i+', this.value)" style="width:38px; height:32px; padding:2px; border-radius:7px; border:1px solid var(--border); background:var(--surface); cursor:pointer;">'+
      '<span style="font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;">'+t.count+' stripe'+(t.count===1?"":"s")+' this color</span>'+
      (tiers.length>1 ? '<button onclick="App.removeDraftTier('+i+')" title="Remove color tier" style="background:none; border:none; color:var(--text-faint); padding:2px; margin-left:auto;">'+icon("close",13)+'</button>' : '')+
      '</div>';
  });
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:2px;">'+
    (tiers.length<5 ? '<button class="btn btn-ghost" style="padding:6px 10px; font-size:11.5px;" onclick="App.addDraftTier()">'+icon("plus",12)+'Add color tier</button>' : '<span></span>')+
    '<span style="font-size:11px; color:var(--text-faint);">'+total+' total</span>'+
    '</div>';
  html += '<div style="font-size:10.5px; color:var(--text-faint); max-width:250px;">Each tier is a run of stripes in one color before the next color begins — e.g. 4 white, then 4 yellow, then 4 red, like IBJJF\'s kids degree system.</div>';
  if(total>6) html += '<div style="font-size:10.5px; color:var(--text-faint); max-width:250px; background:var(--surface-2); border-radius:7px; padding:8px 10px;">A belt only has room for 6 stripes. Past '+total+' total, the belt shows the 6 most recent — earlier colors get replaced as new ones are earned, same as a real belt.</div>';

  html += '<div style="height:1px; background:var(--border); margin:2px 0;"></div>';
  html += '<div style="display:flex; flex-direction:column; gap:6px;">';
  html += '<div style="display:flex; gap:6px; flex-wrap:wrap;">'+
    '<button class="btn btn-ghost" style="padding:6px 10px; font-size:11.5px;" onclick="App.copyStripes()" title="Copy this stripe setup to reuse on other belts">'+icon("copy",12)+'Copy stripes</button>'+
    (UI.stripeClipboard ? '<button class="btn btn-ghost" style="padding:6px 10px; font-size:11.5px;" onclick="App.pasteStripes()" title="Paste the copied stripe setup here">'+icon("paste",12)+'Paste stripes</button>' : '')+
    '</div>';
  if(UI.stripeClipboard){
    var style = getStyle(UI.selectedStyleId);
    var otherCount = style ? style.ranks.filter(function(r){ return r.id!==UI.rankFormEditId; }).length : 0;
    html += '<div style="display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 9px;">'+
      '<span style="font-size:10.5px; color:var(--text-muted); flex:1;">Clipboard: '+stripesSummaryText(UI.stripeClipboard.tiers)+' (from '+esc(UI.stripeClipboard.sourceName)+')</span>'+
      (otherCount>0 ? '<button class="btn btn-ghost" style="padding:5px 9px; font-size:11px; flex:0 0 auto;" onclick="App.openApplyStripes()">Apply to other belts…</button>' : '')+
      '<button onclick="App.clearStripeClipboard()" title="Clear clipboard" style="background:none; border:none; color:var(--text-faint); padding:2px; display:flex; flex:0 0 auto;">'+icon("close",12)+'</button>'+
      '</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

    var expanded = UI.expandedSkillId===sk.id;
    html += '<div style="border-bottom:1px solid var(--border);">'+
      '<button onclick="App.toggleExpandSkill(\''+sk.id+'\')" style="width:100%; text-align:left; border:none; background:none; padding:14px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; color:var(--text);">'+
      '<div style="width:32px; height:32px; border-radius:9px; background:var(--info-bg); color:var(--info); display:flex; align-items:center; justify-content:center; flex:0 0 auto;">'+icon("belt",16)+'</div>'+
      '<div style="flex:1; min-width:0;"><div style="font-size:13.5px; font-weight:600;">'+esc(sk.name)+'</div>'+
      '<div style="font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:420px;">'+esc(sk.description)+'</div></div>'+
      '<span class="badge" style="background:var(--info-bg); color:var(--info);">used in '+usedIn.length+' ranks</span>'+
      '<span style="transform:rotate('+(expanded?180:0)+'deg); display:flex;">'+icon("chev",16)+'</span></button>';
    if(expanded){
      html += '<div style="padding:0 18px 16px 64px; display:flex; flex-direction:column; gap:8px;">'+
        '<div style="font-size:12px; color:var(--text-muted); max-width:600px;">'+esc(sk.description)+'</div>'+
        (usedIn.length ? '<div style="display:flex; gap:6px; flex-wrap:wrap;">'+usedIn.map(function(n){return '<span class="chip">'+esc(n)+'</span>';}).join("")+'</div>' : '<div style="font-size:12px; color:var(--text-faint);">Not attached to any rank yet.</div>')+
        '</div>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ============== STUDENTS / GRADING PAGE ============== */
function currentStudent(){ return DB.students.find(function(s){ return s.id===UI.selectedStudentId; }); }

function StudentsPage(){

    var el = computeEligibility(s);
    html += '<button onclick="App.selectStudent(\''+s.id+'\')" style="width:100%; text-align:left; border:none; background:'+(active?"var(--accent-tint)":"var(--surface)")+'; border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:10px; cursor:pointer;">'+

      '<div style="flex:1; min-width:0;"><div style="font-size:13px; font-weight:600; color:var(--text);">'+esc(s.name)+'</div>'+
      '<div style="font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:5px;"><span style="width:8px; height:8px; border-radius:3px; background:'+(rk?rk.color:"transparent")+'; border:1px solid var(--border); display:inline-block;"></span>'+esc(rk?rk.name:"")+'</div></div>'+
      (el.hasNext && el.eligible ? '<span style="width:8px; height:8px; border-radius:999px; background:var(--success); flex:0 0 auto;" title="Eligible"></span>' : '')+
      '</button>';
  });

function StudentDetail(s){
  var style = getStyle(s.styleId);
  if(!style){
    return '<div class="card" style="padding:40px; text-align:center; color:var(--text-muted); font-size:13px;">'+esc(s.name)+'\'s style was deleted. Recreate the style, or reassign them, to continue grading.</div>';
  }
  var rk = getRank(s.styleId, s.rankId);
  var el = computeEligibility(s);
  var html = '';

  html += '<div style="display:flex; align-items:center; gap:14px;">'+
    '<div style="width:48px; height:48px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border);"></div>'+
    '<div><h1 style="font-size:19px; font-weight:800;">'+esc(s.name)+'</h1><div style="font-size:12px; color:var(--text-muted); margin-top:2px;">'+esc(style.name)+' · member since '+esc(s.since)+'</div></div></div>';

  html += '<div style="display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start;">';

  html += '<div class="card" style="padding:20px; display:flex; flex-direction:column; gap:14px;">';
  html += '<div style="display:flex; align-items:center; gap:12px;">'+beltSwatch(rk, 118, 32)+
    '<div><div style="font-size:15px; font-weight:700;">'+esc(rk.name)+'</div><div style="font-size:12px; color:var(--text-muted);">Since '+esc(s.since)+'</div></div></div>';

  if(el.hasNext){
    if(el.eligible){
      html += '<div class="badge" style="background:var(--success-bg); color:var(--success); width:fit-content;">'+icon("check",13)+'Eligible to grade</div>'+
        '<div style="font-size:11.5px; color:var(--text-muted);">You were notified when this happened — grading is still your call.</div>';
    } else {
      html += '<div class="badge" style="background:var(--accent-tint); color:var(--text); width:fit-content;">In progress</div>';
    }
    html += '<div style="height:1px; background:var(--border);"></div>';
    if(el.yearsGated){
      // Floor, never round: eligibility itself compares raw days, so a
      // rounded display could show e.g. "3.0 / 3 years" a day before the
      // gate actually opens. Flooring guarantees the number shown here
      // never reaches the requirement before el.eligible actually flips.
      var elapsedYears = Math.floor(el.elapsedDays/365*10)/10;
      var requiredYears = daysToYears(el.requiredDays);
      html += progressRow("Time in rank", elapsedYears, requiredYears, el.eligible);
      if(el.needSkills>0){
        html += progressRow("Skills signed off (optional)", el.signedCount, el.needSkills, true);
      }
      html += '<div style="font-size:11px; color:var(--text-faint);">Black Belt and up grade on years in rank alone — classes aren\'t tracked here.</div>';
    } else {
      html += progressRow("Attendance toward "+esc(el.nextRank.name), s.classesAttended, el.nextRank.classCount, el.classesOk);
      html += progressRow("Skills signed off", el.signedCount, el.needSkills, el.skillsOk);
      html += '<button class="btn btn-ghost" style="justify-content:center;" onclick="App.logClass()">'+icon("plus",14)+'Log a class (+1)</button>';
    }
  } else {
    html += '<div class="badge" style="background:var(--info-bg); color:var(--info); width:fit-content;">Top rank in this style</div>';
  }

  html += '<div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">'+
    '<button class="btn btn-primary" style="justify-content:center;" onclick="App.openGrade()">Grade student</button>'+
    '<button class="btn btn-danger-outline" style="justify-content:center;" onclick="App.openDowngrade()">Downgrade</button></div>';
  html += '</div>';

  html += '<div style="display:flex; flex-direction:column; gap:16px;">';
  html += '<div class="card" style="padding:18px;"><div style="font-family:Manrope; font-weight:700; font-size:14px; margin-bottom:12px;">Skills for '+esc(rk.name)+'</div>';
  if(!rk.skills.length){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">No skills required for this rank.</div>';
  } else {
    rk.skills.forEach(function(sid){
      var st = s.skillStatus[sid] || "not_started";
      var label = st==="signed" ? "Signed off" : st==="learning" ? "Learning" : "Not started";
      var bg = st==="signed" ? "var(--success-bg)" : st==="learning" ? "var(--accent-tint)" : "var(--surface-2)";
      var col = st==="signed" ? "var(--success)" : st==="learning" ? "var(--text)" : "var(--text-muted)";
      html += '<div style="display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--border);">'+
        '<div style="flex:1; font-size:13px; font-weight:500;">'+esc(skillName(sid))+'</div>'+
        '<button onclick="App.cycleSkill(\''+sid+'\')" class="badge" style="background:'+bg+'; color:'+col+'; border:none; cursor:pointer;">'+label+'</button></div>';
    });
    html += '<div style="font-size:11px; color:var(--text-faint); margin-top:8px;">Click a status to cycle it — Not started → Learning → Signed off.</div>';
  }
  html += '</div>';

  html += '<div class="card" style="padding:18px;"><div style="font-family:Manrope; font-weight:700; font-size:14px; margin-bottom:14px;">Rank history</div>';
  s.history.forEach(function(h, i){
    var isDown = h.type==="downgrade";
    var dot = isDown ? "var(--danger)" : "var(--success)";
    var tagBg = isDown ? "var(--danger-bg)" : "var(--success-bg)";
    var tagCol = isDown ? "var(--danger)" : "var(--success)";
    html += '<div style="display:flex; gap:14px; padding-bottom:16px;">'+
      '<div style="display:flex; flex-direction:column; align-items:center;"><div style="width:10px; height:10px; border-radius:999px; background:'+dot+';"></div>'+
      (i<s.history.length-1 ? '<div style="width:1.5px; flex:1; background:var(--border); margin-top:2px;"></div>' : '')+'</div>'+
      '<div style="flex:1;"><div style="display:flex; align-items:center; gap:8px;"><span style="font-size:13.5px; font-weight:700;">'+esc(rankLabel(s.styleId,h.rankId))+'</span>'+
      '<span class="badge" style="background:'+tagBg+'; color:'+tagCol+';">'+(isDown?"DOWNGRADE":h.type.toUpperCase())+'</span></div>'+
      '<div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">'+esc(h.date)+' · '+esc(h.by)+'</div>'+
      (h.note ? '<div style="font-size:12px; color:var(--text); margin-top:5px; background:var(--surface-2); border-radius:6px; padding:8px 10px; max-width:520px;">'+esc(h.note)+'</div>' : '')+
      '</div></div>';
  });
  html += '</div>';
  html += '</div>';
  html += '</div>';
  return html;
}
function progressRow(label, val, target, ok){
  var pct = Math.max(0, Math.min(100, Math.round((val/target)*100)));
  return '<div style="display:flex; flex-direction:column; gap:6px;">'+
    '<div style="display:flex; justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-muted); font-weight:600;">'+label+'</span><span style="font-weight:700;">'+val+' / '+target+'</span></div>'+
    '<div style="height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+(ok?"var(--success)":"var(--accent)")+';"></div></div></div>';
}

/* ============== ACTIONS ============== */
var App = {
  nav: function(page){ UI.page = page; UI.toast=null; render(); },

  selectStyle: function(id){ UI.selectedStyleId=id; UI.rankFormOpen=false; UI.editStyleNameOpen=false; var st=getStyle(id); UI.selectedRankId = st.ranks[0] ? st.ranks[0].id : null; render(); },
  openCreateStyle: function(tab){ UI.createStyleOpen=true; UI.newStyleError=false; UI.templateStyleNameDraft=""; UI.newStyleNameDraft=""; UI.scratchBaseTemplateId=null; if(tab) UI.createStyleTab=tab; render(); },
  closeCreateStyle: function(){ UI.createStyleOpen=false; render(); },
  setCreateTab: function(t){ UI.createStyleTab=t; render(); },
  pickTemplate: function(id){ UI.templatePickId=id; render(); },
  setScratchBaseTemplate: function(id){ UI.scratchBaseTemplateId = (UI.scratchBaseTemplateId===id) ? null : id; render(); },
  askDeleteStyle: function(id){ UI.confirmDeleteStyleId=id; render(); },
  cancelDeleteStyle: function(){ UI.confirmDeleteStyleId=null; render(); },
  deleteStyle: function(id){
    DB.styles = DB.styles.filter(function(s){ return s.id!==id; });
    UI.confirmDeleteStyleId=null;
    if(UI.selectedStyleId===id){
      UI.selectedStyleId = DB.styles.length ? DB.styles[0].id : null;
      UI.selectedRankId = (DB.styles.length && DB.styles[0].ranks.length) ? DB.styles[0].ranks[0].id : null;
      UI.editStyleNameOpen = false;
    }
    UI.toast = "Style deleted.";
    render();
  },
  duplicateStyle: function(id){
    var s = getStyle(id);
    if(!s) return;
    var ranks = s.ranks.map(function(r){
      return { id:nextId("rank"), name:r.name, order:r.order, color:r.color, secondaryColor:r.secondaryColor||null, tagColor:r.tagColor||null, coralAccent:r.coralAccent||null,
        stripeTiers:(r.stripeTiers||[]).map(function(t){ return {count:t.count, color:t.color}; }),
        classCount:r.classCount, minDays:r.minDays, weeklyCap:r.weeklyCap, scope:r.scope.slice(), skills:r.skills.slice() };
    });
    var newId = nextId("style");
    var style = { id:newId, name:s.name+" (Copy)", classTypes:s.classTypes.slice(), ranks:ranks };
    DB.styles.push(style);
    UI.selectedStyleId = newId; UI.selectedRankId = ranks[0] ? ranks[0].id : null; UI.confirmDeleteStyleId=null;
    UI.toast = "\"" + style.name + "\" created as a copy of \"" + s.name + "\" — edit it freely, the original is untouched.";
    render();
  },
  openEditStyleName: function(){
    var style = getStyle(UI.selectedStyleId);
    if(!style) return;
    UI.editStyleNameOpen = true; UI.editStyleNameDraft = style.name; UI.editStyleNameError = false; UI.selectStyleNameOnRender = true;
    render();
  },
  cancelEditStyleName: function(){ UI.editStyleNameOpen=false; UI.editStyleNameError=false; render(); },
  saveStyleName: function(){
    var input = document.getElementById("styleNameEditInput");
    var name = (input ? input.value : UI.editStyleNameDraft).trim();
    if(!name){ UI.editStyleNameError=true; render(); return; }
    var style = getStyle(UI.selectedStyleId);
    if(!style) return;
    style.name = name;
    UI.editStyleNameOpen=false; UI.editStyleNameError=false;
    UI.toast = "Style renamed to \"" + name + "\".";
    render();
  },
  createStyleFromTemplate: function(){
    var draft = buildStyleFromTemplateId(UI.templatePickId);
    var customName = (UI.templateStyleNameDraft||"").trim();
    var name = customName || draft.name;
    var id = nextId(UI.templatePickId);
    var style = { id:id, name:name, classTypes:draft.classTypes, ranks:draft.ranks };
    DB.styles.push(style);
    UI.selectedStyleId = id; UI.selectedRankId = style.ranks[0] ? style.ranks[0].id : null;
    UI.createStyleOpen=false; UI.templateStyleNameDraft="";
    UI.toast = "\"" + name + "\" created — " + style.ranks.length + " ranks ready to customize.";
    render();
  },
  createBlankStyle: function(){
    var input = document.getElementById("newStyleNameInput");
    var name = (input ? input.value : (UI.newStyleNameDraft||"")).trim();
    if(!name){ UI.newStyleError=true; render(); return; }
    var id = nextId("style");
    var style;
    if(UI.scratchBaseTemplateId){
      var draft = buildStyleFromTemplateId(UI.scratchBaseTemplateId);
      style = { id:id, name:name, classTypes:draft.classTypes, ranks:draft.ranks };
    } else {
      style = { id:id, name:name, classTypes:["General"], ranks:[] };
    }
    DB.styles.push(style);
    UI.selectedStyleId=id; UI.selectedRankId = style.ranks[0] ? style.ranks[0].id : null;
    UI.createStyleOpen=false; UI.newStyleError=false; UI.newStyleNameDraft=""; UI.scratchBaseTemplateId=null;
    UI.toast = style.ranks.length ? ("\"" + name + "\" created — " + style.ranks.length + " ranks ready to customize.") : ("\"" + name + "\" created — add your first rank.");
    render();
    if(!style.ranks.length) App.openAddRank();
  },

  selectRank: function(id){ UI.selectedRankId=id; UI.rankFormOpen=false; render(); },
  openAddRank: function(){
    UI.rankFormOpen=true; UI.rankFormMode="add"; UI.rankFormEditId=null; UI.rankNameError=false;
    var style = getStyle(UI.selectedStyleId);
    UI.rankDraft = { name:"", color:"#FFFFFF", secondaryColor:null, tagColor:null, coralAccent:null, stripeTiers:[{count:0,color:"#1A1A1A"}], classCount:40, minDays:120, weeklyCap:3, scope: style.classTypes.length?[style.classTypes[0]]:[], skills:[] };
    render();
  },
  openEditRank: function(id){
    var style = getStyle(UI.selectedStyleId); var r = getRank(style.id, id);
    UI.rankFormOpen=true; UI.rankFormMode="edit"; UI.rankFormEditId=id; UI.rankNameError=false;
    var tiers = (r.stripeTiers && r.stripeTiers.length ? r.stripeTiers : [{count:0,color:"#1A1A1A"}]).map(function(t){ return {count:t.count, color:t.color}; });
    UI.rankDraft = { name:r.name, color:r.color, secondaryColor:r.secondaryColor||null, tagColor:r.tagColor||null, coralAccent:r.coralAccent||null, stripeTiers:tiers, classCount:r.classCount, minDays:r.minDays, weeklyCap:r.weeklyCap, scope:r.scope.slice(), skills:r.skills.slice() };
    render();
  },
  cancelRankForm: function(){ UI.rankFormOpen=false; UI.rankDraft=null; render(); },
  stepDraft: function(field, delta, min, max){
    var v = UI.rankDraft[field] + delta;
    if(v<min) v=min; if(v>max) v=max;
    UI.rankDraft[field]=v; render();
  },
  stepDraftYears: function(field, deltaYears, minYears, maxYears){
    var v = daysToYears(UI.rankDraft[field]) + deltaYears;
    if(v<minYears) v=minYears; if(v>maxYears) v=maxYears;
    UI.rankDraft[field]=yearsToDays(v); render();
  },
  setDraftColorField: function(field, value){ UI.rankDraft[field]=value; render(); },
  enableDraftSecondary: function(){ UI.rankDraft.secondaryColor = "#FFFFFF"; render(); },
  clearDraftSecondary: function(){ UI.rankDraft.secondaryColor = null; render(); },
  stepDraftTier: function(i, delta, min, max){
    var t = UI.rankDraft.stripeTiers[i];
    var v = t.count + delta;
    if(v<min) v=min; if(v>max) v=max;
    t.count = v; render();
  },
  setDraftTierColor: function(i, value){ UI.rankDraft.stripeTiers[i].color = value; render(); },
  addDraftTier: function(){
    var tiers = UI.rankDraft.stripeTiers;
    var palette = ["#1A1A1A","#F0C419","#C23B3B","#3B5FCB","#FFFFFF"];
    var used = tiers.map(function(t){return t.color;});
    var next = palette.filter(function(c){return used.indexOf(c)===-1;})[0] || palette[tiers.length % palette.length];
    tiers.push({count:1, color:next});
    render();
  },
  removeDraftTier: function(i){
    var tiers = UI.rankDraft.stripeTiers;
    if(tiers.length<=1) return;
    tiers.splice(i,1); render();
  },
  /* Stripe copy/paste — lets you set up one belt's stripe tiers (colors +
     counts) once, then reuse that exact setup on other belts instead of
     re-picking colors and counts by hand every time. */
  copyStripes: function(){
    var d = UI.rankDraft;
    if(!d) return;
    var name = (document.getElementById("rankNameInput") ? document.getElementById("rankNameInput").value : d.name) || d.name || "this belt";
    UI.stripeClipboard = { tiers: d.stripeTiers.map(function(t){ return {count:t.count, color:t.color}; }), sourceName: name };
    UI.toast = "Stripes copied from \"" + name + "\" — paste here or apply to other belts.";
    render();
  },
  pasteStripes: function(){
    if(!UI.stripeClipboard || !UI.rankDraft) return;
    UI.rankDraft.stripeTiers = UI.stripeClipboard.tiers.map(function(t){ return {count:t.count, color:t.color}; });
    render();
  },
  openApplyStripes: function(){
    if(!UI.stripeClipboard) return;
    UI.applyStripesOpen = true; UI.applyStripesTargets = [];
    render();
  },
  closeApplyStripes: function(){ UI.applyStripesOpen=false; UI.applyStripesTargets=[]; render(); },
  clearStripeClipboard: function(){ UI.stripeClipboard=null; render(); },
  toggleApplyStripesTarget: function(id){
    var i = UI.applyStripesTargets.indexOf(id);
    if(i>-1) UI.applyStripesTargets.splice(i,1); else UI.applyStripesTargets.push(id);
    render();
  },
  toggleAllApplyStripesTargets: function(){
    var style = getStyle(UI.selectedStyleId);
    var ranks = style.ranks.filter(function(r){ return r.id!==UI.rankFormEditId; });
    if(UI.applyStripesTargets.length===ranks.length){ UI.applyStripesTargets=[]; }
    else { UI.applyStripesTargets = ranks.map(function(r){ return r.id; }); }
    render();
  },
  confirmApplyStripes: function(){
    var style = getStyle(UI.selectedStyleId);
    var clip = UI.stripeClipboard;
    if(!style || !clip || !UI.applyStripesTargets.length) return;
    var appliedTo = [];
    UI.applyStripesTargets.forEach(function(id){
      var r = getRank(style.id, id);
      if(!r) return;
      r.stripeTiers = clip.tiers.map(function(t){ return {count:t.count, color:t.color}; });
      appliedTo.push(r.name);
    });
    var n = appliedTo.length;
    UI.toast = "Applied " + stripesSummaryText(clip.tiers) + " to " + n + " belt" + (n===1?"":"s") + (n<=3 ? (": " + appliedTo.join(", ")) : ".");
    UI.applyStripesOpen = false; UI.applyStripesTargets = [];
    render();
  },
  toggleDraftScope: function(ct){
    var i = UI.rankDraft.scope.indexOf(ct);
    if(i>-1) UI.rankDraft.scope.splice(i,1); else UI.rankDraft.scope.push(ct);
    render();
  },
  toggleDraftSkill: function(id){
    var i = UI.rankDraft.skills.indexOf(id);
    if(i>-1) UI.rankDraft.skills.splice(i,1); else UI.rankDraft.skills.push(id);
    render();
  },
  submitRank: function(){
    var input = document.getElementById("rankNameInput");
    var name = input ? input.value.trim() : "";
    if(!name){ UI.rankNameError=true; render(); return; }
    var style = getStyle(UI.selectedStyleId);
    var d = UI.rankDraft;
    if(UI.rankFormMode==="add"){
      var order = style.ranks.length ? Math.max.apply(null, style.ranks.map(function(r){return r.order;})) + 1 : 1;
      var rank = { id:nextId("rank"), name:name, order:order, color:d.color, secondaryColor:d.secondaryColor, tagColor:d.tagColor||null, coralAccent:d.coralAccent||null, stripeTiers:d.stripeTiers.map(function(t){return {count:t.count,color:t.color};}), classCount:d.classCount, minDays:d.minDays, weeklyCap:d.weeklyCap, scope:d.scope.slice(), skills:d.skills.slice() };
      style.ranks.push(rank);
      UI.selectedRankId = rank.id;
      UI.toast = "\"" + name + "\" added to " + style.name + ".";
    } else {
      var r = getRank(style.id, UI.rankFormEditId);
      r.name=name; r.color=d.color; r.secondaryColor=d.secondaryColor; r.tagColor=d.tagColor||null; r.coralAccent=d.coralAccent||null; r.stripeTiers=d.stripeTiers.map(function(t){return {count:t.count,color:t.color};}); r.classCount=d.classCount; r.minDays=d.minDays; r.weeklyCap=d.weeklyCap; r.scope=d.scope.slice(); r.skills=d.skills.slice();
      UI.selectedRankId = r.id;
      UI.toast = "\"" + name + "\" updated.";
    }
    UI.rankFormOpen=false; UI.rankDraft=null;
    render();
  },
  deleteRank: function(id){
    var style = getStyle(UI.selectedStyleId);
    style.ranks = style.ranks.filter(function(r){ return r.id!==id; });
    style.ranks.sort(function(a,b){return a.order-b.order;}).forEach(function(r,i){ r.order=i+1; });
    if(UI.selectedRankId===id) UI.selectedRankId = style.ranks[0] ? style.ranks[0].id : null;
    render();
  },
  /* Copy an existing rank — base color, secondary, stripe tiers, requirements,
     scope and required skills all carry over — then drop straight into the
     Edit form so the only thing left to do is rename it and tweak what's different. */
  duplicateRank: function(id){
    var style = getStyle(UI.selectedStyleId);
    var r = getRank(style.id, id);
    if(!r) return;
    var baseName = r.name.replace(/ copy( \d+)?$/,'');
    var existingNames = style.ranks.map(function(x){return x.name;});
    var name = baseName + " copy", n = 1;
    while(existingNames.indexOf(name)>-1){ n++; name = baseName + " copy " + n; }
    var clone = {
      id: nextId("rank"),
      name: name,
      order: r.order + 1,
      color: r.color,
      secondaryColor: r.secondaryColor,
      tagColor: r.tagColor||null,
      coralAccent: r.coralAccent||null,
      stripeTiers: r.stripeTiers.map(function(t){ return {count:t.count, color:t.color}; }),
      classCount: r.classCount,
      minDays: r.minDays,
      weeklyCap: r.weeklyCap,
      scope: r.scope.slice(),
      skills: r.skills.slice()
    };
    style.ranks.forEach(function(x){ if(x.order > r.order) x.order += 1; });
    style.ranks.push(clone);
    style.ranks.sort(function(a,b){return a.order-b.order;}).forEach(function(x,i){ x.order = i+1; });
    UI.selectedRankId = clone.id;
    UI.toast = "\"" + esc(r.name) + "\" duplicated right below itself as \"" + esc(name) + "\" — rename and adjust it below.";
    UI.selectNameOnRender = true;
    App.openEditRank(clone.id);
  },

  /* Rank ladder drag-to-reorder. Deliberately avoids calling render() on
     dragover/dragenter — replacing the DOM mid-drag would abort the browser's
     native drag session. Only dragstart (state only, no render) and drop
     (the actual reorder) touch things; dragover/leave just tweak the target
     row's own border directly for a drop-position hint. */
  dragStart: function(e, id){
    UI.draggingRankId = id;
    e.dataTransfer.effectAllowed = "move";
    e.currentTarget.style.opacity = "0.4";
  },
  dragOverRow: function(e){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid var(--accent)";
  },
  dragLeaveRow: function(e){
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
  },
  dragEnd: function(e){
    if(e.currentTarget) e.currentTarget.style.opacity = "1";
    UI.draggingRankId = null;
  },
  dropOnRank: function(e, targetId){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
    var draggingId = UI.draggingRankId;
    UI.draggingRankId = null;
    if(!draggingId) return;
    if(draggingId===targetId) { render(); return; }
    var style = getStyle(UI.selectedStyleId);
    var ranks = style.ranks.slice().sort(function(a,b){return a.order-b.order;});
    var fromIdx = ranks.findIndex(function(r){return r.id===draggingId;});
    if(fromIdx<0) return;
    var moved = ranks.splice(fromIdx,1)[0];
    var insertIdx;
    if(targetId===null){
      insertIdx = ranks.length; // dropped on the "end of ladder" zone
    } else {
      var rect = e.currentTarget.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      insertIdx = ranks.findIndex(function(r){return r.id===targetId;});
      if(insertIdx<0) insertIdx = ranks.length;
      else if(after) insertIdx += 1;
    }
    ranks.splice(insertIdx, 0, moved);
    ranks.forEach(function(r,i){ r.order=i+1; });
    style.ranks = ranks;
    UI.selectedRankId = moved.id;
    UI.toast = "\"" + moved.name + "\" moved to position " + (insertIdx+1) + " of " + ranks.length + ".";
    render();
  },

  setSkillFilter: function(id){ UI.skillFilter=id; render(); },
  toggleSkillForm: function(){
    UI.skillFormOpen=!UI.skillFormOpen; UI.newSkillError=false;
    if(UI.skillFormOpen){ UI.newSkillNameDraft=""; UI.newSkillDescDraft=""; }
    render();
  },
  setNewSkillStyle: function(id){ UI.newSkillStyleId=id; render(); },
  toggleExpandSkill: function(id){ UI.expandedSkillId = UI.expandedSkillId===id ? null : id; render(); },
  submitSkill: function(){
    var nameEl = document.getElementById("newSkillNameInput");
    var descEl = document.getElementById("newSkillDescInput");
    var name = nameEl ? nameEl.value.trim() : "";
    var desc = descEl ? descEl.value.trim() : "";
    if(!name){ UI.newSkillError=true; render(); return; }
    var styleId = UI.newSkillStyleId || UI.selectedStyleId;
    DB.skills.push({ id:nextId("skill"), name:name, description: desc || "No description yet.", styleId: styleId });
    UI.skillFormOpen=false; UI.newSkillError=false; UI.newSkillNameDraft=""; UI.newSkillDescDraft="";
    UI.toast = "\"" + name + "\" added to the skill library.";
    render();
  },

  selectStudent: function(id){ UI.selectedStudentId=id; render(); },
  logClass: function(){
    var s = currentStudent();
    var before = computeEligibility(s);
    s.classesAttended += 1;
    var after = computeEligibility(s);
    if(after.hasNext && after.eligible && !(before.hasNext && before.eligible)){
      UI.toast = "🔔 " + s.name + " just became eligible to grade — owner notified.";
    }
    render();
  },
  cycleSkill: function(sid){
    var s = currentStudent();
    var cur = s.skillStatus[sid] || "not_started";
    var next = cur==="not_started" ? "learning" : cur==="learning" ? "signed" : "not_started";
    var before = computeEligibility(s);
    s.skillStatus[sid] = next;
    var after = computeEligibility(s);
    if(after.hasNext && after.eligible && !(before.hasNext && before.eligible)){
      UI.toast = "🔔 " + s.name + " just became eligible to grade — owner notified.";
    }
    render();
  },
  dismissToast: function(){ UI.toast=null; render(); },

  openGrade: function(){ var s=currentStudent(); UI.gradePickedRankId=s.rankId; UI.gradeOpen=true; UI.downgradeOpen=false; render(); },
  openDowngrade: function(){ var s=currentStudent(); UI.gradePickedRankId=s.rankId; UI.downgradeOpen=true; UI.gradeOpen=false; render(); },
  closeModals: function(){ UI.gradeOpen=false; UI.downgradeOpen=false; render(); },
  pickGradeRank: function(id){ UI.gradePickedRankId=id; render(); },
  confirmGrade: function(){
    var s = currentStudent();
    var style = getStyle(s.styleId);
    var fromRank = getRank(s.styleId, s.rankId);
    var toRank = getRank(s.styleId, UI.gradePickedRankId);
    var skipped = toRank.order - fromRank.order;
    var note = skipped>1 ? "Skipped " + (skipped-1) + " rank" + (skipped-1>1?"s":"") + " in between." : "";
    var today = formatToday();
    s.history.unshift({ rankId: toRank.id, type:"promotion", date: today, by:"Gus (Owner)", note: note });
    s.rankId = toRank.id;
    s.since = today;
    s.classesAttended = 0;
    s.skillStatus = {};
    UI.gradeOpen=false;
    UI.toast = esc(s.name) + " graded to " + esc(toRank.name) + ". Attendance counter reset to 0.";
    render();
  },
  confirmDowngrade: function(){
    var s = currentStudent();
    var toRank = getRank(s.styleId, UI.gradePickedRankId);
    var reasonEl = document.getElementById("downgradeReason");
    var reason = reasonEl ? reasonEl.value.trim() : "";
    if(!reason) return;
    var today = formatToday();
    s.history.unshift({ rankId: toRank.id, type:"downgrade", date: today, by:"Gus (Owner)", note:"Reason: " + reason });
    s.rankId = toRank.id;
    s.since = today;
    s.classesAttended = 0;
    s.skillStatus = {};
    UI.downgradeOpen=false;
    UI.toast = esc(s.name) + " downgraded to " + esc(toRank.name) + ".";
    render();
  },

  toggleFee: function(){ DB.settings.feeOn = !DB.settings.feeOn; render(); },
  toggleChannel: function(id){ DB.settings.channels[id] = !DB.settings.channels[id]; render(); },
  togglePerm: function(insId, styleKey){
    var ins = DB.settings.instructors.find(function(i){return i.id===insId;});
    ins.perm[styleKey] = !ins.perm[styleKey];
    render();
  },

  toggleSchedule: function(){ UI.scheduleOpen=!UI.scheduleOpen; render(); },
  createEvent: function(){
    var id = nextId("event");
    var evStyle = getStyle(UI.selectedStyleId);
    DB.events.unshift({ id:id, title:"New Grading Day"+(evStyle?" — "+evStyle.name:""), date:"TBD", venue:"Riverside — Main Mat", status:"scheduled",
      participants: DB.students.filter(function(s){ return computeEligibility(s).eligible; }).map(function(s){ return {id:s.id, name:s.name, result:null}; }) });
    UI.scheduleOpen=false; UI.eventsView="list";
    UI.toast = "Grading event created with pre-suggested eligible students.";
    render();
  },
  viewEvent: function(id){ UI.selectedEventId=id; UI.eventsView="run"; render(); },
  backToEvents: function(){ UI.eventsView="list"; render(); },
  setResult: function(eventId, participantId, result){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    var p = ev.participants.find(function(x){return x.id===participantId;});
    p.result = p.result===result ? null : result;
    render();
  },
  completeEvent: function(eventId){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    ev.status="completed";
    var passCount = ev.participants.filter(function(p){return p.result==="pass";}).length;
    UI.toast = passCount + " participant" + (passCount===1?"":"s") + " bulk-promoted and logged to their history.";
    UI.eventsView="list";
    render();
  }
};
window.App = App;

render();
</script>
</body>
