/* ============== STUDENT PANEL ============== */
function currentStudent(){ return DB.students.find(function(s){ return s.id===UI.selectedStudentId; }); }

var HISTORY_TYPE_STYLE = {
  promotion:  { label:"PROMOTION",  dot:"var(--success)", bg:"var(--success-bg)", col:"var(--success)" },
  downgrade:  { label:"DOWNGRADE",  dot:"var(--danger)",  bg:"var(--danger-bg)",  col:"var(--danger)" },
  adjustment: { label:"ADJUSTMENT", dot:"var(--info)",    bg:"var(--info-bg)",    col:"var(--info)" }
};
/* A history entry keeps the rank's name as it was when the entry was
   written, so the record still reads properly if that rank is later
   renamed away or deleted. */
function historyRankLabel(student, h){
  var r = getRank(student.styleId, h.rankId);
  if(r) return r.name;
  return h.rankName || HISTORIC_RANK_LABELS[h.rankId] || h.rankId;
}

function StudentDetail(s){
  var style = getStyle(s.styleId);
  if(!style){
    return '<div class="card" style="padding:40px; text-align:center; color:var(--text-muted); font-size:13px;">'+esc(s.name)+'\'s style was deleted. Recreate the style, or reassign them, to continue grading.</div>';
  }
  var rk = getRank(s.styleId, s.rankId);
  if(!rk){
    return '<div class="card" style="padding:40px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; color:var(--text-muted); font-size:13px;">'+
      '<div>'+esc(s.name)+'\'s rank could not be found — it may have been removed from this style. Assign a current rank to continue.</div>'+
      '<button class="btn btn-primary" onclick="App.openGrade()">Assign a rank</button></div>';
  }
  var el = computeEligibility(s);
  var req = gradingRequirement(s);
  var skillStatus = s.skillStatus || {};
  var history = s.history || [];
  var html = '';

  var isActive = s.active!==false;
  html += '<div style="display:flex; align-items:center; gap:14px;">'+
    avatarWrap(s.name, 48)+
    '<div style="flex:1;"><h1 style="font-size:19px; font-weight:800;">'+esc(s.name)+'</h1><div style="font-size:12px; color:var(--text-muted); margin-top:2px;">'+esc(style.name)+' · member since '+esc(s.memberSince||s.since)+'</div></div>'+
    '<button onclick="App.toggleStudentActive(\''+s.id+'\')" class="badge" style="background:'+(isActive?"var(--success-bg)":"var(--surface-2)")+'; color:'+(isActive?"var(--success)":"var(--text-muted)")+'; border:1px solid '+(isActive?"var(--success-border)":"var(--border)")+'; cursor:pointer;" title="Click to mark '+(isActive?"inactive":"active")+'">'+(isActive?"Active":"Inactive")+'</button>'+
    '</div>';

  html += '<div style="display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start;">';

  html += '<div class="card" style="padding:20px; display:flex; flex-direction:column; gap:14px;">';
  html += '<div style="display:flex; align-items:center; gap:12px;">'+beltSwatch(rk, 118, 32)+
    '<div><div style="font-family:Manrope,ui-sans-serif,system-ui,sans-serif; font-size:15px; font-weight:700;">'+esc(rk.name)+'</div><div style="font-size:12px; color:var(--text-muted);">Since '+esc(s.since)+'</div></div></div>';

  if(el.hasNext){
    if(el.eligible){
      html += '<div class="badge" style="background:var(--success-bg); color:var(--success); width:fit-content;">'+icon("check",13)+'Eligible to grade</div>'+
        '<div style="font-size:11.5px; color:var(--text-muted);">You were notified when this happened — grading is still your call.</div>';
    } else {
      html += '<div class="badge" style="background:var(--accent-tint); color:var(--text); width:fit-content;">In progress</div>';
    }
    html += '<div style="height:1px; background:var(--border);"></div>';
    if(el.yearsGated){
      // Floor, never round: eligibility itself compares raw days, so a
      // rounded display could show e.g. "3.0 / 3 years" a day before the
      // gate actually opens. Flooring guarantees the number shown here
      // never reaches the requirement before el.eligible actually flips.
      var elapsedYears = Math.floor(el.elapsedDays/365*10)/10;
      var requiredYears = daysToYears(el.requiredDays);
      html += progressRow("Time in rank (years)", elapsedYears, requiredYears, el.eligible);
      if(el.needSkills>0){
        html += progressRow("Skills signed off (optional)", el.signedCount, el.needSkills, true);
      }
      html += '<div style="font-size:11px; color:var(--text-faint);">This rank grades on time in rank alone — classes aren\'t counted here.</div>';
    } else {
      html += progressRow("Attendance toward "+esc(el.nextRank.name), Number(s.classesAttended)||0, el.requiredClasses, el.classesOk);
      if(el.requiredDays>0) html += progressRow("Days in rank", el.elapsedDays, el.requiredDays, el.daysOk);
      if(el.needSkills>0) html += progressRow("Skills signed off", el.signedCount, el.needSkills, el.skillsOk);
      html += '<button class="btn btn-ghost" style="justify-content:center;" onclick="App.logClass()">'+icon("plus",14)+'Log a class (+1)</button>';
    }
  } else {
    html += '<div class="badge" style="background:var(--info-bg); color:var(--info); width:fit-content;">Top rank in this style</div>';
  }

  html += '<div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">'+
    '<button class="btn btn-primary" style="justify-content:center;" onclick="App.openGrade()">Grade student</button>'+
    '<button class="btn btn-danger-outline" style="justify-content:center;" onclick="App.openDowngrade()">Downgrade</button></div>';
  html += '</div>';

  html += '<div style="display:flex; flex-direction:column; gap:16px;">';
  // The skills listed here are the ones that gate the NEXT grade — the same
  // list eligibility counts — so every one of them can be signed off here.
  var skillIds = el.hasNext ? req.skillIds : [];
  html += '<div class="card" style="padding:18px;"><div style="font-family:Manrope,ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:14px; margin-bottom:12px;">'+
    (el.hasNext ? 'Skills for promotion to '+esc(el.nextRank.name)+(el.yearsGated?' <span style="font-weight:500; color:var(--text-faint);">(optional)</span>':'') : 'Skills')+'</div>';
  if(!el.hasNext){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">Top rank — there is no further grade to sign skills off for.</div>';
  } else if(!skillIds.length){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">No skills required for the next grade.</div>';
  } else {
    skillIds.forEach(function(sid){
      var st = skillStatus[sid] || "not_started";
      var label = st==="signed" ? "Signed off" : st==="learning" ? "Learning" : "Not started";
      var bg = st==="signed" ? "var(--success-bg)" : st==="learning" ? "var(--accent-tint)" : "var(--surface-2)";
      var col = st==="signed" ? "var(--success)" : st==="learning" ? "var(--text)" : "var(--text-muted)";
      var lesson = lessonsForSkill(sid)[0];
      html += '<div style="display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border);">'+
        '<div style="flex:1; font-size:13px; font-weight:500;">'+esc(skillName(sid))+'</div>'+
        (lesson ? '<button onclick="App.openLesson(\''+lesson.id+'\')" title="Watch: '+esc(lesson.title)+'" style="display:flex; align-items:center; gap:4px; border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:4px 9px; font-size:11px; font-weight:600; color:var(--accent); cursor:pointer;">'+icon("play",9)+'Watch</button>' : '')+
        '<button onclick="App.cycleSkill(\''+sid+'\')" class="badge" style="background:'+bg+'; color:'+col+'; border:none; cursor:pointer;">'+label+'</button></div>';
    });
    html += '<div style="font-size:11px; color:var(--text-faint); margin-top:8px;">Click a status to cycle it — Not started → Learning → Signed off.</div>';
  }
  html += '</div>';

  html += '<div class="card" style="padding:18px;"><div style="font-family:Manrope,ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:14px; margin-bottom:14px;">Rank history</div>';
  if(!history.length){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">No history yet.</div>';
  }
  history.forEach(function(h, i){
    var hid = h.id || ("legacy-"+i);
    var ts = HISTORY_TYPE_STYLE[h.type] || HISTORY_TYPE_STYLE.promotion;
    var editing = UI.editingHistoryId===hid;
    var confirmingDelete = UI.confirmDeleteHistoryId===hid;
    html += '<div style="display:flex; gap:14px; padding-bottom:16px;">'+
      '<div style="display:flex; flex-direction:column; align-items:center;"><div style="width:10px; height:10px; border-radius:999px; background:'+ts.dot+';"></div>'+
      (i<history.length-1 ? '<div style="width:1.5px; flex:1; background:var(--border); margin-top:2px;"></div>' : '')+'</div>'+
      '<div style="flex:1;">'+
      '<div style="display:flex; align-items:center; gap:6px;">'+
        '<span style="font-family:Manrope,ui-sans-serif,system-ui,sans-serif; font-size:13.5px; font-weight:700; flex:1;">'+esc(historyRankLabel(s, h))+'</span>'+
        '<span class="badge" style="background:'+ts.bg+'; color:'+ts.col+';">'+ts.label+'</span>'+
        '<button onclick="App.toggleHistoryNoteEditor(\''+hid+'\')" title="Add or edit a note" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:3px;">'+icon("edit",13)+'</button>'+
        '<button onclick="App.askDeleteHistory(\''+hid+'\')" title="Delete this entry" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:3px;">'+icon("trash",13)+'</button>'+
      '</div>'+
      '<div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">'+esc(h.date)+' · '+esc(h.by)+'</div>'+
      (h.note ? '<div style="font-size:12px; color:var(--text); margin-top:5px; background:var(--surface-2); border-radius:6px; padding:8px 10px; max-width:520px;">'+esc(h.note)+'</div>' : '')+
      (h.notes ? '<div style="font-size:12px; color:var(--text); margin-top:5px; background:var(--accent-tint); border-radius:6px; padding:8px 10px; max-width:520px;">'+esc(h.notes)+'</div>' : '')+
      (editing ? '<div style="margin-top:8px; display:flex; flex-direction:column; gap:6px; max-width:520px;">'+
        '<textarea onchange="App.setHistoryNotes(\''+hid+'\', this.value)" placeholder="Add a note for this entry…" style="width:100%; min-height:56px; resize:vertical; font-size:12px; border:1px solid var(--border); border-radius:6px; padding:8px; background:var(--surface); color:var(--text);">'+esc(h.notes||"")+'</textarea>'+
        '<div style="display:flex; justify-content:flex-end;"><button class="btn btn-ghost" style="font-size:11.5px; padding:5px 10px;" onclick="App.toggleHistoryNoteEditor(\''+hid+'\')">Done</button></div>'+
        '</div>' : '')+
      (confirmingDelete ? '<div style="margin-top:8px; display:flex; align-items:center; gap:8px; background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:8px; padding:8px 10px; max-width:520px;">'+
        '<span style="font-size:11.5px; color:var(--danger); flex:1;">Delete this history entry? This can\'t be undone.</span>'+
        '<button class="btn" style="background:var(--danger); color:oklch(99% 0 0); padding:5px 10px; font-size:11.5px;" onclick="App.confirmDeleteHistory(\''+hid+'\')">Delete</button>'+
        '<button class="btn btn-ghost" style="padding:5px 10px; font-size:11.5px;" onclick="App.cancelDeleteHistory()">Cancel</button>'+
        '</div>' : '')+
      '</div></div>';
  });
  html += '</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

/* ============== GRADING BOARD ============== */
// "Skills required before grading" is on for the student's style and a
// required skill is not signed off. Such a student cannot be graded, ticked
// for bulk promotion, or promoted by an event. On the board their tick box is
// a padlock: they are unselectable, rather than selectable and then refused.
function isHardBlocked(student){
  var style = getStyle(student.styleId);
  return !!(style && style.skillsRequired && skillsIncomplete(student));
}
// The students the board is currently showing for a style: the style's own
// students, minus inactive ones (when the filter is on) and minus anyone the
// search box filters out. Used by the page and by "select all in column".
function boardVisibleStudents(style){
  var q = (UI.boardSearch||"").trim().toLowerCase();
  return DB.students.filter(function(s){
    if(s.styleId!==style.id) return false;
    if(UI.boardActiveOnly && s.active===false) return false;
    if(q && String(s.name||"").toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
}

function GradingBoardPage(){
  var style = getStyle(UI.selectedStyleId);
  var html = '<div style="display:flex; flex-direction:column; gap:18px; max-width:1180px;">';
  html += '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">'+
    '<div><h1 style="font-size:22px; font-weight:800; letter-spacing:-0.01em;">Grading Board</h1>'+
    '<div style="font-size:13.5px; color:var(--text-muted); margin-top:4px;">Every student\'s progress toward their next grade, at a glance. Drag a card to a different column to adjust their progress by hand, or select several and promote them together.</div></div>';
  if(DB.styles.length){
    html += '<select onchange="App.selectStyle(this.value)" style="border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; font-weight:600; background:var(--surface); color:var(--text);">';
    DB.styles.forEach(function(s){ html += '<option value="'+s.id+'" '+(s.id===UI.selectedStyleId?"selected":"")+'>'+esc(s.name)+'</option>'; });
    html += '</select>';
  }
  html += '</div>';

  if(!style){ html += EmptyStylesState(); html += '</div>'; return html; }

  var allInStyle = DB.students.filter(function(s){ return s.styleId===style.id; });
  var visible = boardVisibleStudents(style);
  var hiddenInactive = UI.boardActiveOnly ? allInStyle.filter(function(s){ return s.active===false; }).length : 0;

  var buckets = {notready:[], almost:[], ready:[]};
  var atTop = 0, unresolved = [];
  visible.forEach(function(s){
    var pct = computeProgress(s);
    if(pct===null){
      if(getRank(s.styleId, s.rankId)) atTop++; else unresolved.push(s);
      return;
    }
    buckets[progressBand(pct)].push({student:s, pct:pct});
  });
  Object.keys(buckets).forEach(function(k){ buckets[k].sort(function(a,b){ return b.pct-a.pct; }); });

  var selectedCount = Object.keys(UI.boardSelectedIds).filter(function(id){ return UI.boardSelectedIds[id]; }).length;

  // Toolbar
  html += '<div class="card" style="padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">';
  html += '<div style="position:relative; flex:0 0 auto;">'+
    '<span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-faint); display:flex;">'+icon("search",14)+'</span>'+
    '<input id="boardSearchInput" type="text" value="'+esc(UI.boardSearch)+'" oninput="App.setBoardSearch(this.value)" placeholder="Search students…" style="padding:8px 10px 8px 32px; border:1px solid var(--border); border-radius:8px; font-size:13px; width:200px; background:var(--surface); color:var(--text);"/>'+
    '</div>';
  html += '<button onclick="App.toggleBoardActiveOnly()" style="display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:4px 2px;">'+
    '<span class="toggle" style="background:'+(UI.boardActiveOnly?"var(--accent)":"var(--border)")+';"><span class="knob" style="display:block; transform:translateX('+(UI.boardActiveOnly?"17px":"0")+');"></span></span>'+
    '<span style="font-size:12.5px; font-weight:600; color:var(--text-muted);">Currently attending only</span></button>';
  if(hiddenInactive>0){
    html += '<span style="font-size:11.5px; color:var(--text-faint);">'+hiddenInactive+' inactive hidden</span>';
  }
  html += '<div style="flex:1;"></div>';
  if(selectedCount>0){
    html += '<span style="font-size:12.5px; font-weight:700; color:var(--text);">'+selectedCount+' selected</span>'+
      '<button class="btn btn-primary" style="font-size:12.5px; padding:8px 14px;" onclick="App.openBulkPromote()">Promote selected</button>';
  }
  html += '</div>';

  html += '<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start;">';
  BOARD_BANDS.forEach(function(band){
    var list = buckets[band.key];
    var collapsed = UI.boardCollapsed[band.key];
    var selectableInBand = list.filter(function(item){ return !isHardBlocked(item.student); }).map(function(item){ return item.student.id; });
    var allSelectedInBand = selectableInBand.length>0 && selectableInBand.every(function(id){ return UI.boardSelectedIds[id]; });
    html += '<div class="card" style="padding:0; overflow:hidden;" ondragover="event.preventDefault()" ondrop="App.dropOnBand(event,\''+band.key+'\')">';
    html += '<div style="padding:14px 16px; border-bottom:'+(collapsed?"none":"1px solid var(--border)")+'; display:flex; align-items:center; justify-content:space-between; background:var(--surface-2);">'+
      '<div style="display:flex; align-items:center; gap:9px; min-width:0;">'+
      (selectableInBand.length>0 ? '<span class="board-check'+(allSelectedInBand?" on":"")+'" title="'+(allSelectedInBand?"Deselect all in this column":"Select all in this column")+'" onclick="App.toggleColumnSelectAll(\''+band.key+'\')">'+(allSelectedInBand?icon("check",11):"")+'</span>' : '')+
      '<div style="font-family:Manrope,ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:13.5px;">'+band.label+'</div>'+
      '</div>'+
      '<div style="display:flex; align-items:center; gap:8px;">'+
      '<div class="badge" style="background:var(--surface); color:var(--text-muted); border:1px solid var(--border);">'+list.length+'</div>'+
      '<button onclick="App.toggleColumnCollapse(\''+band.key+'\')" title="'+(collapsed?"Expand":"Collapse")+'" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:2px; transform:rotate('+(collapsed?"-90deg":"0deg")+');">'+icon("chev",14)+'</button>'+
      '</div></div>';
    if(!collapsed){
      html += '<div style="display:flex; flex-direction:column; gap:10px; padding:12px; min-height:90px;">';
      if(!list.length){
        html += '<div style="font-size:12px; color:var(--text-faint); text-align:center; padding:22px 8px;">No students here</div>';
      } else {
        list.forEach(function(item){ html += GradingBoardCard(item.student, item.pct); });
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  if(atTop>0){
    html += '<div style="font-size:11.5px; color:var(--text-faint);">'+atTop+' student'+(atTop>1?'s':'')+' not shown — already at the top rank for this style, with no next grade to track progress toward.</div>';
  }
  if(unresolved.length){
    html += '<div class="card" style="padding:12px 14px; border-color:var(--danger-border); background:var(--danger-bg); display:flex; flex-direction:column; gap:8px;">'+
      '<div style="font-size:12.5px; font-weight:600; color:var(--danger);">'+unresolved.length+' student'+(unresolved.length>1?'s have':' has')+' a rank that no longer exists in this style. Assign a current rank to bring them back onto the board.</div>'+
      '<div style="display:flex; gap:8px; flex-wrap:wrap;">'+unresolved.map(function(s){
        return '<button class="chip" onclick="App.openBoardDetail(\''+s.id+'\')">'+esc(s.name)+'</button>';
      }).join("")+'</div></div>';
  }

  if(UI.boardDetailStudentId){
    var ds = DB.students.find(function(x){ return x.id===UI.boardDetailStudentId; });
    if(ds) html += GradingBoardDetailModal(ds);
  }
  if(UI.bulkPromoteOpen){
    html += BulkPromoteModal();
  }

  html += '</div>';
  return html;
}

function GradingBoardCard(s, pct){
  var rk = getRank(s.styleId, s.rankId);
  var warn = skillsIncomplete(s);
  var early = daysShort(s);
  var blocked = isHardBlocked(s);
  var checked = !!UI.boardSelectedIds[s.id];
  var barColor = pct>=66 ? "var(--success)" : pct>=33 ? "var(--accent)" : "var(--text-faint)";
  var kpiColor = pct>=66 ? "var(--success)" : "var(--text)";
  var checkboxHtml;
  if(blocked){
    checkboxHtml = '<span class="board-check locked" title="Skills required for this style — not yet signed off. Can\'t be selected for grading." onclick="event.stopPropagation();">'+icon("lock",10)+'</span>';
  } else {
    checkboxHtml = '<span class="board-check'+(checked?" on":"")+'" onclick="event.stopPropagation(); App.toggleCardSelect(\''+s.id+'\');">'+(checked?icon("check",11):"")+'</span>';
  }
  return '<div draggable="true" ondragstart="App.dragStartCard(event,\''+s.id+'\')" onclick="App.openBoardDetail(\''+s.id+'\')" class="card" style="padding:13px 14px; cursor:grab; display:flex; flex-direction:column; gap:10px; border:1px solid '+(checked?"var(--accent-border)":"var(--border)")+'; background:'+(checked?"var(--accent-tint)":"var(--surface)")+'; box-shadow:0 1px 2px rgba(0,0,0,0.04);">'+
    '<div style="display:flex; align-items:center; gap:10px;">'+
      checkboxHtml+
      avatarWrap(s.name, 30)+
      beltSwatch(rk, 56, 16)+
      '<div style="flex:1; min-width:0;">'+
        '<div style="display:flex; align-items:center; gap:6px;"><span style="font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(s.name)+'</span>'+
        (warn ? '<span title="A required skill for the next grade is not yet signed off" style="color:var(--accent); flex:0 0 auto; display:flex;">'+icon("alert",12)+'</span>' : '')+
        (early ? '<span title="The minimum time in rank has not passed yet" style="color:var(--accent); flex:0 0 auto; display:flex;">'+icon("clock",12)+'</span>' : '')+'</div>'+
        '<div style="font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;">'+esc(rk?rk.name:"")+'</div>'+
      '</div>'+
      '<div style="text-align:right; flex:0 0 auto;">'+
        '<div style="font-size:18px; font-weight:800; font-family:Manrope,ui-sans-serif,system-ui,sans-serif; font-variant-numeric:tabular-nums; color:'+kpiColor+'; line-height:1;">'+pct+'%</div>'+
        '<div style="font-size:9px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;">Progress</div>'+
      '</div>'+
    '</div>'+
    '<div class="board-tooltip-wrap" style="position:relative;">'+
      '<div style="height:4px; border-radius:3px; background:var(--surface-2); overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+barColor+';"></div></div>'+
      '<div class="board-tooltip">'+esc(progressBreakdownText(s))+'</div>'+
    '</div></div>';
}

function GradingBoardDetailModal(s){
  var html = '<div class="modal-backdrop">';
  html += '<div style="width:920px; max-width:96vw; max-height:90vh; overflow:auto; background:var(--surface); border-radius:14px; padding:22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;">';
  html += '<div style="display:flex; justify-content:flex-end;"><button onclick="App.closeBoardDetail()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">'+icon("close",18)+'</button></div>';
  html += StudentDetail(s);
  html += '</div></div>';
  return html;
}

/* Before confirming, the rows are worked out live from the selected
   students. After confirming they come from the saved report instead —
   by then every student's "current rank" is already the new one, so reading
   them live would show the wrong belts and drop anyone who reached the top. */
function BulkPromoteModal(){
  var done = UI.bulkPromoteDone && UI.bulkPromoteReport;
  var rows, skipped = [];
  if(done){
    rows = UI.bulkPromoteReport.rows.map(function(r){ return { id:r.id, name:r.name, fromRank:r.fromRank, toRank:r.toRank }; });
    skipped = UI.bulkPromoteReport.skipped || [];
  } else {
    rows = (UI.bulkPromoteOrder || []).map(function(id){ return DB.students.find(function(s){ return s.id===id; }); }).filter(Boolean).map(function(s){
      return { id:s.id, name:s.name, fromRank:getRank(s.styleId, s.rankId), toRank:nextRank(s.styleId, s.rankId) };
    }).filter(function(r){ return r.fromRank && r.toRank; });
  }

  var countByTarget = {};
  rows.forEach(function(r){ countByTarget[r.toRank.id] = (countByTarget[r.toRank.id]||0)+1; });

  var html = '<div class="modal-backdrop"><div class="modal" style="width:640px;">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between;"><h3 style="font-size:16px; font-weight:700;">Promote these students</h3>'+
    '<button onclick="App.closeBulkPromote()" style="background:none;border:none;color:var(--text-muted);">'+icon("close",18)+'</button></div>';

  if(!done){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">Drag '+icon("grip",11)+' to set the calling order. Every student below moves to their next rank in the ladder.</div>';
    html += '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">'+
      '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600;">Date '+
      '<input id="bulkDateInput" type="text" value="'+esc(UI.bulkPromoteDate||formatToday())+'" onchange="App.setBulkPromoteDate(this.value)" style="border:1px solid '+(UI.bulkPromoteDateError?"var(--danger-border)":"var(--border)")+'; border-radius:6px; padding:6px 8px; font-size:12px; width:110px; background:var(--surface); color:var(--text);"/></label>'+
      '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600; flex:1;">Note (optional) '+
      '<input id="bulkNoteInput" type="text" value="'+esc(UI.bulkPromoteNote||"")+'" oninput="App.setBulkPromoteNote(this.value)" placeholder="e.g. Spring Grading Day" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; flex:1; min-width:0; background:var(--surface); color:var(--text);"/></label>'+
      '</div>';
    if(UI.bulkPromoteDateError){
      html += '<div style="font-size:12px; color:var(--danger); margin-top:-6px;">'+esc(UI.bulkPromoteDateError)+'</div>';
    }
  }

  if(!rows.length){
    html += '<div style="font-size:12.5px; color:var(--text-muted); padding:10px 0;">'+(done?'Nobody was promoted.':'Nothing selected.')+'</div>';
  } else {
    html += '<div style="display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow:auto;">';
    var lastTargetId = null;
    rows.forEach(function(r, i){
      var fromRank = r.fromRank, toRank = r.toRank;
      if(toRank.id!==lastTargetId){
        lastTargetId = toRank.id;
        html += '<div style="display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); padding:'+(i===0?'0':'4')+'px 2px 0;">'+icon("arrowRight",10)+' '+esc(toRank.name)+' · '+countByTarget[toRank.id]+'</div>';
      }
      var draggable = !done;
      html += '<div '+(draggable?'draggable="true" ondragstart="App.dragStartPromote(event,\''+r.id+'\')" ondragover="App.dragOverPromoteRow(event)" ondragleave="App.dragLeavePromoteRow(event)" ondrop="App.dropOnPromoteRow(event,\''+r.id+'\')" ondragend="App.dragEndPromote(event)"':'')+
        ' style="display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-top:2px solid transparent; border-radius:10px; padding:9px 12px;'+(draggable?' cursor:grab;':'')+'">'+
        (draggable ? '<span style="color:var(--text-faint); flex:0 0 auto; display:flex;">'+icon("grip",13)+'</span>' : '')+
        '<span style="font-size:10.5px; font-weight:700; color:var(--text-faint); flex:0 0 auto; width:16px; font-variant-numeric:tabular-nums;">'+(i+1)+'</span>'+
        avatarWrap(r.name, 26)+
        '<div style="flex:1; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(r.name)+'</div>'+
        beltSwatch(fromRank, 56, 15)+
        '<span style="color:var(--text-faint); display:flex; flex:0 0 auto;">'+icon("arrowRight",13)+'</span>'+
        beltSwatch(toRank, 56, 15)+
        (done ? '<span style="color:var(--success); display:flex; flex:0 0 auto;">'+icon("check",16)+'</span>' :
          '<button onclick="App.removeFromBulkPromote(\''+r.id+'\')" title="Remove from this batch" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:3px; flex:0 0 auto;">'+icon("close",13)+'</button>')+
        '</div>';
    });
    html += '</div>';
  }

  if(done){
    if(skipped.length){
      html += '<div style="font-size:12px; color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:10px; padding:10px 14px;">Not promoted: '+
        skipped.map(function(k){ return esc(k.name)+' ('+esc(k.reason)+')'; }).join(', ')+'.</div>';
    }
    html += '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--success-bg); border:1px solid var(--success-border); border-radius:10px; padding:10px 14px;">'+
      '<span style="font-size:12.5px; font-weight:600; color:var(--success);">You promoted '+rows.length+' student'+(rows.length===1?'':'s')+'.</span>'+
      '<button class="btn btn-ghost" style="font-size:12px; padding:7px 12px;" onclick="App.downloadPromotionReport()">'+icon("download",13)+'Download report</button></div>';
    html += '<div style="display:flex; justify-content:flex-end;"><button class="btn btn-primary" onclick="App.closeBulkPromote()">Done</button></div>';
  } else {
    html += '<div style="display:flex; justify-content:flex-end; gap:10px;"><button class="btn btn-ghost" onclick="App.closeBulkPromote()">Cancel</button>'+
      '<button class="btn btn-primary" '+(rows.length?'':'disabled')+' onclick="App.confirmBulkPromote()">Promote '+rows.length+' student'+(rows.length===1?'':'s')+'</button></div>';
  }
  html += '</div></div>';
  return html;
}

// Builds a self-contained, styled HTML report (no external deps, matching
// how the rest of the prototype is built) with a Print / Save-as-PDF
// button — the browser's native print dialog stands in for a real PDF
// export without needing a client-side PDF library.
function buildPromotionReportHtml(styleName, note, rows){
  var today = formatToday();
  var rowsHtml = rows.map(function(r, i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.fromRankName)+'</td><td>'+esc(r.toRankName)+'</td><td>'+esc(r.date)+'</td></tr>';
  }).join('');
  return '<!doctype html><html><head><meta charset="utf-8"><title>Promotion Report — '+esc(styleName)+'</title>'+
    '<style>'+
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; max-width:720px; margin:40px auto; padding:0 24px; color:#1a1a1a; background:#fff;}'+
    'header{display:flex; align-items:flex-end; justify-content:space-between; border-bottom:3px solid #d9a441; padding-bottom:16px; margin-bottom:22px;}'+
    'h1{font-size:19px; margin:0; font-weight:800;} .brand{font-weight:800; font-size:15px; letter-spacing:-0.01em; color:#1a1a1a;} .brand span{color:#d9a441;}'+
    'table{width:100%; border-collapse:collapse; margin-top:12px;} th,td{text-align:left; padding:9px 10px; border-bottom:1px solid #e5e4e0; font-size:13px;} th{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#767268; font-weight:700;} th:first-child,td:first-child{width:32px; font-variant-numeric:tabular-nums; color:#767268;}'+
    '.meta{font-size:12.5px; color:#767268; margin-bottom:4px;}'+
    '.printbtn{margin-top:26px; padding:10px 18px; background:#d9a441; color:#1a1a1a; border:none; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;}'+
    '@media print{ .printbtn{display:none;} body{margin:0; max-width:none;} }'+
    '</style></head><body>'+
    '<header><div class="brand">Dojo<span>HQ</span></div><h1>Promotion Report</h1></header>'+
    '<div class="meta">'+esc(styleName)+' · '+today+' · '+rows.length+' student'+(rows.length===1?'':'s')+' promoted</div>'+
    (note ? '<div class="meta">'+esc(note)+'</div>' : '')+
    '<table><thead><tr><th>#</th><th>Student</th><th>From</th><th>To</th><th>Date</th></tr></thead><tbody>'+rowsHtml+'</tbody></table>'+
    '<button class="printbtn" onclick="window.print()">Print / Save as PDF</button>'+
    '</body></html>';
}

function progressRow(label, val, target, ok){
  // A target of 0 means "nothing required" — a full bar, not a division by zero.
  var pct = target>0 ? Math.max(0, Math.min(100, Math.round((val/target)*100))) : 100;
  return '<div style="display:flex; flex-direction:column; gap:6px;">'+
    '<div style="display:flex; justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-muted); font-weight:600;">'+label+'</span><span style="font-weight:700;">'+val+' / '+target+'</span></div>'+
    '<div style="height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+(ok?"var(--success)":"var(--accent)")+';"></div></div></div>';
}

/* One row of the rank picker shared by the Grade and Downgrade modals.
   `allowed` is false for ranks that modal cannot move the student to; those
   are shown greyed out and cannot be clicked. */
function rankPickRow(r, isCurrent, isPicked, allowed){
  return '<button '+(isCurrent ? 'id="currentRankRow" ' : '')+(allowed ? 'onclick="App.pickGradeRank(\''+r.id+'\')" ' : 'disabled ')+
    'style="display:flex; align-items:center; gap:12px; border:none; background:'+(isPicked?"var(--accent-tint)":"var(--surface)")+'; padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); cursor:'+(allowed?"pointer":"default")+'; color:var(--text); opacity:'+((allowed||isCurrent)?"1":".4")+';">'+
    beltSwatch(r, 86, 22)+
    '<span style="font-size:13.5px; font-weight:600; flex:1;">'+esc(r.name)+'</span>'+
    (isCurrent ? '<span style="font-size:10.5px; font-weight:700; color:var(--text-muted);">CURRENT</span>' : '')+
    (isPicked ? icon("check",16) : "")+'</button>';
}

/* Grade moves a student UP the ladder — to the next rank or, skipping ranks,
   to any later one. It never moves a student to the rank they already hold
   (that would only wipe their progress) or to an earlier rank (that is a
   Downgrade, which must carry a written reason). A student whose rank no
   longer exists can be assigned any rank. */
function GradeModal(){
  var s = currentStudent();
  var style = s && getStyle(s.styleId);
  if(!s || !style) return "";
  var ranks = style.ranks.slice().sort(function(a,b){return a.order-b.order;});
  var curRank = getRank(s.styleId, s.rankId);
  function canPick(r){ return !curRank || r.order > curRank.order; }
  var picked = getRank(s.styleId, UI.gradePickedRankId);
  if(picked && !canPick(picked)) picked = null;
  var anyPickable = ranks.some(canPick);
  var skillsWarn = !!picked && !!curRank && skillsIncomplete(s);
  var hardBlocked = skillsWarn && !!style.skillsRequired;
  var missingSkillIds = skillsWarn ? incompleteSkillIds(s) : [];
  var toRankIsYears = picked ? isYearsRank(picked) : false;
  var draftDate = UI.gradeDraftDate || formatToday();
  var draftClasses = UI.gradeDraftClasses || 0;

  var html = '<div class="modal-backdrop"><div class="modal">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between;"><div style="display:flex; align-items:center; gap:10px;">'+avatarWrap(s.name, 30)+'<h3 style="font-size:16px; font-weight:700;">'+(curRank?'Grade ':'Assign a rank to ')+esc(s.name)+'</h3></div>'+
    '<button onclick="App.closeModals()" style="background:none;border:none;color:var(--text-muted);">'+icon("close",18)+'</button></div>';
  if(!anyPickable){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">'+esc(s.name)+' is already at the top rank of this style — there is nothing higher to grade to.</div>';
  } else if(curRank){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">Pick any later rank — you\'re not limited to the next one in line. Skipping ranks is allowed. To move a student to an earlier rank, use Downgrade.</div>';
  } else {
    html += '<div style="font-size:12.5px; color:var(--text-muted);">This student\'s previous rank no longer exists. Pick the rank they hold now.</div>';
  }
  html += '<div id="rankPickList" style="display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; max-height:280px; overflow:auto;">';
  ranks.forEach(function(r){
    html += rankPickRow(r, !!curRank && r.id===curRank.id, !!picked && r.id===picked.id, canPick(r));
  });
  html += '</div>';

  var missingSkillsListHtml = missingSkillIds.length ? '<div style="display:flex; flex-direction:column; gap:5px; margin-top:2px;">'+missingSkillIds.map(function(sid){
    var lesson = lessonsForSkill(sid)[0];
    return '<div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text);">'+
      '<span style="flex:1;">'+esc(skillName(sid))+'</span>'+
      (lesson ? '<button onclick="App.openLesson(\''+lesson.id+'\')" style="display:flex; align-items:center; gap:4px; border:1px solid var(--accent-border); background:var(--surface); border-radius:999px; padding:3px 9px; font-size:11px; font-weight:600; color:var(--accent); cursor:pointer; flex:0 0 auto;">'+icon("play",9)+'Watch</button>' : '')+
      '</div>';
  }).join("")+'</div>' : '';

  if(hardBlocked){
    html += '<div style="background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:10px;">'+
      '<div style="display:flex; gap:10px; align-items:flex-start;"><span style="color:var(--danger); flex:0 0 auto; margin-top:1px; display:flex;">'+icon("lock",15)+'</span>'+
      '<div style="font-size:12px; color:var(--danger); line-height:1.5;"><strong>Skills required for this style.</strong> '+esc(s.name)+' hasn\'t signed off every skill required for the next rank yet. Grading is blocked until they do — "Skills required before grading" is on for this style in Settings.</div></div>'+
      missingSkillsListHtml+
      '</div>';
  } else if(skillsWarn){
    html += '<div style="background:var(--accent-tint); border:1px solid var(--accent-border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:9px;">'+
      '<div style="font-size:12px; color:var(--text); display:flex; gap:9px; line-height:1.5;"><span style="color:var(--accent); flex:0 0 auto; display:flex; margin-top:1px;">'+icon("alert",14)+'</span><span>Not every required skill is signed off for the next rank. You can still grade, but confirm you\'re doing this knowingly.</span></div>'+
      missingSkillsListHtml+
      '<label style="display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; cursor:pointer;" onclick="App.toggleGradeAck()"><span class="board-check'+(UI.gradeAckWarning?" on":"")+'">'+(UI.gradeAckWarning?icon("check",11):"")+'</span>I acknowledge the required skills aren\'t signed off yet</label></div>';
  }

  if(!hardBlocked && anyPickable){
    html += '<div style="display:flex; align-items:center; gap:16px;">'+
      '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600;">Date '+
      '<input id="gradeDateInput" type="text" value="'+esc(draftDate)+'" onchange="App.setGradeDraftDate(this.value)" style="border:1px solid '+(UI.gradeDateError?"var(--danger-border)":"var(--border)")+'; border-radius:6px; padding:6px 8px; font-size:12px; width:120px; background:var(--surface); color:var(--text);"/></label>'+
      (!toRankIsYears ? '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600;">Starting classes '+
      '<input id="gradeClassesInput" type="number" min="0" value="'+draftClasses+'" onchange="App.setGradeDraftClasses(this.value)" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; width:60px; background:var(--surface); color:var(--text);"/></label>' : '')+
      '</div>';
    if(UI.gradeDateError){
      html += '<div style="font-size:12px; color:var(--danger); margin-top:-6px;">'+esc(UI.gradeDateError)+'</div>';
    }
  }

  var canConfirm = !!picked && !hardBlocked && !UI.gradeDateError && (!skillsWarn || UI.gradeAckWarning);
  html += '<div style="display:flex; justify-content:flex-end; gap:10px;"><button class="btn btn-ghost" onclick="App.closeModals()">Cancel</button>'+
    '<button class="btn btn-primary" '+(canConfirm?'':'disabled')+' onclick="App.confirmGrade()">'+(picked ? 'Confirm grading to '+esc(picked.name) : 'Pick a rank')+'</button></div>';
  html += '</div></div>';
  return html;
}

/* Downgrade moves a student DOWN the ladder, to any earlier rank, and always
   needs a written reason. */
function DowngradeModal(){
  var s = currentStudent();
  var style = s && getStyle(s.styleId);
  var curRank = s && getRank(s.styleId, s.rankId);
  if(!s || !style || !curRank) return "";
  var ranks = style.ranks.slice().sort(function(a,b){return a.order-b.order;});
  function canPick(r){ return r.order < curRank.order; }
  var picked = getRank(s.styleId, UI.gradePickedRankId);
  if(picked && !canPick(picked)) picked = null;
  var anyPickable = ranks.some(canPick);
  var reason = UI.downgradeReasonDraft || "";
  var canConfirm = !!picked && reason.trim().length>0;

  var html = '<div class="modal-backdrop"><div class="modal">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between;"><div style="display:flex; align-items:center; gap:10px;">'+avatarWrap(s.name, 30)+'<h3 style="font-size:16px; font-weight:700; color:var(--danger);">Downgrade '+esc(s.name)+'</h3></div>'+
    '<button onclick="App.closeModals()" style="background:none;border:none;color:var(--text-muted);">'+icon("close",18)+'</button></div>';
  html += '<div style="font-size:12.5px; color:var(--text-muted);">'+(anyPickable ? 'Pick the earlier rank to move this student back to — belts shown are exactly as configured for this style.' : esc(s.name)+' is already at the first rank of this style — there is nothing lower to move to.')+'</div>';
  html += '<div id="rankPickList" style="display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; max-height:280px; overflow:auto;">';
  ranks.forEach(function(r){
    html += rankPickRow(r, r.id===curRank.id, !!picked && r.id===picked.id, canPick(r));
  });
  html += '</div>';
  html += '<div><div style="font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Reason <span style="color:var(--danger); font-weight:500;">— required, kept on the student\'s history</span></div>'+
    '<textarea id="downgradeReason" placeholder="e.g. Requested by student to refocus on fundamentals" style="width:100%; min-height:70px; resize:none;">'+esc(reason)+'</textarea></div>';
  html += '<div style="display:flex; justify-content:flex-end; gap:10px;"><button class="btn btn-ghost" onclick="App.closeModals()">Cancel</button>'+

/* ============== EVENTS PAGE ==============
   A grading event is a group grading day for one style: a list of
   participants, a Pass or Fail for each, and one "complete" action that
   promotes every pass by one rank. Once completed it is read-only. */
function eventStyleId(ev){ return ev.styleId || UI.selectedStyleId; }
// Students who could still be added to a scheduled event: active students
// of the event's style who have a next rank and are not on the list yet.
function eventCandidates(ev){
  var sid = eventStyleId(ev);
  return DB.students.filter(function(s){
    if(s.styleId!==sid || s.active===false) return false;
    if(ev.participants.some(function(p){ return p.id===s.id; })) return false;
    return !!nextRank(s.styleId, s.rankId);
  });
}

function RunEventPage(ev){
  var scheduled = ev.status==="scheduled";
  var html = '<div style="display:flex; flex-direction:column; gap:18px; max-width:980px;">';
  html += '<div style="display:flex; align-items:center; gap:10px;"><button onclick="App.backToEvents()" style="background:none; border:1px solid var(--border); border-radius:8px; padding:7px; display:flex; color:var(--text);">'+icon("back",16)+'</button>'+

    '<span class="badge" style="background:'+(scheduled?"var(--accent-tint)":"var(--success-bg)")+'; color:'+(scheduled?"var(--text)":"var(--success)")+';">'+esc(String(ev.status).toUpperCase())+'</span></div>';

  html += '<div class="card" style="overflow:hidden;">';
  if(!ev.participants.length){
    html += '<div style="padding:20px; font-size:13px; color:var(--text-muted);">No participants yet'+(scheduled?' — add students below.':'.')+'</div>';
  }
  ev.participants.forEach(function(p){
    var stu = DB.students.find(function(x){ return x.id===p.id; });
    var cur = stu ? getRank(stu.styleId, stu.rankId) : null;
    var nr = stu ? nextRank(stu.styleId, stu.rankId) : null;
    var sub;
    if(!scheduled) sub = p.outcome || "";
    else if(!stu) sub = "Student record not found";
    else if(!nr) sub = (cur?cur.name:"") + " — top rank, nothing to promote to";
    else sub = cur.name + " → " + nr.name + (isHardBlocked(stu) ? " · required skills not signed off" : "");
    html += '<div style="border-bottom:1px solid var(--border); padding:14px 18px; display:flex; flex-direction:column; gap:10px;">'+
      '<div style="display:flex; align-items:center; gap:14px;">'+avatarWrap(p.name, 30)+
      '<div style="flex:1; min-width:0;"><div style="font-size:13.5px; font-weight:600;">'+esc(p.name)+'</div>'+
      (sub ? '<div style="font-size:11.5px; color:var(--text-muted); margin-top:1px;">'+esc(sub)+'</div>' : '')+'</div>';
    if(scheduled){
      html += '<div style="display:flex; gap:6px; align-items:center;">'+
        '<button onclick="App.setResult(\''+ev.id+'\',\''+p.id+'\',\'pass\')" style="border:1.5px solid '+(p.result==="pass"?"var(--success-border)":"var(--border)")+'; background:'+(p.result==="pass"?"var(--success-bg)":"var(--surface)")+'; color:'+(p.result==="pass"?"var(--success)":"var(--text)")+'; font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:8px;">Pass</button>'+
        '<button onclick="App.setResult(\''+ev.id+'\',\''+p.id+'\',\'fail\')" style="border:1.5px solid '+(p.result==="fail"?"var(--danger-border)":"var(--border)")+'; background:'+(p.result==="fail"?"var(--danger-bg)":"var(--surface)")+'; color:'+(p.result==="fail"?"var(--danger)":"var(--text)")+'; font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:8px;">Fail</button>'+
        '<button onclick="App.removeEventParticipant(\''+ev.id+'\',\''+p.id+'\')" title="Remove from this event" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:3px;">'+icon("close",14)+'</button></div>';
    } else {
      var rb = p.result==="pass" ? ["PASS","var(--success-bg)","var(--success)"] : p.result==="fail" ? ["FAIL","var(--danger-bg)","var(--danger)"] : ["NO RESULT","var(--surface-2)","var(--text-muted)"];
      html += '<span class="badge" style="background:'+rb[1]+'; color:'+rb[2]+';">'+rb[0]+'</span>';
    }
    html += '</div>';
    if(scheduled && p.result==="fail"){
      html += '<div style="margin-left:44px; background:var(--danger-bg); border-radius:8px; padding:12px 14px; display:flex; gap:16px; align-items:center;">'+
        '<div style="font-size:11px; font-weight:600; color:var(--danger);">Not promoted</div>'+
        '<div style="font-size:11px; color:var(--danger);">Stays at their current rank. Progress already earned is kept.</div></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  if(scheduled){
    var candidates = eventCandidates(ev);
    if(candidates.length){
      html += '<div style="display:flex; align-items:center; gap:10px;">'+
        '<select id="eventAddSelect" style="border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; background:var(--surface); color:var(--text); min-width:260px;">'+
        candidates.map(function(s){ var r = getRank(s.styleId, s.rankId); return '<option value="'+s.id+'">'+esc(s.name)+(r?' — '+esc(r.name):'')+'</option>'; }).join("")+
        '</select><button class="btn btn-ghost" onclick="App.addEventParticipant(\''+ev.id+'\')">'+icon("plus",14)+'Add participant</button></div>';
    }
    var passCount = ev.participants.filter(function(p){ return p.result==="pass"; }).length;
    html += '<div style="display:flex; justify-content:flex-end;"><button class="btn btn-primary" onclick="App.completeEvent(\''+ev.id+'\')">Complete event — promote '+passCount+' pass'+(passCount===1?'':'es')+'</button></div>';
  }
  html += '</div>';
  return html;
}

  [["inapp","In-app notification",true],["email","Email",false],["push","Push notification",false],["sms","SMS",false]].forEach(function(c){

    html += '<div style="display:flex; align-items:center; gap:14px; padding:10px 4px; border-bottom:1px solid var(--border);">'+
      '<div style="flex:1; font-size:13.5px; font-weight:600;">'+label+(locked?' <span style="font-weight:400; color:var(--text-faint); font-size:11.5px;">(always on)</span>':'')+'</div>'+
      '<button class="toggle" style="background:'+(on?"var(--accent)":"var(--border)")+'; opacity:'+(locked?".5":"1")+';" '+(locked?"":'onclick="App.toggleChannel(\''+id+'\')"')+'><div class="knob" style="transform:translateX('+(on?"17px":"0")+');"></div></button></div>';
  });
  html += '</div>';

  // One column per style, so the table always matches the styles that exist.
  html += '<div class="card" style="padding:20px;"><div style="font-size:14px; font-weight:700; margin-bottom:2px;">Instructor grading permissions</div>'+
    '<div style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">Grant an instructor the right to promote or downgrade, per style.</div>';
  if(!DB.styles.length){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">No styles yet.</div>';
  } else {
    html += '<div style="overflow-x:auto;"><div style="display:grid; grid-template-columns:minmax(160px,1.4fr) repeat('+DB.styles.length+', minmax(120px,1fr)); border:1px solid var(--border); border-radius:10px; overflow:hidden; min-width:fit-content;">'+
      '<div style="padding:10px 14px; font-size:11.5px; font-weight:700; color:var(--text-muted); background:var(--surface-2);">Instructor</div>'+
      DB.styles.map(function(sty){ return '<div style="padding:10px 14px; font-size:11.5px; font-weight:700; color:var(--text-muted); background:var(--surface-2); text-align:center;">'+esc(sty.name)+'</div>'; }).join("");
    st.instructors.forEach(function(ins){
      html += '<div style="padding:11px 14px; border-top:1px solid var(--border); font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px;"><div style="width:22px; height:22px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border);"></div>'+esc(ins.name)+'</div>'+

    });
    html += '</div></div>';
  }
  html += '</div>';

  html += '</div>';
  return html;

function permCell(insId, styleKey, on){
  return '<div style="padding:11px 14px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:center;">'+
    '<button onclick="App.togglePerm(\''+insId+'\',\''+styleKey+'\')" style="width:20px; height:20px; border-radius:6px; border:1.5px solid '+(on?"var(--accent-border)":"var(--border)")+'; background:'+(on?"var(--accent)":"var(--surface)")+'; display:flex; align-items:center; justify-content:center; padding:0; color:var(--accent-ink);">'+(on?icon("check",12):"")+'</button></div>';
}

/* ============== ACTIONS ============== */
var App = {
  nav: function(page){ UI.page = page; UI.toast=null; render(); },

  setCurriculumCategoryFilter: function(id){ UI.curriculumCategoryFilter=id; render(); },
  openLesson: function(id){ UI.lessonModalId=id; render(); },
  closeLesson: function(){ UI.lessonModalId=null; render(); },

  openAddLesson: function(categoryId){
    UI.lessonFormOpen=true; UI.lessonFormMode="add"; UI.lessonFormEditId=null; UI.lessonTitleError=false;
    UI.lessonDraft = { title:"", categoryId: categoryId || (DB.curriculum.categories[0] ? DB.curriculum.categories[0].id : null), instructor:"", duration:"", text:"", skillIds:[] };
    render();
  },
  openEditLesson: function(id){
    var l = getLesson(id);
    if(!l) return;
    UI.lessonFormOpen=true; UI.lessonFormMode="edit"; UI.lessonFormEditId=id; UI.lessonTitleError=false;
    UI.lessonDraft = { title:l.title, categoryId:l.categoryId, instructor:l.instructor, duration:l.duration, text:l.text, skillIds:l.skillIds.slice() };
    render();
  },
  cancelLessonForm: function(){ UI.lessonFormOpen=false; UI.lessonDraft=null; render(); },
  setLessonDraftCategory: function(id){ UI.lessonDraft.categoryId=id; render(); },
  toggleLessonDraftSkill: function(id){
    var d = UI.lessonDraft;
    var i = d.skillIds.indexOf(id);
    if(i>-1) d.skillIds.splice(i,1); else d.skillIds.push(id);
    render();
  },
  submitLesson: function(){
    var d = UI.lessonDraft;
    var titleEl = document.getElementById("lessonTitleInput");
    var instructorEl = document.getElementById("lessonInstructorInput");
    var durationEl = document.getElementById("lessonDurationInput");
    var textEl = document.getElementById("lessonTextInput");
    var title = titleEl ? titleEl.value.trim() : "";
    if(!title){ UI.lessonTitleError=true; render(); return; }
    var instructor = instructorEl ? instructorEl.value.trim() : "";
    var duration = durationEl ? durationEl.value.trim() : "";
    var text = textEl ? textEl.value.trim() : "";

  /* Dragging a card to another column is a manual override: it rewrites the
     student's class count (or, for a time-only rank, the date they reached
     the rank) so that their progress lands in that column. Because it
     changes a real number, it is always written to the student's history.
     Dropping a card back on the column it is already in does nothing. */
  dropOnBand: function(ev, bandKey){
    ev.preventDefault();
    var studentId = ev.dataTransfer.getData('text/plain');
    var s = DB.students.find(function(x){ return x.id===studentId; });
    if(!s) return;
    var band = BOARD_BANDS.find(function(b){ return b.key===bandKey; });
    if(!band) return;
    var req = gradingRequirement(s);
    if(!req || !req.next) return; // no next grade to progress toward — card shouldn't be on the board at all
    if(progressBand(computeProgress(s))===bandKey) return;
    var what;
    if(req.timeOnly){
      var days = snapCountForFloor(req.reqDays, band.floor);
      var newSince = days<=0 ? formatToday() : formatDateDaysAgo(days);
      if(newSince===s.since || req.reqDays<=0){ UI.toast = s.name+" can't be moved — this rank has no time requirement to adjust."; render(); return; }
      what = 'time-in-rank start date changed from '+s.since+' to '+newSince;
      s.since = newSince;
    } else {
      var oldClasses = Number(s.classesAttended)||0;
      var newClasses = snapCountForFloor(req.reqClasses, band.floor);
      if(newClasses===oldClasses || req.reqClasses<=0){ UI.toast = s.name+" can't be moved — the class requirement is too small to split into columns."; render(); return; }
      what = 'classes attended changed from '+oldClasses+' to '+newClasses;
      s.classesAttended = newClasses;
    }
    s.history = s.history || [];
    s.history.unshift({ id:nextHistoryId(), rankId:req.cur.id, rankName:req.cur.name, type:"adjustment", date:formatToday(), by:CURRENT_USER,
      note:'Progress adjusted by hand on the Grading Board: '+what+' (moved to "'+band.label+'").', notes:"" });
    UI.toast = s.name+" moved to \""+band.label+"\" — recorded on their history.";
    render();
  },

  confirmBulkPromote: function(){
    var chk = normalizeDateInput(UI.bulkPromoteDate || formatToday());
    if(!chk.ok){ UI.bulkPromoteDateError = chk.error; render(); return; }
    var date = chk.value;
    // One date for the whole batch — so it must suit every student in it.
    var early = null;
    UI.bulkPromoteOrder.forEach(function(id){
      var st = DB.students.find(function(x){ return x.id===id; });
      if(st && !early) early = gradingDateProblem(st, date);
    });
    if(early){ UI.bulkPromoteDateError = early; render(); return; }
    var customNote = (UI.bulkPromoteNote||"").trim();
    var rows = [], skipped = [];
    UI.bulkPromoteOrder.slice().forEach(function(id){
      var s = DB.students.find(function(x){ return x.id===id; });
      if(!s) return;
      var fromRank = getRank(s.styleId, s.rankId);
      var toRank = nextRank(s.styleId, s.rankId);
      if(!fromRank || !toRank){ skipped.push({ name:s.name, reason:"no next rank" }); return; }
      // Defense in depth — a hard-blocked student can't be ticked in the first place.
      if(isHardBlocked(s)){ skipped.push({ name:s.name, reason:"required skills not signed off" }); return; }
      applyRankChange(s, toRank, { type:"promotion", date:date, note: customNote || "Promoted in a batch." });
      // Keep a copy of both ranks as they were, for the "done" view and the report.
      rows.push({ id:s.id, name:s.name, fromRank:makeRank(fromRank), toRank:makeRank(toRank), fromRankName:fromRank.name, toRankName:toRank.name, date:date });
    });
    UI.bulkPromoteDone = true;
    UI.bulkPromoteDateError = null;
    UI.bulkPromoteReport = { styleName: getStyle(UI.selectedStyleId) ? getStyle(UI.selectedStyleId).name : "", note: customNote, rows: rows, skipped: skipped };

  /* Typed-in exact value from the stepper's number input — same clamp

  setDraftNumberField: function(field, rawValue, min, max){
    // Only accept a plain whole number. parseInt() alone would silently

    var trimmed = (rawValue==null ? "" : String(rawValue)).trim();
    var v = /^-?\d+$/.test(trimmed) ? parseInt(trimmed, 10) : UI.rankDraft[field];
