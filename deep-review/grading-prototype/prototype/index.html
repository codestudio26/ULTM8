<style>
  :root{
    --bg:oklch(98% 0.004 95); --surface:oklch(100% 0 0); --surface-2:oklch(97% 0.004 95);
    --border:oklch(90% 0.006 95); --text:oklch(22% 0.01 95); --text-muted:oklch(48% 0.012 95); --text-faint:oklch(62% 0.01 95);
    --sidebar-bg:oklch(19% 0.02 265); --sidebar-text:oklch(88% 0.01 265); --sidebar-text-dim:oklch(62% 0.02 265); --sidebar-active:oklch(27% 0.03 265);

    --danger:oklch(42% 0.16 25); --danger-bg:oklch(94% 0.05 25); --danger-border:oklch(72% 0.12 25);
    --shadow: 0 16px 40px oklch(20% 0.02 95 / 0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:oklch(15% 0.012 260); --surface:oklch(20% 0.014 260); --surface-2:oklch(23% 0.015 260);
      --border:oklch(30% 0.016 260); --text:oklch(93% 0.006 95); --text-muted:oklch(70% 0.012 95); --text-faint:oklch(55% 0.012 95);
      --accent-tint:oklch(28% 0.05 75); --accent-border:oklch(55% 0.12 75);
      --info-bg:oklch(26% 0.05 210); --info-border:oklch(45% 0.1 210); --info:oklch(78% 0.08 210);
      --success-bg:oklch(24% 0.05 148); --success-border:oklch(45% 0.1 148); --success:oklch(78% 0.1 148);
      --danger-bg:oklch(26% 0.06 25); --danger-border:oklch(48% 0.12 25); --danger:oklch(80% 0.1 25);
      --shadow: 0 16px 40px oklch(0% 0 0 / 0.5);

  }
  :root[data-theme="dark"]{
    --bg:oklch(15% 0.012 260); --surface:oklch(20% 0.014 260); --surface-2:oklch(23% 0.015 260);
    --border:oklch(30% 0.016 260); --text:oklch(93% 0.006 95); --text-muted:oklch(70% 0.012 95); --text-faint:oklch(55% 0.012 95);
    --accent-tint:oklch(28% 0.05 75); --accent-border:oklch(55% 0.12 75);
    --info-bg:oklch(26% 0.05 210); --info-border:oklch(45% 0.1 210); --info:oklch(78% 0.08 210);

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Work Sans",ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif; margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  input,textarea{font-family:inherit; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13.5px;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  .btn{border:none; border-radius:9px; font-weight:700; font-size:13.5px; padding:10px 16px; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:none; border:1px solid var(--border); color:var(--text); font-weight:600;}
  .btn-danger-outline{background:none; border:1px solid var(--border); color:var(--danger); font-weight:600;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .chip{border-radius:999px; font-size:12.5px; font-weight:600; padding:6px 12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .chip.on{border-color:var(--accent-border); background:var(--accent-tint); color:var(--text);}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px;}
  .stepper{display:inline-flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .stepper button{width:28px; height:30px; background:var(--surface-2); border:none; font-size:15px; font-weight:700; color:var(--text-muted);}
  .stepper .val{min-width:44px; text-align:center; font-size:13.5px; font-weight:700; padding:0 4px;}
  .stepper .val-input{min-width:44px; width:60px; text-align:center; font-size:13.5px; font-weight:700; padding:0 4px; border:none; background:transparent; color:var(--text); font-family:inherit; font-variant-numeric:tabular-nums; -moz-appearance:textfield;}

  .swatch{width:24px; height:24px; border-radius:7px; border:2px solid transparent; cursor:pointer; flex:0 0 auto;}

/* The one place that knows every field a rank carries, so copying a rank
   (templates, duplicate style, duplicate rank, the edit form) can never
   silently drop one. `over` replaces any field on the copy. */
function makeRank(src, over){
  var r = {
    id: src.id, name: src.name, order: src.order,
    color: src.color, secondaryColor: src.secondaryColor || null,
    tagColor: src.tagColor || null, coralAccent: src.coralAccent || null,
    stripeTiers: (src.stripeTiers || []).map(function(t){ return {count:t.count, color:t.color}; }),
    timeOnly: !!src.timeOnly,
    classCount: src.classCount, minDays: src.minDays, weeklyCap: src.weeklyCap,
    scope: (src.scope || []).slice(), skills: (src.skills || []).slice()
  };
  if(over){ Object.keys(over).forEach(function(k){ r[k] = over[k]; }); }
  return r;
}

/* The default (and only, out of the box) style is the full IBJJF ladder —
   the same 90 ranks "Start from template" builds, just with fixed, readable
   ids (instead of runtime nextId() ids) so seed students below can point
   at a specific rank reliably. */
function buildDefaultIbjjfStyle(){
  var defs = buildIbjjfRankDefs();
  var coralSlugs = { "Red/Black Belt (7th Degree)":"red-black-7", "Red/White Belt (8th Degree)":"red-white-8", "Red Belt (9th Degree)":"red-9" };
  // Demo skill gates: to be promoted INTO Purple Belt (checked while at Blue
  // Belt · 4 Stripes) and INTO Green/Black Belt (checked while at Green
  // Belt · 4 Stripes).
  var skillMap = { "purple":["rnc","ss","gr","ab","td"], "green-black":["gr"] };
  var ranks = defs.map(function(d){
    var id;
    if(coralSlugs[d.name]){
      id = coralSlugs[d.name];
    } else {
      var base = d.name.replace(/\s*·.*$/,'').replace(/\s*Belt$/,'').trim().toLowerCase().replace(/\//g,'-').replace(/\s+/g,'-');
      var n = d.stripeTiers && d.stripeTiers.length ? d.stripeTiers[0].count : 0;
      id = n===0 ? base : base+'-'+n;
    }
    return makeRank(d, { id:id, skills:(skillMap[id]||[]).slice() });
  });
  return { id:"bjj", name:"IBJJF Adult & Kid(White Stripes)",
    classTypes:["Kids Fundamentals","Kids Sparring","Adult Fundamentals","Adult Sparring","Competition Team"],
    ranks:ranks };
}

/* ============== HELPERS ============== */
// Makes any text safe to drop into the page, inside a tag or inside a quoted
// attribute. Call it exactly once, at the point the text is written into HTML —
// never earlier (e.g. when building a toast message), or the text is escaped
// twice and "Tom & Jerry" shows up as "Tom &amp; Jerry".
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function getStyle(id){ return DB.styles.find(function(s){ return s.id===id; }); }
function getRank(styleId, rankId){ var st=getStyle(styleId); return st && st.ranks.find(function(r){ return r.id===rankId; }); }
function nextRank(styleId, rankId){
  var st=getStyle(styleId); var cur=getRank(styleId, rankId);
  if(!st||!cur) return null;
  return st.ranks.find(function(r){ return r.order===cur.order+1; }) || null;
}
function skillsForStyle(styleId){ return DB.skills.filter(function(s){ return s.styleId===styleId; }); }
function skillName(id){ var s=DB.skills.find(function(x){ return x.id===id; }); return s?s.name:id; }

/* ============== CURRICULUM ==============
   Lessons attach to a skill by id (lesson.skillIds), so a video surfaces
   wherever that skill already shows up — Skill Library, a student's Skills
   panel, the Grade modal's skills-required warning — instead of living in a
   separate library a student has to go browse on their own. */
function lessonsForSkill(skillId){
  return (DB.curriculum.lessons||[]).filter(function(l){ return l.skillIds.indexOf(skillId)>-1; });
}
function getLesson(id){ return (DB.curriculum.lessons||[]).find(function(l){ return l.id===id; }); }
function getCurriculumCategory(id){ return (DB.curriculum.categories||[]).find(function(c){ return c.id===id; }); }
/* ============== DATES ==============
   Dates are kept as display strings ("14 Jan 2026"). Everything that reads
   or writes one goes through these helpers, so an unreadable or future date
   can never slip into a student record through a date box. */
var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function makeDate(y, m, d){
  if(y<1900 || y>2200 || m<0 || m>11 || d<1 || d>31) return null;
  var dt = new Date(y, m, d);
  // new Date(2026, 1, 31) silently rolls over into March — reject it instead.
  if(dt.getFullYear()!==y || dt.getMonth()!==m || dt.getDate()!==d) return null;
  return dt;
}
/* Accepts "14 Jan 2026", "2026-01-14" and "14/01/2026". Anything else
   (empty, "Today", "N/A", a typo) is not a date and returns null. */
function parseDate(str){
  if(str==null) return null;
  var s = String(str).trim();
  var m = /^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})$/.exec(s);
  if(m){
    var idx = MONTH_NAMES.map(function(x){ return x.toLowerCase(); }).indexOf(m[2].slice(0,3).toLowerCase());
    if(idx<0) return null;
    return makeDate(parseInt(m[3],10), idx, parseInt(m[1],10));
  }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m) return makeDate(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(m) return makeDate(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
  return null;
}
function formatDate(d){ return d.getDate()+" "+MONTH_NAMES[d.getMonth()]+" "+d.getFullYear(); }
function formatToday(){ return formatDate(new Date()); }
function formatDateDaysAgo(days){
  var d = new Date();
  d.setDate(d.getDate()-days);
  return formatDate(d);
}
// Whole calendar days, counted in UTC so a daylight-saving change can never
// make a day come out as 23 or 25 hours and shift the count by one.
function dayNumber(d){ return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }
function daysSince(dateStr){
  // A missing, unreadable or future date reads as "0 days" — never as a huge
  // number that could make a student look years into a rank they just reached.
  var then = parseDate(dateStr);
  if(!then) return 0;
  return Math.max(0, dayNumber(new Date()) - dayNumber(then));
}
/* Checks a typed date. Returns {ok:true, value:"14 Jan 2026"} or
   {ok:false, error:"…"}. Grading dates may not be in the future; event
   dates may (pass allowFuture). */
function normalizeDateInput(str, allowFuture){
  var d = parseDate(str);
  if(!d) return { ok:false, error:'Enter a date like "21 Nov 2026".' };
  if(!allowFuture && dayNumber(d) > dayNumber(new Date())) return { ok:false, error:"The date can't be in the future." };
  return { ok:true, value:formatDate(d) };
}
/* A grading cannot be dated before the day the student reached the rank they
   hold now — their history would run backwards. Returns a message, or null
   when the date is fine. (A missing, unreadable or future "since" date is
   bad data, not a reason to refuse a grading, so it is not checked against.) */
function gradingDateProblem(student, dateStr){
  var d = parseDate(dateStr), since = parseDate(student.since);
  if(!d || !since || dayNumber(since) > dayNumber(new Date())) return null;
  if(dayNumber(d) < dayNumber(since)) return student.name + " reached their current rank on " + student.since + " — the grading date can't be earlier than that.";
  return null;
}
function daysToYears(days){ return Math.round(days/365); }
function yearsToDays(years){ return years*365; }

var HISTORY_ID_SEQ = 100; // seed entries use h1..h9 directly; new entries start well above them
function nextHistoryId(){ return "h"+(HISTORY_ID_SEQ++); }

/* ============== GRADING RULES ==============
   Everything that decides who is ready to grade lives in this block and
   nowhere else. The screens only ever ask these functions.

   A rank is one of two kinds:
   - a normal rank: a student needs classes, days in rank and skills;
   - a "time in rank only" rank (rank.timeOnly — Black Belt and above in the
     IBJJF templates, or any rank the owner switches on): a student only
     needs to have held the rank for long enough. Classes are not counted
     and skills are optional. */
function isYearsRank(r){ return !!(r && r.timeOnly); }

function rankReqSummaryText(r){
  if(isYearsRank(r)){
    var y = daysToYears(r.minDays);
    return y+' year'+(y===1?'':'s');
  }
  return r.classCount+' classes · '+r.minDays+' days';
}

/* What this student must do to earn their NEXT grade. One answer, used by
   eligibility, the progress %, the skills panel and the Grade warning, so
   they can never disagree with each other.

   Where the numbers come from:
   - normal rank -> normal rank: read off the NEXT rank. A rank's classCount,
     minDays and skills mean "what it takes to be promoted INTO this rank".
   - normal rank -> time-only rank (e.g. Brown Belt · 4 Stripes -> Black
     Belt): read off the CURRENT rank, because a time-only rank carries no
     class or skill numbers of its own. In the IBJJF ladder every rung of a
     belt shares the same numbers, so this is the same requirement the
     student has met at every earlier stripe.
   - time-only rank -> anything: the CURRENT rank's minDays, i.e. the time
     that must be spent AT this rank. Skills attached to the next rank are
     shown, but optional.

   Returns null when the student's rank cannot be found (bad data), and
   {cur, next:null} at the top of the ladder. */
function gradingRequirement(student){
  var cur = getRank(student.styleId, student.rankId);
  if(!cur) return null;
  var next = nextRank(student.styleId, student.rankId);
  if(!next) return { cur:cur, next:null };
  var timeOnly = isYearsRank(cur);
  var src = (timeOnly || isYearsRank(next)) ? cur : next;
  return {
    cur: cur, next: next, timeOnly: timeOnly,
    reqClasses: timeOnly ? 0 : (src.classCount||0),
    reqDays: src.minDays||0,
    skillIds: (timeOnly ? next.skills : src.skills).slice()
  };
}

function computeEligibility(student){
  var req = gradingRequirement(student);
  // A rank that does not resolve (corrupted data, a removed rank a student
  // still points to) is NOT the same as a student who reached the top of the
  // ladder — flag it so callers can tell "data error" apart from "done".
  if(!req) return { hasNext:false, dataError:true };
  if(!req.next) return { hasNext:false };
  // A record missing skillStatus (bad import, manual edit) reads as "nothing
  // signed yet" rather than crashing the page.
  var skillStatus = student.skillStatus || {};
  var missing = req.skillIds.filter(function(id){ return skillStatus[id]!=="signed"; });
  var signedCount = req.skillIds.length - missing.length;
  var elapsedDays = daysSince(student.since);
  var daysOk = elapsedDays >= req.reqDays;
  if(req.timeOnly){
    return { hasNext:true, nextRank:req.next, yearsGated:true, elapsedDays:elapsedDays, requiredDays:req.reqDays, requiredClasses:0,
      classesOk:true, daysOk:daysOk, skillsOk:true, eligible:daysOk, signedCount:signedCount, needSkills:req.skillIds.length, missingSkillIds:[] };
  }
  var classes = Number(student.classesAttended) || 0;
  var classesOk = classes >= req.reqClasses;
  var skillsOk = missing.length===0;
  return { hasNext:true, nextRank:req.next, yearsGated:false, elapsedDays:elapsedDays, requiredDays:req.reqDays, requiredClasses:req.reqClasses,
    classesOk:classesOk, daysOk:daysOk, skillsOk:skillsOk, eligible: classesOk && daysOk && skillsOk,
    signedCount:signedCount, needSkills:req.skillIds.length, missingSkillIds:missing };
}

// A required skill for the next grade is not signed off yet. Never true for
// a time-only rank, where skills are optional.
function skillsIncomplete(student){
  var el = computeEligibility(student);
  return !!(el.hasNext && !el.yearsGated && !el.skillsOk);
}
function incompleteSkillIds(student){
  var el = computeEligibility(student);
  return el.hasNext ? el.missingSkillIds : [];
}
// Enough classes may be done, but the minimum time in rank has not passed.
function daysShort(student){
  var el = computeEligibility(student);
  return !!(el.hasNext && !el.yearsGated && !el.daysOk);
}

/* The single way a student's rank changes. Grade, Downgrade, bulk promote
   and grading events all end here, so every one of them writes the same
   history entry and resets the same things: the time-in-rank clock, the
   class count and the skill sign-offs. */
function applyRankChange(student, toRank, opts){
  opts = opts || {};
  student.history = student.history || [];
  student.history.unshift({ id:nextHistoryId(), rankId:toRank.id, rankName:toRank.name, type:opts.type||"promotion",
    date:opts.date, by:CURRENT_USER, note:opts.note||"", notes:"" });
  student.rankId = toRank.id;
  student.since = opts.date;
  student.classesAttended = isYearsRank(toRank) ? 0 : (opts.startingClasses||0);
  student.skillStatus = {};
}

/* ============== GRADING BOARD progress helpers ============== */
// Progress toward the NEXT grade, as a percentage — attendance-based for a
// normal rank, days-in-rank-based for a time-only rank. Skills and minimum
// days are deliberately NOT part of this number; they show as separate
// warnings on the card instead, never as a % penalty.
function computeProgress(student){
  var req = gradingRequirement(student);
  if(!req || !req.next) return null; // no next grade — not shown on the board
  if(req.timeOnly){
    return req.reqDays>0 ? Math.min(100, Math.round(daysSince(student.since)/req.reqDays*100)) : 100;
  }
  return req.reqClasses>0 ? Math.min(100, Math.round((Number(student.classesAttended)||0)/req.reqClasses*100)) : 100;
}
// Plain-language breakdown of computeProgress's math, for the board card's
// hover tooltip — e.g. "26/40 classes = 65%" or "180/365 days = 49%".
function progressBreakdownText(student){
  var req = gradingRequirement(student);
  if(!req || !req.next) return "";
  var pct = computeProgress(student);
  if(req.timeOnly) return daysSince(student.since)+"/"+req.reqDays+" days = "+pct+"%";
  return (Number(student.classesAttended)||0)+"/"+req.reqClasses+" classes = "+pct+"%";
}
function progressBand(pct){
  if(pct>=66) return "ready";
  if(pct>=33) return "almost";
  return "notready";
}
var BOARD_BANDS = [
  {key:"notready", label:"Just Starting", floor:0},
  {key:"almost",   label:"Getting There", floor:33},
  {key:"ready",    label:"Ready to Grade", floor:66}
];
// Snapping a student onto a band picks a raw count (classes attended, or
// days-in-rank) that itself gets rounded again by computeProgress when the
// board re-renders. A naive Math.round(total*floor/100) can round back down
// BELOW the floor on its second pass (e.g. 8 classes, 66% floor -> 5 classes
// -> displays as 63%, landing back in "Getting There"). This picks the
// smallest count whose *redisplayed* percentage is guaranteed to clear the floor.
function snapCountForFloor(total, floorPct){
  if(floorPct<=0 || total<=0) return 0;
  var x = Math.ceil(total*(floorPct-0.5)/100);
  if(x<0) x=0;
  if(x>total) x=total;
  return x;
}

/* ============== BELT SWATCH (base + secondary + tiered stripes) ============== */
function stripeMarksArray(r){
  var tiers = (r.stripeTiers && r.stripeTiers.length) ? r.stripeTiers : [];
  var marks = [];
  tiers.forEach(function(t){
    for(var i=0;i<t.count;i++) marks.push(t.color||"#1A1A1A");
  });
  return marks;
}
function stripesSummaryText(tiers){
  tiers = (tiers||[]).filter(function(t){ return t.count>0; });
  if(!tiers.length) return "no stripes";
  return tiers.map(function(t){ return t.count+" "+t.color.toUpperCase()+" stripe"+(t.count===1?"":"s"); }).join(" + ");
}
/* The coral / red degree belts (7th-9th) aren't built from the usual
   tag+stripes pattern — they're their own fixed decorative bar, matching
   IBJJF's own chart: red — metal accent — a white zone with red degree
   bars — white gap — metal accent — red — then the belt's own main color
   filling the rest. 7th & 8th degree use a SILVER accent; 9th degree
   switches to GOLD and its main color is red, so the bar reads as one
   continuous red mass at the end, exactly like the reference chart. */
function coralBeltBar(r, width, height){
  var mainColor = r.secondaryColor || r.color;
  var accent = r.coralAccent;
  var radius = Math.max(3, Math.round(height*0.16));
  var stripeCount = 7;
  var segs = [
    {w:0.08, bg:"#C23B3B"},
    {w:0.05, bg:accent},
    {w:0.32, bg:"#FFFFFF", stripes:true},
    {w:0.05, bg:"#FFFFFF"},
    {w:0.05, bg:accent},
    {w:0.07, bg:"#C23B3B"}
  ];
  var html = '<div style="display:flex; align-items:stretch; width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; overflow:hidden; border:1px solid #17181A; flex:0 0 auto;">';
  segs.forEach(function(s){
    var segW = Math.max(1, Math.round(width*s.w));
    if(s.stripes){
      var barW = Math.max(1, Math.round(segW/(stripeCount*2.2)));
      var gap = Math.max(1, Math.round((segW - barW*stripeCount)/(stripeCount+1)));
      var bars = "";
      for(var i=0;i<stripeCount;i++){
        bars += '<div style="position:absolute; left:'+(gap+i*(barW+gap))+'px; top:0; bottom:0; width:'+barW+'px; background:#C23B3B;"></div>';
      }
      html += '<div style="position:relative; flex:0 0 '+segW+'px; background:'+s.bg+';">'+bars+'</div>';
    } else {
      html += '<div style="flex:0 0 '+segW+'px; background:'+s.bg+';"></div>';
    }
  });
  html += '<div style="flex:1; background:'+mainColor+';"></div>';
  html += '</div>';
  return html;
}

/* A belt drawn as a strap laid flat: the belt's own color fills the body,
   and a tip on the left holds the stripe marks as thin vertical bars,
   matching how a real belt (and IBJJF's own degree charts) actually look.
   Every colour belt carries a BLACK tag by default — sewn on regardless of
   how many stripes have been earned — except Black Belt, which carries a
   RED tag instead (rank.tagColor carries that choice; leaving it unset
   keeps the belt tag-less). A bicolor belt (e.g. Grey/White) is two
   horizontal lanes of solid color running the belt's FULL length — real
   belts are stitched from two strips of fabric side by side lengthwise,
   not cut diagonally. The coral/red degree belts (7th-9th) skip all of
   this and use coralBeltBar instead — see rank.coralAccent above. */
function beltSwatch(r, width, height){
  width = width || 96;
  height = height || Math.round(width*0.30);
  var radius = Math.max(3, Math.round(height*0.16));
  var marks = stripeMarksArray(r);

  if(r.coralAccent){
    return coralBeltBar(r, width, height);
  }
  var tagBg = r.tagColor || "#0E0E10";

  /* Bicolor kids belts (e.g. Grey/White) are the belt's base colour on the
     top AND bottom thirds, with the secondary colour running straight
     through the middle third — not two equal halves, and no gap between
     the bands — the way a real belt's contrast stripe is sewn straight
     down the middle. This same 3-band pattern continues on BOTH sides of
     the black tag, so it reads as one continuous belt with the tag simply
     laid over a small stretch of it. */
  function body(extraStyle){
    if(!r.secondaryColor){
      return '<div style="flex:1; background:'+r.color+'; '+(extraStyle||"")+'"></div>';
    }
    return '<div style="flex:1; display:flex; flex-direction:column; '+(extraStyle||"")+'">'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '<div style="flex:1; background:'+r.secondaryColor+';"></div>'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '</div>';
  }
  function laneSegment(w){
    return '<div style="flex:0 0 '+w+'px; display:flex; flex-direction:column;">'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '<div style="flex:1; background:'+r.secondaryColor+';"></div>'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '</div>';
  }

  if(!marks.length && !r.tagColor){
    if(!r.secondaryColor){
      return '<div style="width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; background:'+r.color+'; border:1px solid #17181A; flex:0 0 auto;"></div>';
    }
    return '<div style="display:flex; flex-direction:column; width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; overflow:hidden; border:1px solid #17181A; flex:0 0 auto;">'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '<div style="flex:1; background:'+r.secondaryColor+';"></div>'+
      '<div style="flex:1; background:'+r.color+';"></div>'+
      '</div>';
  }

  /* A real belt only has room for 6 stripe positions on its tip (enough for
     a full Black Belt degree run, 1st through 6th). Once more than 6
     degrees are earned, a new one doesn't add a 7th bar — it replaces the
     oldest bar in place, so the belt always shows the 6 MOST RECENT degrees.
     Every bar is a FIXED width, sized off the 6-slot maximum rather than
     the actual count, and the bars are left-aligned in the tip — so a belt
     with 2 stripes isn't drawn any wider or thinner than one with 6, it
     simply has fewer bars filled in from the left. */
  var MAX_VISIBLE = 6;
  var visible = marks.length>MAX_VISIBLE ? marks.slice(marks.length-MAX_VISIBLE) : marks;
  // The tip is about a third of the belt, widened if needed so six stripe
  // bars still fit — but never more than half the belt, or a small swatch
  // (like the ones on the board cards) would be nearly all tag and hide the
  // belt's own colour.
  var tipW = Math.max(Math.round(width*0.34), MAX_VISIBLE*5+8);
  if(tipW > Math.round(width*0.5)) tipW = Math.max(6, Math.round(width*0.5));
  var barW = Math.max(1, Math.round(tipW/(MAX_VISIBLE*2.2)));
  var gap = Math.max(1, Math.round(tipW/(MAX_VISIBLE*6)));
  var bars = visible.map(function(c){ return '<div style="flex:0 0 '+barW+'px; align-self:stretch; background:'+c+';"></div>'; }).join("");
  var tagSegment = '<div style="flex:0 0 '+tipW+'px; background:'+tagBg+'; display:flex; align-items:center; justify-content:flex-start; gap:'+gap+'px; padding-left:'+gap+'px;">'+bars+'</div>';

  /* Bicolor belts show a small lead-in stretch of the 3-band pattern before
     the tag, so the belt reads as continuous fabric with the tag laid on
     top of it, not a solid black block replacing the belt's own colour. */
  var leadIn = r.secondaryColor ? laneSegment(Math.max(4, Math.round(width*0.09))) : "";

  return '<div style="display:flex; align-items:stretch; width:'+width+'px; height:'+height+'px; border-radius:'+radius+'px; overflow:hidden; border:1px solid #17181A; flex:0 0 auto;">'+
    leadIn + tagSegment +
    body() +
    '</div>';
}

/* ============== AVATARS ==============
   Deterministic, fully self-contained placeholder avatars — flat, friendly,
   clearly illustrated (not photographic) faces, generated per person id/name
   with no external image or network dependency. Same seed always renders
   the same face, so a student looks the same on the board, in their detail
   modal, and in the promote/grade flows. */
var AVATAR_PALETTE = ["#5B6B8C","#5E8C7A","#8C7550","#6E5B8C","#4E7D8C","#8C5B5B","#5B738C","#71805A"];
function hashSeed(s){
  var h = 0;
  s = String(s||"x");
  for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function initialsFor(name){
  var parts = String(name||"?").trim().split(/\s+/);
  var first = parts[0] ? parts[0][0] : "";
  var last = parts.length>1 ? parts[parts.length-1][0] : "";
  return (first+last).toUpperCase() || "?";
}
function avatarSvg(name, size){
  var h = hashSeed(name);
  var bg = AVATAR_PALETTE[h % AVATAR_PALETTE.length];
  var s = size || 36;
  var fs = Math.round(s*0.38);
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'" style="display:block; flex:0 0 auto;">'+
    '<circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+(s/2)+'" fill="'+bg+'"/>'+
    '<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="'+fs+'" fill="#fff">'+esc(initialsFor(name))+'</text>'+
    '</svg>';
}
function avatarWrap(name, size){
  return '<div style="width:'+size+'px; height:'+size+'px; border-radius:999px; overflow:hidden; flex:0 0 auto;">'+avatarSvg(name, size)+'</div>';
}

    {id:"dashboard", label:"Dashboard", icon:"dash", disabled:true},

/* Every action ends by calling render(), which rebuilds the whole page.
   That would normally throw away the keyboard focus — typing in the board's
   search box would lose the caret after every letter. So the focused field
   (found again by its id) and its caret position are carried across. */
function captureFocus(){
  var a = document.activeElement;
  if(!a || !a.id || (a.tagName!=="INPUT" && a.tagName!=="TEXTAREA")) return null;
  var k = { id:a.id, start:null, end:null };
  try { k.start = a.selectionStart; k.end = a.selectionEnd; } catch(e){}
  return k;
}
function restoreFocus(k){
  if(!k) return;
  var el = document.getElementById(k.id);
  if(!el) return;
  el.focus();
  if(k.start!=null){ try { el.setSelectionRange(k.start, k.end); } catch(e){} }
}

function render(){
  var keep = captureFocus();
  var page = "";
  var crumb = "";
  if(UI.page==="ranks"){ page = RanksPage(); crumb = crumbHtml("Grading","Styles & Ranks"); }
  else if(UI.page==="skills"){ page = SkillsPage(); crumb = crumbHtml("Grading","Skill Library"); }
  else if(UI.page==="curriculum"){ page = CurriculumPage(); crumb = crumbHtml("Grading","Curriculum"); }
  else if(UI.page==="curriculumSetup"){ page = CurriculumSetupPage(); crumb = crumbHtml("Grading","Manage Curriculum"); }
  else if(UI.page==="students"){ page = GradingBoardPage(); crumb = crumbHtml("Grading Board", getStyle(UI.selectedStyleId)?esc(getStyle(UI.selectedStyleId).name):""); }
  else if(UI.page==="events"){ page = EventsPage(); crumb = crumbHtml("Grading","Grading Events"); }
  else if(UI.page==="settings"){ page = SettingsPage(); crumb = crumbHtml("Grading","Settings"); }

  var html = '<div style="display:flex; width:100%; min-height:100vh; background:var(--bg);">';
  html += Sidebar();
  html += '<div style="flex:1; min-width:0; display:flex; flex-direction:column;">';
  html += Topbar(crumb);
  html += '<div style="padding:26px 28px 60px; flex:1;">'+page+'</div>';
  html += '</div></div>';

  if(UI.gradeOpen) html += GradeModal();
  if(UI.downgradeOpen) html += DowngradeModal();
  if(UI.applyStripesOpen) html += ApplyStripesModal();
  if(UI.lessonModalId) html += LessonModal(getLesson(UI.lessonModalId));
  if(UI.toast) html += Toast();

  document.getElementById("app").innerHTML = html;
  restoreFocus(keep);
  afterRender();
}

/* Keeps a free-text draft in step with what is typed, on every keystroke —
   NOT via render(), which would fight the caret. Without this, a re-render
   triggered by an unrelated control (a stripe stepper, a skill chip, a
   category chip) would rebuild the field from stale state and silently
   discard what was typed. */
function bindDraft(id, setter){
  var el = document.getElementById(id);
  if(el) el.addEventListener("input", function(e){ setter(e.target.value); });
  return el;
}

function afterRender(){
  bindDraft("downgradeReason", function(v){
    UI.downgradeReasonDraft = v;
    var btn = document.getElementById("downgradeConfirmBtn");
    if(btn){
      var ok = v.trim().length>0 && btn.getAttribute("data-has-pick")==="1";
      btn.disabled = !ok; btn.style.opacity = ok ? "1" : ".45";
    }
  });
  if(UI.selectNameOnRender){
    UI.selectNameOnRender = false;
    var nameInput = document.getElementById("rankNameInput");
    if(nameInput){ nameInput.focus(); nameInput.select(); }
  }
  if(UI.selectStyleNameOnRender){
    UI.selectStyleNameOnRender = false;
    var styleNameInput = document.getElementById("styleNameEditInput");
    if(styleNameInput){ styleNameInput.focus(); styleNameInput.select(); }

  if(UI.scrollToCurrentRankOnRender){
    UI.scrollToCurrentRankOnRender = false;
    var currentRow = document.getElementById("currentRankRow");
    if(currentRow){ currentRow.scrollIntoView({block:"center"}); }
  }
  if(UI.rankListScrollTop!=null){
    var pickList = document.getElementById("rankPickList");
    if(pickList){ pickList.scrollTop = UI.rankListScrollTop; }
    UI.rankListScrollTop = null;
  }

  bindDraft("newSkillDescInput", function(v){ UI.newSkillDescDraft = v; });

/* Builds a fresh {name, classTypes, ranks} draft from a template id — shared
   by "Start from template" and "Build from scratch" (when based on a
   template). Nothing here touches DB.styles, so callers are free to rename
   the result before saving it. */
function buildStyleFromTemplateId(templateId){
  if(IBJJF_VARIANTS[templateId]){
    var defs = buildIbjjfLadder(IBJJF_VARIANTS[templateId]);
    return { name:getTemplateMeta(templateId).name, classTypes:IBJJF_CLASS_TYPES.slice(),
      ranks:defs.map(function(d){ return makeRank(d, { id:nextId("rank"), skills:[] }); }) };
  }
  var t = SIMPLE_TEMPLATES[templateId];
  var ranks = t.defs.map(function(d,i){
    return makeRank({ name:d[0], order:i+1, color:d[1], stripeTiers:[{count:0,color:"#1A1A1A"}],
      classCount:d[2], minDays:d[3], weeklyCap:3, scope:[t.classTypes[0]] }, { id:nextId("rank") });
  });
  return { name:t.name, classTypes:t.classTypes.slice(), ranks:ranks };
}

/* The IBJJF ladder, in its three kids-stripe variants.

   Every colour belt — every kids belt from White through Green/Black, plus
   the adult Blue, Purple and Brown belts — is 5 SEPARATE ranks on the
   ladder, 0 through 4 white stripes, each its own rung a student is
   promoted into, rather than one rank with an editable stripe count. A
   belt's total classes and days are split evenly across those 5 rungs.

   opts.red adds, after the white rungs of every kids belt, rungs where red
   stripes replace the white ones on the belt tip one position at a time
   (1 red + 3 white, 2 red + 2 white, ...). White Belt only takes 1 red
   stripe; every other kids belt takes up to 4.

   opts.yellow (used together with opts.red) adds 3 more rungs on the 12
   non-White kids belts where yellow replaces red the same way (1 yellow +
   3 red, 2 + 2, 3 + 1). The belt promotes at 3 yellow + 1 red — there is no
   4-yellow rung. Both stripe orders were confirmed against reference photos:
   a new colour always enters from the same edge of the tip.

   Each red or yellow rung reuses the SAME per-stripe class and day numbers
   as that belt's white rungs.

   Black Belt is 7 separate ranks, 0 stripes (a fresh Black Belt) through 6
   stripes (6th degree). Beyond that a Black Belt promotes into the coral
   belts: Red/Black (7th degree), Red/White (8th), Red (9th). All of these
   are "time in rank only" ranks: classes are not counted, and minDays holds
   the official IBJJF years per degree — 3-3-3-5-5-5-7-7-10 — as days. Red
   Belt is the top rank, with nothing to wait for.

   tagColor is the small tab sewn onto the belt's tip: black on every colour
   belt, red on Black Belt. coralAccent marks the three coral belts, which
   are drawn as their own fixed bar (see coralBeltBar): SILVER for the 7th
   and 8th degree, GOLD for the 9th. Both are only about how the belt is
   drawn — the grading rule comes from timeOnly. */
function buildIbjjfLadder(opts){
  opts = opts || {};
  var WHITE="#FFFFFF", RED=IBJJF_BLACK_TAG_COLOR, YELLOW="#F0C419", BLACK="#17181A", SILVER="#B8BCC2", GOLD="#D9A441";
  var K = ["Kids Fundamentals"], KS = ["Kids Fundamentals","Kids Sparring"], A = ["Adult Fundamentals"], AS = ["Adult Fundamentals","Adult Sparring"], COMP = ["Adult Sparring","Competition Team"];

  // [name, colour, secondary colour, total classes, total days, weekly cap, class scope]
  var KIDS = [
    ["White Belt",        "#FFFFFF", null,      40,  180, 3, K],
    ["Grey/White Belt",   "#9CA3AF", "#FFFFFF", 40,  180, 3, K],
    ["Grey Belt",         "#9CA3AF", null,      90,  365, 3, K],
    ["Grey/Black Belt",   "#9CA3AF", "#17181A", 90,  365, 3, KS],
    ["Yellow/White Belt", "#F0C419", "#FFFFFF", 90,  365, 3, KS],
    ["Yellow Belt",       "#F0C419", null,      90,  365, 3, KS],
    ["Yellow/Black Belt", "#F0C419", "#17181A", 90,  365, 3, KS],
    ["Orange/White Belt", "#E8792B", "#FFFFFF", 90,  365, 3, KS],
    ["Orange Belt",       "#E8792B", null,      90,  365, 3, KS],
    ["Orange/Black Belt", "#E8792B", "#17181A", 90,  365, 3, KS],
    ["Green/White Belt",  "#3FA66B", "#FFFFFF", 90,  365, 3, KS],
    ["Green Belt",        "#3FA66B", null,      90,  365, 3, KS],
    ["Green/Black Belt",  "#3FA66B", "#17181A", 90,  365, 4, KS]
  ];
  var ADULT = [
    ["Blue Belt",         "#3B5FCB", null,      200, 730, 4, A],
    ["Purple Belt",       "#6B3FA0", null,      160, 548, 4, AS],
    ["Brown Belt",        "#7A4A22", null,      130, 365, 4, AS]
  ];

  function plural(n){ return n===1 ? '' : 's'; }
  function rung(belt, name, tiers){
    return { name:name, color:belt[1], secondaryColor:belt[2], stripeTiers:tiers,
      classCount:Math.round(belt[3]/5), minDays:Math.round(belt[4]/5), weeklyCap:belt[5], scope:belt[6].slice(),
      tagColor:BLACK, coralAccent:null, timeOnly:false };
  }
  function whiteRungs(belt){
    var rows = [];
    for(var n=0;n<=4;n++){
      rows.push(rung(belt, n===0 ? belt[0] : belt[0]+' · '+n+' Stripe'+plural(n), [{count:n,color:WHITE}]));
    }
    return rows;
  }
  function redRungs(belt, maxRed){
    var rows = [];
    for(var n=1;n<=maxRed;n++){
      var tiers = [{count:n, color:RED}];
      if(4-n>0) tiers.push({count:4-n, color:WHITE});
      rows.push(rung(belt, maxRed===1 ? belt[0]+' · Red Stripe' : belt[0]+' · '+n+' Red Stripe'+plural(n), tiers));
    }
    return rows;
  }
  function yellowRungs(belt){
    var rows = [];
    for(var n=1;n<=3;n++){
      rows.push(rung(belt, belt[0]+' · '+n+' Yellow Stripe'+plural(n), [{count:n, color:YELLOW}, {count:4-n, color:RED}]));
    }
    return rows;
  }
  function timeRank(name, color, secondaryColor, tiers, days, tagColor, coralAccent){
    return { name:name, color:color, secondaryColor:secondaryColor, stripeTiers:tiers,
      classCount:0, minDays:days, weeklyCap:0, scope:COMP.slice(), tagColor:tagColor, coralAccent:coralAccent, timeOnly:true };
  }

  var defs = [];
  KIDS.forEach(function(belt, i){
    defs = defs.concat(whiteRungs(belt));
    if(opts.red) defs = defs.concat(redRungs(belt, i===0 ? 1 : 4));
    if(opts.yellow && i>0) defs = defs.concat(yellowRungs(belt));
  });
  ADULT.forEach(function(belt){ defs = defs.concat(whiteRungs(belt)); });
  [1095, 1095, 1095, 1825, 1825, 1825, 2555].forEach(function(days, n){
    defs.push(timeRank(n===0 ? "Black Belt" : "Black Belt · "+n+" Stripe"+plural(n), BLACK, null, [{count:n,color:WHITE}], days, RED, null));
  });
  defs.push(timeRank("Red/Black Belt (7th Degree)", "#C23B3B", "#17181A", [], 2555, null, SILVER));
  defs.push(timeRank("Red/White Belt (8th Degree)", "#C23B3B", "#FFFFFF", [], 3650, null, SILVER));
  defs.push(timeRank("Red Belt (9th Degree)",       "#C23B3B", null,      [], 0,    null, GOLD));

  defs.forEach(function(d, i){ d.order = i+1; });
  return defs;
}

function stripeTiersHtml(d){
  var tiers = d.stripeTiers && d.stripeTiers.length ? d.stripeTiers : [{count:0,color:"#1A1A1A"}];
  var total = tiers.reduce(function(sum,t){return sum+t.count;},0);

  tiers.forEach(function(t, i){
    html += '<div style="display:flex; align-items:center; gap:9px;">'+
      '<div class="stepper"><button onclick="App.stepDraftTier('+i+',-1,0,12)">−</button><span class="val">'+t.count+'</span><button onclick="App.stepDraftTier('+i+',1,0,12)">+</button></div>'+
      '<input type="color" value="'+esc(t.color)+'" onchange="App.setDraftTierColor('+i+', this.value)" style="width:38px; height:32px; padding:2px; border-radius:7px; border:1px solid var(--border); background:var(--surface); cursor:pointer;">'+
      '<span style="font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;">'+t.count+' stripe'+(t.count===1?"":"s")+' this color</span>'+
      (tiers.length>1 ? '<button onclick="App.removeDraftTier('+i+')" title="Remove color tier" style="background:none; border:none; color:var(--text-faint); padding:2px; margin-left:auto;">'+icon("close",13)+'</button>' : '')+
      '</div>';
  });
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:2px;">'+
    (tiers.length<5 ? '<button class="btn btn-ghost" style="padding:6px 10px; font-size:11.5px;" onclick="App.addDraftTier()">'+icon("plus",12)+'Add color tier</button>' : '<span></span>')+
    '<span style="font-size:11px; color:var(--text-faint);">'+total+' total</span>'+
    '</div>';
  html += '<div style="font-size:10.5px; color:var(--text-faint); max-width:250px;">Each tier is a run of stripes in one color before the next color begins — e.g. 4 white, then 4 yellow, then 4 red, like IBJJF\'s kids degree system.</div>';
  if(total>6) html += '<div style="font-size:10.5px; color:var(--text-faint); max-width:250px; background:var(--surface-2); border-radius:7px; padding:8px 10px;">A belt only has room for 6 stripes. Past '+total+' total, the belt shows the 6 most recent — earlier colors get replaced as new ones are earned, same as a real belt.</div>';

  html += '<div style="display:flex; flex-direction:column; gap:6px;">';
  html += '<div style="display:flex; gap:6px; flex-wrap:wrap;">'+
    '<button class="btn btn-ghost" style="padding:6px 10px; font-size:11.5px;" onclick="App.copyStripes()" title="Copy this stripe setup to reuse on other belts">'+icon("copy",12)+'Copy stripes</button>'+
    (UI.stripeClipboard ? '<button class="btn btn-ghost" style="padding:6px 10px; font-size:11.5px;" onclick="App.pasteStripes()" title="Paste the copied stripe setup here">'+icon("paste",12)+'Paste stripes</button>' : '')+
    '</div>';
  if(UI.stripeClipboard){
    var style = getStyle(UI.selectedStyleId);
    var otherCount = style ? style.ranks.filter(function(r){ return r.id!==UI.rankFormEditId; }).length : 0;
    html += '<div style="display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 9px;">'+
      '<span style="font-size:10.5px; color:var(--text-muted); flex:1;">Clipboard: '+stripesSummaryText(UI.stripeClipboard.tiers)+' (from '+esc(UI.stripeClipboard.sourceName)+')</span>'+
      (otherCount>0 ? '<button class="btn btn-ghost" style="padding:5px 9px; font-size:11px; flex:0 0 auto;" onclick="App.openApplyStripes()">Apply to other belts…</button>' : '')+
      '<button onclick="App.clearStripeClipboard()" title="Clear clipboard" style="background:none; border:none; color:var(--text-faint); padding:2px; display:flex; flex:0 0 auto;">'+icon("close",12)+'</button>'+
      '</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

  var h = hashSeed(seed);

  return bg;
}
function LessonThumb(lesson, big){
  var bg = lessonThumbStyle(lesson.id);
  var playSize = big ? 30 : 20;
  var wrapSize = big ? 64 : 44;
  return '<div style="position:relative; width:100%; aspect-ratio:16/9; border-radius:'+(big?'14px 14px 0 0':'8px')+'; background:'+bg+'; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto;">'+
    '<div style="width:'+wrapSize+'px; height:'+wrapSize+'px; border-radius:999px; background:rgba(255,255,255,0.18); border:1.5px solid rgba(255,255,255,0.55); display:flex; align-items:center; justify-content:center; color:#fff;">'+icon("play",playSize)+'</div>'+

    '</div>';

    '<input id="lessonDurationInput" type="text" placeholder="6:42" value="'+esc(d.duration)+'" style="width:100%;"></div>'+
    '</div>';

  html += '<div><label style="font-size:11.5px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px;">Description</label>'+
    '<textarea id="lessonTextInput" placeholder="What this video covers" style="width:100%; min-height:70px; resize:vertical;">'+esc(d.text)+'</textarea></div>';

  html += '<div><div style="font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:8px;">Required for skill(s) <span style="font-weight:400; color:var(--text-faint);">(optional)</span></div><div style="display:flex; gap:8px; flex-wrap:wrap;">';
  DB.skills.forEach(function(sk){
    var on = d.skillIds.indexOf(sk.id)>-1;
    html += '<button class="chip'+(on?" on":"")+'" onclick="App.toggleLessonDraftSkill(\''+sk.id+'\')">'+(on?icon("check",12):"")+esc(sk.name)+'</button>';
  });
  html += '<button class="chip" style="border-style:dashed;" onclick="App.nav(\'skills\')">+ Manage skill library</button>';
  html += '</div></div>';

    '<button class="btn btn-ghost" onclick="App.cancelLessonForm()">Cancel</button>'+
