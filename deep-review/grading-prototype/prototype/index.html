  },
  pasteStripes: function(){
    if(!UI.stripeClipboard || !UI.rankDraft) return;
    UI.rankDraft.stripeTiers = UI.stripeClipboard.tiers.map(function(t){ return {count:t.count, color:t.color}; });
    render();
  },
  openApplyStripes: function(){
    if(!UI.stripeClipboard) return;
    UI.applyStripesOpen = true; UI.applyStripesTargets = [];
    render();
  },
  closeApplyStripes: function(){ UI.applyStripesOpen=false; UI.applyStripesTargets=[]; render(); },
  clearStripeClipboard: function(){ UI.stripeClipboard=null; render(); },
  toggleApplyStripesTarget: function(id){
    var i = UI.applyStripesTargets.indexOf(id);
    if(i>-1) UI.applyStripesTargets.splice(i,1); else UI.applyStripesTargets.push(id);
    render();
  },
  toggleAllApplyStripesTargets: function(){
    var style = getStyle(UI.selectedStyleId);
    var ranks = style.ranks.filter(function(r){ return r.id!==UI.rankFormEditId; });
    if(UI.applyStripesTargets.length===ranks.length){ UI.applyStripesTargets=[]; }
    else { UI.applyStripesTargets = ranks.map(function(r){ return r.id; }); }
    render();
  },
  confirmApplyStripes: function(){
    var style = getStyle(UI.selectedStyleId);
    var clip = UI.stripeClipboard;
    if(!style || !clip || !UI.applyStripesTargets.length) return;
    var appliedTo = [];
    UI.applyStripesTargets.forEach(function(id){
      var r = getRank(style.id, id);
      if(!r) return;
      r.stripeTiers = clip.tiers.map(function(t){ return {count:t.count, color:t.color}; });
      appliedTo.push(r.name);
    });
    var n = appliedTo.length;
    UI.toast = "Applied " + stripesSummaryText(clip.tiers) + " to " + n + " belt" + (n===1?"":"s") + (n<=3 ? (": " + appliedTo.join(", ")) : ".");
    UI.applyStripesOpen = false; UI.applyStripesTargets = [];
    render();
  },
  // Takes the class type's position, not its name, so a name containing a
  // quote or apostrophe can never break the button it is written into.
  toggleDraftScope: function(index){
    var style = getStyle(UI.selectedStyleId);
    var ct = style ? style.classTypes[index] : null;
    if(ct==null || !UI.rankDraft) return;
    var i = UI.rankDraft.scope.indexOf(ct);
    if(i>-1) UI.rankDraft.scope.splice(i,1); else UI.rankDraft.scope.push(ct);
    render();
  },
  toggleDraftSkill: function(id){
    var i = UI.rankDraft.skills.indexOf(id);
    if(i>-1) UI.rankDraft.skills.splice(i,1); else UI.rankDraft.skills.push(id);
    render();
  },
  /* Switches a rank between "classes, days and skills" and "time in rank
     only". minDays means days in the first mode and whole years (stored as
     days) in the second, so it is tidied into a sensible value for the mode
     being switched to. */
  toggleDraftTimeOnly: function(){
    var d = UI.rankDraft;
    if(!d) return;
    d.timeOnly = !d.timeOnly;
    if(d.timeOnly){
      d.minDays = yearsToDays(Math.min(12, Math.max(1, daysToYears(d.minDays||0))));
    } else {
      if(d.minDays>900) d.minDays = 365;
      if(!d.weeklyCap || d.weeklyCap<1) d.weeklyCap = 3;
    }
    render();
  },
  submitRank: function(){
    var input = document.getElementById("rankNameInput");
    var d = UI.rankDraft;
    var style = getStyle(UI.selectedStyleId);
    if(!d || !style) return;
    var name = (input ? input.value : (d.name||"")).trim();
    if(!name){ UI.rankNameError=true; render(); return; }
    if(UI.rankFormMode==="add"){
      var order = style.ranks.length ? Math.max.apply(null, style.ranks.map(function(r){return r.order;})) + 1 : 1;
      var rank = makeRank(d, { id:nextId("rank"), name:name, order:order });
      style.ranks.push(rank);
      UI.selectedRankId = rank.id;
      UI.toast = "\"" + name + "\" added to " + style.name + ".";
    } else {
      var r = getRank(style.id, UI.rankFormEditId);
      if(!r) return;
      style.ranks[style.ranks.indexOf(r)] = makeRank(d, { id:r.id, name:name, order:r.order });
      UI.selectedRankId = r.id;
      UI.toast = "\"" + name + "\" updated.";
    }
    UI.rankFormOpen=false; UI.rankDraft=null;
    render();
  },
  /* A rank that students currently hold cannot be deleted — they would be
     left pointing at nothing and drop off the board. Everything else asks
     for a confirmation first. */
  askDeleteRank: function(id){
    var style = getStyle(UI.selectedStyleId);
    if(!style) return;
    var n = studentsAtRank(style.id, id).length;
    if(n>0){
      UI.confirmDeleteRankId = null;
      UI.toast = "Can't delete this rank — " + n + " student" + (n===1?" holds":"s hold") + " it. Grade or downgrade them to another rank first.";
      render(); return;
    }
    UI.confirmDeleteRankId = id; render();
  },
  cancelDeleteRank: function(){ UI.confirmDeleteRankId = null; render(); },
  deleteRank: function(id){
    var style = getStyle(UI.selectedStyleId);
    if(!style) return;
    if(studentsAtRank(style.id, id).length){ App.askDeleteRank(id); return; }
    var r = getRank(style.id, id);
    if(!r) return;
    style.ranks = style.ranks.filter(function(x){ return x.id!==id; });
    style.ranks.sort(function(a,b){return a.order-b.order;}).forEach(function(x,i){ x.order=i+1; });
    UI.confirmDeleteRankId = null;
    if(UI.rankFormEditId===id){ UI.rankFormOpen=false; UI.rankDraft=null; }
    if(UI.selectedRankId===id) UI.selectedRankId = style.ranks[0] ? style.ranks[0].id : null;
    UI.toast = "\"" + r.name + "\" deleted.";
    render();
  },
  /* Copy an existing rank — colours, stripe tiers, requirements, scope and
     required skills all carry over — then drop straight into the Edit form so
     the only thing left to do is rename it and tweak what's different. */
  duplicateRank: function(id){
    var style = getStyle(UI.selectedStyleId);
    var r = style && getRank(style.id, id);
    if(!r) return;
    var baseName = r.name.replace(/ copy( \d+)?$/,'');
    var existingNames = style.ranks.map(function(x){return x.name;});
    var name = baseName + " copy", n = 1;
    while(existingNames.indexOf(name)>-1){ n++; name = baseName + " copy " + n; }
    var clone = makeRank(r, { id:nextId("rank"), name:name, order:r.order+1 });
    style.ranks.forEach(function(x){ if(x.order > r.order) x.order += 1; });
    style.ranks.push(clone);
    style.ranks.sort(function(a,b){return a.order-b.order;}).forEach(function(x,i){ x.order = i+1; });
    UI.selectedRankId = clone.id;
    UI.toast = "\"" + r.name + "\" duplicated right below itself as \"" + name + "\" — rename and adjust it below.";
    UI.selectNameOnRender = true;
    App.openEditRank(clone.id);
  },

  /* Rank ladder drag-to-reorder. Deliberately avoids calling render() on
     dragover/dragenter — replacing the DOM mid-drag would abort the browser's
     native drag session. Only dragstart (state only, no render) and drop
     (the actual reorder) touch things; dragover/leave just tweak the target
     row's own border directly for a drop-position hint. */
  dragStart: function(e, id){
    UI.draggingRankId = id;
    e.dataTransfer.effectAllowed = "move";
    e.currentTarget.style.opacity = "0.4";
  },
  dragOverRow: function(e){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid var(--accent)";
  },
  dragLeaveRow: function(e){
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
  },
  dragEnd: function(e){
    if(e.currentTarget) e.currentTarget.style.opacity = "1";
    UI.draggingRankId = null;
  },
  dropOnRank: function(e, targetId){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
    var draggingId = UI.draggingRankId;
    UI.draggingRankId = null;
    if(!draggingId) return;
    if(draggingId===targetId) { render(); return; }
    var style = getStyle(UI.selectedStyleId);
    var ranks = style.ranks.slice().sort(function(a,b){return a.order-b.order;});
    var fromIdx = ranks.findIndex(function(r){return r.id===draggingId;});
    if(fromIdx<0) return;
    var moved = ranks.splice(fromIdx,1)[0];
    var insertIdx;
    if(targetId===null){
      insertIdx = ranks.length; // dropped on the "end of ladder" zone
    } else {
      var rect = e.currentTarget.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      insertIdx = ranks.findIndex(function(r){return r.id===targetId;});
      if(insertIdx<0) insertIdx = ranks.length;
      else if(after) insertIdx += 1;
    }
    ranks.splice(insertIdx, 0, moved);
    ranks.forEach(function(r,i){ r.order=i+1; });
    style.ranks = ranks;
    UI.selectedRankId = moved.id;
    UI.toast = "\"" + moved.name + "\" moved to position " + (insertIdx+1) + " of " + ranks.length + ".";
    render();
  },

  setSkillFilter: function(id){ UI.skillFilter=id; render(); },
  toggleSkillForm: function(){
    UI.skillFormOpen=!UI.skillFormOpen; UI.newSkillError=false;
    if(UI.skillFormOpen){ UI.newSkillNameDraft=""; UI.newSkillDescDraft=""; }
    render();
  },
  setNewSkillStyle: function(id){ UI.newSkillStyleId=id; render(); },
  toggleExpandSkill: function(id){ UI.expandedSkillId = UI.expandedSkillId===id ? null : id; render(); },
  submitSkill: function(){
    var nameEl = document.getElementById("newSkillNameInput");
    var descEl = document.getElementById("newSkillDescInput");
    var name = nameEl ? nameEl.value.trim() : "";
    var desc = descEl ? descEl.value.trim() : "";
    if(!name){ UI.newSkillError=true; render(); return; }
    var styleId = UI.newSkillStyleId || UI.selectedStyleId;
    if(!getStyle(styleId)){ UI.toast = "Create a style first — a skill belongs to a style."; render(); return; }
    DB.skills.push({ id:nextId("skill"), name:name, description: desc || "No description yet.", styleId: styleId });
    UI.skillFormOpen=false; UI.newSkillError=false; UI.newSkillNameDraft=""; UI.newSkillDescDraft="";
    UI.toast = "\"" + name + "\" added to the skill library.";
    render();
  },

  logClass: function(){
    var s = currentStudent();
    if(!s) return;
    var before = computeEligibility(s);
    s.classesAttended = (Number(s.classesAttended)||0) + 1;
    var after = computeEligibility(s);
    if(after.hasNext && after.eligible && !(before.hasNext && before.eligible)){
      UI.toast = "🔔 " + s.name + " just became eligible to grade — owner notified.";
    }
    render();
  },
  cycleSkill: function(sid){
    var s = currentStudent();
    if(!s) return;
    s.skillStatus = s.skillStatus || {};
    var cur = s.skillStatus[sid] || "not_started";
    var next = cur==="not_started" ? "learning" : cur==="learning" ? "signed" : "not_started";
    var before = computeEligibility(s);
    s.skillStatus[sid] = next;
    var after = computeEligibility(s);
    if(after.hasNext && after.eligible && !(before.hasNext && before.eligible)){
      UI.toast = "🔔 " + s.name + " just became eligible to grade — owner notified.";
    }
    render();
  },
  dismissToast: function(){ UI.toast=null; render(); },

  toggleHistoryNoteEditor: function(hid){ UI.editingHistoryId = UI.editingHistoryId===hid ? null : hid; render(); },
  setHistoryNotes: function(hid, value){
    var s = currentStudent();
    if(!s) return;
    var h = (s.history||[]).find(function(x, i){ return (x.id||("legacy-"+i))===hid; });
    if(h) h.notes = value;
    render();
  },
  askDeleteHistory: function(hid){ UI.confirmDeleteHistoryId = hid; render(); },
  cancelDeleteHistory: function(){ UI.confirmDeleteHistoryId = null; render(); },
  confirmDeleteHistory: function(hid){
    var s = currentStudent();
    if(!s) return;
    s.history = (s.history||[]).filter(function(x, i){ return (x.id||("legacy-"+i))!==hid; });
    UI.confirmDeleteHistoryId = null;
    UI.editingHistoryId = null;
    render();
  },

  // Opens on the NEXT rank, the usual choice. (It used to open on the rank the
  // student already holds, so pressing Confirm straight away "graded" them to
  // their own rank and wiped their classes and sign-offs.)
  openGrade: function(){
    var s = currentStudent();
    if(!s) return;
    var nr = nextRank(s.styleId, s.rankId);
    UI.gradePickedRankId = nr ? nr.id : null;
    UI.gradeDraftDate=formatToday(); UI.gradeDateError=null; UI.gradeDraftClasses=0; UI.gradeAckWarning=false;
    UI.gradeOpen=true; UI.downgradeOpen=false; UI.scrollToCurrentRankOnRender=true;
    render();
  },
  openDowngrade: function(){
    var s = currentStudent();
    var style = s && getStyle(s.styleId);
    var cur = s && getRank(s.styleId, s.rankId);
    if(!s || !style || !cur) return;
    var prev = style.ranks.find(function(r){ return r.order===cur.order-1; });
    UI.gradePickedRankId = prev ? prev.id : null;
    UI.downgradeReasonDraft = "";
    UI.downgradeOpen=true; UI.gradeOpen=false; UI.scrollToCurrentRankOnRender=true;
    render();
  },
  closeModals: function(){ UI.gradeOpen=false; UI.downgradeOpen=false; render(); },
  pickGradeRank: function(id){
    // Picking a rank re-renders the whole app, which replaces the rank-list
    // DOM node and would otherwise silently reset its scroll position to the
    // top — forcing a rescroll after every click. Capture where the list was
    // scrolled to and hand it to afterRender() to restore post-render.
    var list = document.getElementById("rankPickList");
    UI.rankListScrollTop = list ? list.scrollTop : null;
    UI.gradePickedRankId=id;
    render();
  },
  setGradeDraftDate: function(v){
    var chk = normalizeDateInput(v);
    if(chk.ok){
      var s = currentStudent();
      UI.gradeDraftDate = chk.value;
      UI.gradeDateError = (s && getRank(s.styleId, s.rankId)) ? gradingDateProblem(s, chk.value) : null;
    } else { UI.gradeDraftDate = v; UI.gradeDateError = chk.error; }
    render();
  },
  setGradeDraftClasses: function(v){ var n=parseInt(v,10); UI.gradeDraftClasses = isNaN(n) ? 0 : Math.max(0,n); render(); },
  toggleGradeAck: function(){ UI.gradeAckWarning=!UI.gradeAckWarning; render(); },
  confirmGrade: function(){
    var s = currentStudent();
    var style = s && getStyle(s.styleId);
    if(!s || !style) return;
    var fromRank = getRank(s.styleId, s.rankId);
    var toRank = getRank(s.styleId, UI.gradePickedRankId);
    if(!toRank) return;
    // Every check below is also enforced by the modal's disabled Confirm
    // button — repeated here so nothing that bypasses the screen can break
    // a rule.
    if(fromRank && toRank.order <= fromRank.order) return;            // up only; down is Downgrade
    if(fromRank && skillsIncomplete(s)){
      if(style.skillsRequired) return;                                 // hard block, no override
      if(!UI.gradeAckWarning) return;                                  // soft warning not acknowledged
    }
    var chk = normalizeDateInput(UI.gradeDraftDate || formatToday());
    if(!chk.ok){ UI.gradeDateError = chk.error; render(); return; }
    var early = fromRank ? gradingDateProblem(s, chk.value) : null;
    if(early){ UI.gradeDateError = early; render(); return; }
    var skipped = fromRank ? toRank.order - fromRank.order : 0;
    var note = !fromRank ? "Rank assigned — the student's previous rank no longer exists."
      : skipped>1 ? "Skipped " + (skipped-1) + " rank" + (skipped-1>1?"s":"") + " in between."
      : "";
    applyRankChange(s, toRank, { type:"promotion", date:chk.value, note:note, startingClasses:UI.gradeDraftClasses||0 });
    UI.gradeOpen=false; UI.gradeDateError=null;
    UI.toast = s.name + " graded to " + toRank.name + ".";
    render();
  },
  confirmDowngrade: function(){
    var s = currentStudent();
    var cur = s && getRank(s.styleId, s.rankId);
    var toRank = s && getRank(s.styleId, UI.gradePickedRankId);
    if(!s || !cur || !toRank) return;
    if(toRank.order >= cur.order) return;                              // down only; up is Grade
    var reasonEl = document.getElementById("downgradeReason");
    var reason = (reasonEl ? reasonEl.value : (UI.downgradeReasonDraft||"")).trim();
    if(!reason) return;
    applyRankChange(s, toRank, { type:"downgrade", date:formatToday(), note:"Reason: " + reason });
    UI.downgradeOpen=false; UI.downgradeReasonDraft="";
    UI.toast = s.name + " downgraded to " + toRank.name + ".";
    render();
  },

  toggleFee: function(){ DB.settings.feeOn = !DB.settings.feeOn; render(); },
  toggleSkillsRequired: function(styleId){
    var sty = getStyle(styleId);
    if(!sty) return;
    sty.skillsRequired = !sty.skillsRequired;
    render();
  },
  toggleChannel: function(id){ DB.settings.channels[id] = !DB.settings.channels[id]; render(); },
  togglePerm: function(insId, styleKey){
    var ins = DB.settings.instructors.find(function(i){return i.id===insId;});
    if(!ins) return;
    ins.perm = ins.perm || {};
    ins.perm[styleKey] = !ins.perm[styleKey];
    render();
  },

  toggleSchedule: function(){
    UI.scheduleOpen=!UI.scheduleOpen; UI.eventFormError=null;
    if(UI.scheduleOpen) UI.eventDraft = { title:"", date:formatToday(), venue:"Riverside — Main Mat" };
    render();
  },
  createEvent: function(){
    var evStyle = getStyle(UI.selectedStyleId);
    if(!evStyle) return;
    var d = UI.eventDraft || {};
    var titleEl = document.getElementById("eventTitleInput");
    var dateEl = document.getElementById("eventDateInput");
    var venueEl = document.getElementById("eventVenueInput");
    var title = (titleEl ? titleEl.value : (d.title||"")).trim();
    var venue = (venueEl ? venueEl.value : (d.venue||"")).trim();
    var chk = normalizeDateInput(dateEl ? dateEl.value : (d.date||""), true); // an event is usually in the future
    UI.eventDraft = { title:title, date:(dateEl ? dateEl.value : (d.date||"")), venue:venue };
    if(!title){ UI.eventFormError = "Give the event a name."; render(); return; }
    if(!chk.ok){ UI.eventFormError = chk.error; render(); return; }
    // Pre-fill with the students of this style who are eligible right now.
    var participants = DB.students.filter(function(s){
      return s.styleId===evStyle.id && s.active!==false && computeEligibility(s).eligible===true;
    }).map(function(s){ return { id:s.id, name:s.name, result:null }; });
    DB.events.unshift({ id:nextId("event"), title:title, date:chk.value, venue:venue || "Venue to be confirmed", styleId:evStyle.id, status:"scheduled", participants:participants });
    UI.scheduleOpen=false; UI.eventDraft=null; UI.eventFormError=null; UI.eventsView="list";
    UI.toast = "\"" + title + "\" created with " + participants.length + " eligible student" + (participants.length===1?"":"s") + " added.";
    render();
  },
  viewEvent: function(id){ UI.selectedEventId=id; UI.eventsView="run"; render(); },
  backToEvents: function(){ UI.eventsView="list"; render(); },
  // Results, and the participant list, can only change while the event is
  // still scheduled. A completed event is a record.
  setResult: function(eventId, participantId, result){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    if(!ev || ev.status!=="scheduled") return;
    var p = ev.participants.find(function(x){return x.id===participantId;});
    if(!p) return;
    p.result = p.result===result ? null : result;
    render();
  },
  addEventParticipant: function(eventId, studentId){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    if(!ev || ev.status!=="scheduled") return;
    if(studentId==null){
      var sel = document.getElementById("eventAddSelect");
      studentId = sel ? sel.value : null;
    }
    var s = eventCandidates(ev).find(function(x){ return x.id===studentId; });
    if(!s) return;
    ev.participants.push({ id:s.id, name:s.name, result:null });
    render();
  },
  removeEventParticipant: function(eventId, participantId){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    if(!ev || ev.status!=="scheduled") return;
    ev.participants = ev.participants.filter(function(p){ return p.id!==participantId; });
    render();
  },
  /* Completing an event promotes every participant marked Pass by ONE rank,
     dated the day of the event (or today, if the event date is still in the
     future), and writes it to their history. A pass who cannot be promoted —
     already at the top rank, record missing, or blocked by "skills required"
     — is left alone and the reason is kept on the event. An event can only be
     completed once. */
  completeEvent: function(eventId){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    if(!ev || ev.status!=="scheduled") return;
    var evDate = parseDate(ev.date);
    var date = (evDate && dayNumber(evDate) <= dayNumber(new Date())) ? formatDate(evDate) : formatToday();
    var promoted = 0, held = 0;
    ev.participants.forEach(function(p){
      if(p.result!=="pass"){ p.outcome = p.result==="fail" ? "Not promoted" : "No result recorded"; return; }
      var s = DB.students.find(function(x){ return x.id===p.id; });
      var nr = s ? nextRank(s.styleId, s.rankId) : null;
      if(!s){ p.outcome = "Passed, not promoted — student record not found"; held++; return; }
      if(!nr){ p.outcome = "Passed, not promoted — already at the top rank"; held++; return; }
      if(isHardBlocked(s)){ p.outcome = "Passed, not promoted — required skills not signed off"; held++; return; }
      // If the student reached their current rank after the event's date, the
      // promotion is dated today instead, so their history never runs backwards.
      applyRankChange(s, nr, { type:"promotion", date: gradingDateProblem(s, date) ? formatToday() : date, note:"Passed at " + ev.title + "." });
      p.outcome = "Promoted to " + nr.name;
      promoted++;
    });
    ev.status="completed";
    UI.toast = promoted + " student" + (promoted===1?"":"s") + " promoted and logged to their history." +
      (held ? " " + held + " passed but could not be promoted — open the event to see why." : "");
    UI.eventsView="list";
    render();
  }
};
window.App = App;

render();
</script>
