    '<div style="font-size:13.5px; color:var(--text-muted); margin-top:4px;">Every student\'s progress toward their next grade, at a glance. Drag a card to a different column to move them, or select several and promote them together.</div></div>';
  if(DB.styles.length){
    html += '<select onchange="App.selectStyle(this.value)" style="border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; font-weight:600; background:var(--surface); color:var(--text);">';
    DB.styles.forEach(function(s){ html += '<option value="'+s.id+'" '+(s.id===UI.selectedStyleId?"selected":"")+'>'+esc(s.name)+'</option>'; });
    html += '</select>';
  }
  html += '</div>';

  if(!style){ html += EmptyStylesState(); html += '</div>'; return html; }

  var allInStyle = DB.students.filter(function(s){ return s.styleId===style.id; });
  var visible = allInStyle.filter(function(s){
    if(UI.boardActiveOnly && s.active===false) return false;
    if(UI.boardSearch && UI.boardSearch.trim()){
      if(s.name.toLowerCase().indexOf(UI.boardSearch.trim().toLowerCase())===-1) return false;
    }
    return true;
  });
  var inactiveHidden = allInStyle.length - visible.length;

  var buckets = {notready:[], almost:[], ready:[]};
  var excluded = 0;
  visible.forEach(function(s){
    var pct = computeProgress(s);
    if(pct===null){ excluded++; return; }
    buckets[progressBand(pct)].push({student:s, pct:pct});
  });
  Object.keys(buckets).forEach(function(k){ buckets[k].sort(function(a,b){ return b.pct-a.pct; }); });

  var selectedCount = Object.keys(UI.boardSelectedIds).filter(function(id){ return UI.boardSelectedIds[id]; }).length;

  // Toolbar
  html += '<div class="card" style="padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">';
  html += '<div style="position:relative; flex:0 0 auto;">'+
    '<span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-faint); display:flex;">'+icon("search",14)+'</span>'+
    '<input type="text" value="'+esc(UI.boardSearch)+'" oninput="App.setBoardSearch(this.value)" placeholder="Search students…" style="padding:8px 10px 8px 32px; border:1px solid var(--border); border-radius:8px; font-size:13px; width:200px; background:var(--surface); color:var(--text);"/>'+
    '</div>';
  html += '<button onclick="App.toggleBoardActiveOnly()" style="display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:4px 2px;">'+
    '<span class="toggle" style="background:'+(UI.boardActiveOnly?"var(--accent)":"var(--border)")+';"><span class="knob" style="display:block; transform:translateX('+(UI.boardActiveOnly?"17px":"0")+');"></span></span>'+
    '<span style="font-size:12.5px; font-weight:600; color:var(--text-muted);">Currently attending only</span></button>';
  if(inactiveHidden>0){
    html += '<span style="font-size:11.5px; color:var(--text-faint);">'+inactiveHidden+' inactive hidden</span>';
  }
  html += '<div style="flex:1;"></div>';
  if(selectedCount>0){
    html += '<span style="font-size:12.5px; font-weight:700; color:var(--text);">'+selectedCount+' selected</span>'+
      '<button class="btn btn-primary" style="font-size:12.5px; padding:8px 14px;" onclick="App.openBulkPromote()">Promote selected</button>';
  }
  html += '</div>';

  html += '<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start;">';
  BOARD_BANDS.forEach(function(band){
    var list = buckets[band.key];
    var collapsed = UI.boardCollapsed[band.key];
    var selectableInBand = list.filter(function(item){ return !isHardBlocked(item.student); }).map(function(item){ return item.student.id; });
    var allSelectedInBand = selectableInBand.length>0 && selectableInBand.every(function(id){ return UI.boardSelectedIds[id]; });
    html += '<div class="card" style="padding:0; overflow:hidden;" ondragover="event.preventDefault()" ondrop="App.dropOnBand(event,\''+band.key+'\')">';
    html += '<div style="padding:14px 16px; border-bottom:'+(collapsed?"none":"1px solid var(--border)")+'; display:flex; align-items:center; justify-content:space-between; background:var(--surface-2);">'+
      '<div style="display:flex; align-items:center; gap:9px; min-width:0;">'+
      (selectableInBand.length>0 ? '<span class="board-check'+(allSelectedInBand?" on":"")+'" title="'+(allSelectedInBand?"Deselect all in this column":"Select all in this column")+'" onclick="App.toggleColumnSelectAll(\''+band.key+'\')">'+(allSelectedInBand?icon("check",11):"")+'</span>' : '')+
      '<div style="font-family:Manrope; font-weight:700; font-size:13.5px;">'+band.label+'</div>'+
      '</div>'+
      '<div style="display:flex; align-items:center; gap:8px;">'+
      '<div class="badge" style="background:var(--surface); color:var(--text-muted); border:1px solid var(--border);">'+list.length+'</div>'+
      '<button onclick="App.toggleColumnCollapse(\''+band.key+'\')" title="'+(collapsed?"Expand":"Collapse")+'" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:2px; transform:rotate('+(collapsed?"-90deg":"0deg")+');">'+icon("chev",14)+'</button>'+
      '</div></div>';
    if(!collapsed){
      html += '<div style="display:flex; flex-direction:column; gap:10px; padding:12px; min-height:90px;">';
      if(!list.length){
        html += '<div style="font-size:12px; color:var(--text-faint); text-align:center; padding:22px 8px;">No students here</div>';
      } else {
        list.forEach(function(item){ html += GradingBoardCard(item.student, item.pct); });
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  if(excluded>0){
    html += '<div style="font-size:11.5px; color:var(--text-faint);">'+excluded+' student'+(excluded>1?'s':'')+' not shown — already at the top rank for this style, with no next grade to track progress toward.</div>';
  }

  if(UI.boardDetailStudentId){
    var ds = DB.students.find(function(x){ return x.id===UI.boardDetailStudentId; });
    if(ds) html += GradingBoardDetailModal(ds);
  }
  if(UI.bulkPromoteOpen){
    html += BulkPromoteModal();
  }

  html += '</div>';
  return html;
}

function GradingBoardCard(s, pct){
  var rk = getRank(s.styleId, s.rankId);
  var warn = skillsIncomplete(s);
  var blocked = isHardBlocked(s);
  var checked = !!UI.boardSelectedIds[s.id];
  var barColor = pct>=66 ? "var(--success)" : pct>=33 ? "var(--accent)" : "var(--text-faint)";
  var kpiColor = pct>=66 ? "var(--success)" : "var(--text)";
  var checkboxHtml;
  if(blocked){
    checkboxHtml = '<span class="board-check locked" title="Skills required for this style — not yet signed off. Can\'t be selected for grading." onclick="event.stopPropagation();">'+icon("lock",10)+'</span>';
  } else {
    checkboxHtml = '<span class="board-check'+(checked?" on":"")+'" onclick="event.stopPropagation(); App.toggleCardSelect(\''+s.id+'\');">'+(checked?icon("check",11):"")+'</span>';
  }
  return '<div draggable="true" ondragstart="App.dragStartCard(event,\''+s.id+'\')" onclick="App.openBoardDetail(\''+s.id+'\')" class="card" style="padding:13px 14px; cursor:grab; display:flex; flex-direction:column; gap:10px; border:1px solid '+(checked?"var(--accent-border)":"var(--border)")+'; background:'+(checked?"var(--accent-tint)":"var(--surface)")+'; box-shadow:0 1px 2px rgba(0,0,0,0.04);">'+
    '<div style="display:flex; align-items:center; gap:10px;">'+
      checkboxHtml+
      avatarWrap(s.name, 30)+
      beltSwatch(rk, 56, 16)+
      '<div style="flex:1; min-width:0;">'+
        '<div style="display:flex; align-items:center; gap:6px;"><span style="font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(s.name)+'</span>'+
        (warn ? '<span title="A required skill for the next grade is not yet signed off" style="color:var(--accent); flex:0 0 auto; display:flex;">'+icon("alert",12)+'</span>' : '')+'</div>'+
        '<div style="font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;">'+esc(rk?rk.name:"")+'</div>'+
      '</div>'+
      '<div style="text-align:right; flex:0 0 auto;">'+
        '<div style="font-size:18px; font-weight:800; font-family:\'Manrope\',sans-serif; font-variant-numeric:tabular-nums; color:'+kpiColor+'; line-height:1;">'+pct+'%</div>'+
        '<div style="font-size:9px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;">Progress</div>'+
      '</div>'+
    '</div>'+
    '<div class="board-tooltip-wrap" style="position:relative;">'+
      '<div style="height:4px; border-radius:3px; background:var(--surface-2); overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+barColor+';"></div></div>'+
      '<div class="board-tooltip">'+esc(progressBreakdownText(s))+'</div>'+
    '</div></div>';
}

function GradingBoardDetailModal(s){
  var html = '<div class="modal-backdrop">';
  html += '<div style="width:920px; max-width:96vw; max-height:90vh; overflow:auto; background:var(--surface); border-radius:14px; padding:22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;">';
  html += '<div style="display:flex; justify-content:flex-end;"><button onclick="App.closeBoardDetail()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">'+icon("close",18)+'</button></div>';
  html += StudentDetail(s);
  html += '</div></div>';
  return html;
}

function BulkPromoteModal(){
  var ids = UI.bulkPromoteOrder || [];
  var rows = ids.map(function(id){ return DB.students.find(function(s){ return s.id===id; }); }).filter(Boolean).map(function(s){
    return { student:s, fromRank:getRank(s.styleId, s.rankId), toRank:nextRank(s.styleId, s.rankId) };
  }).filter(function(r){ return r.toRank; }); // shouldn't happen — the board only lists students with a next grade

  var countByTarget = {};
  rows.forEach(function(r){ countByTarget[r.toRank.id] = (countByTarget[r.toRank.id]||0)+1; });

  var html = '<div class="modal-backdrop"><div class="modal" style="width:640px;">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between;"><h3 style="font-size:16px; font-weight:700;">Promote these students</h3>'+
    '<button onclick="App.closeBulkPromote()" style="background:none;border:none;color:var(--text-muted);">'+icon("close",18)+'</button></div>';

  if(!UI.bulkPromoteDone){
    html += '<div style="font-size:12.5px; color:var(--text-muted);">Drag '+icon("grip",11)+' to set the calling order. Every student below moves to their next rank in the ladder.</div>';
    html += '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">'+
      '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600;">Date '+
      '<input type="text" value="'+esc(UI.bulkPromoteDate||formatToday())+'" onchange="App.setBulkPromoteDate(this.value)" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; width:110px; background:var(--surface); color:var(--text);"/></label>'+
      '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600; flex:1;">Note (optional) '+
      '<input type="text" value="'+esc(UI.bulkPromoteNote||"")+'" oninput="App.setBulkPromoteNote(this.value)" placeholder="e.g. Spring Grading Day" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; flex:1; min-width:0; background:var(--surface); color:var(--text);"/></label>'+
      '</div>';
  }

  if(!rows.length){
    html += '<div style="font-size:12.5px; color:var(--text-muted); padding:10px 0;">Nothing selected.</div>';
  } else {
    html += '<div style="display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow:auto;">';
    var lastTargetId = null;
    rows.forEach(function(r, i){
      var s = r.student, fromRank = r.fromRank, toRank = r.toRank;
      if(toRank.id!==lastTargetId){
        lastTargetId = toRank.id;
        html += '<div style="display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); padding:'+(i===0?'0':'4')+'px 2px 0;">'+icon("arrowRight",10)+' '+esc(toRank.name)+' · '+countByTarget[toRank.id]+'</div>';
      }
      var draggable = !UI.bulkPromoteDone;
      html += '<div '+(draggable?'draggable="true" ondragstart="App.dragStartPromote(event,\''+s.id+'\')" ondragover="App.dragOverPromoteRow(event)" ondragleave="App.dragLeavePromoteRow(event)" ondrop="App.dropOnPromoteRow(event,\''+s.id+'\')" ondragend="App.dragEndPromote(event)"':'')+
        ' style="display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-top:2px solid transparent; border-radius:10px; padding:9px 12px;'+(draggable?' cursor:grab;':'')+'">'+
        (draggable ? '<span style="color:var(--text-faint); flex:0 0 auto; display:flex;">'+icon("grip",13)+'</span>' : '')+
        '<span style="font-size:10.5px; font-weight:700; color:var(--text-faint); flex:0 0 auto; width:16px; font-variant-numeric:tabular-nums;">'+(i+1)+'</span>'+
        avatarWrap(s.name, 26)+
        '<div style="flex:1; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(s.name)+'</div>'+
        beltSwatch(fromRank, 56, 15)+
        '<span style="color:var(--text-faint); display:flex; flex:0 0 auto;">'+icon("arrowRight",13)+'</span>'+
        beltSwatch(toRank, 56, 15)+
        (UI.bulkPromoteDone ? '<span style="color:var(--success); display:flex; flex:0 0 auto;">'+icon("check",16)+'</span>' :
          '<button onclick="App.removeFromBulkPromote(\''+s.id+'\')" title="Remove from this batch" style="background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; padding:3px; flex:0 0 auto;">'+icon("close",13)+'</button>')+
        '</div>';
    });
    html += '</div>';
  }

  if(UI.bulkPromoteDone){
    html += '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--success-bg); border:1px solid var(--success-border); border-radius:10px; padding:10px 14px;">'+
      '<span style="font-size:12.5px; font-weight:600; color:var(--success);">You promoted '+rows.length+' student'+(rows.length===1?'':'s')+'.</span>'+
      '<button class="btn btn-ghost" style="font-size:12px; padding:7px 12px;" onclick="App.downloadPromotionReport()">'+icon("download",13)+'Download report</button></div>';
    html += '<div style="display:flex; justify-content:flex-end;"><button class="btn btn-primary" onclick="App.closeBulkPromote()">Done</button></div>';
  } else {
    html += '<div style="display:flex; justify-content:flex-end; gap:10px;"><button class="btn btn-ghost" onclick="App.closeBulkPromote()">Cancel</button>'+
      '<button class="btn btn-primary" '+(rows.length?'':'disabled')+' onclick="App.confirmBulkPromote()">Promote '+rows.length+' student'+(rows.length===1?'':'s')+'</button></div>';
  }
  html += '</div></div>';
  return html;
}

// Builds a self-contained, styled HTML report (no external deps, matching
// how the rest of the prototype is built) with a Print / Save-as-PDF
// button — the browser's native print dialog stands in for a real PDF
// export without needing a client-side PDF library.
function buildPromotionReportHtml(styleName, note, rows){
  var today = formatToday();
  var rowsHtml = rows.map(function(r, i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.fromRankName)+'</td><td>'+esc(r.toRankName)+'</td><td>'+esc(r.date)+'</td></tr>';
  }).join('');
  return '<!doctype html><html><head><meta charset="utf-8"><title>Promotion Report — '+esc(styleName)+'</title>'+
    '<style>'+
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; max-width:720px; margin:40px auto; padding:0 24px; color:#1a1a1a; background:#fff;}'+
    'header{display:flex; align-items:flex-end; justify-content:space-between; border-bottom:3px solid #d9a441; padding-bottom:16px; margin-bottom:22px;}'+
    'h1{font-size:19px; margin:0; font-weight:800;} .brand{font-weight:800; font-size:15px; letter-spacing:-0.01em; color:#1a1a1a;} .brand span{color:#d9a441;}'+
    'table{width:100%; border-collapse:collapse; margin-top:12px;} th,td{text-align:left; padding:9px 10px; border-bottom:1px solid #e5e4e0; font-size:13px;} th{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#767268; font-weight:700;} th:first-child,td:first-child{width:32px; font-variant-numeric:tabular-nums; color:#767268;}'+
    '.meta{font-size:12.5px; color:#767268; margin-bottom:4px;}'+
    '.printbtn{margin-top:26px; padding:10px 18px; background:#d9a441; color:#1a1a1a; border:none; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;}'+
    '@media print{ .printbtn{display:none;} body{margin:0; max-width:none;} }'+
    '</style></head><body>'+
    '<header><div class="brand">Dojo<span>HQ</span></div><h1>Promotion Report</h1></header>'+
    '<div class="meta">'+esc(styleName)+' · '+today+' · '+rows.length+' student'+(rows.length===1?'':'s')+' promoted</div>'+
    (note ? '<div class="meta">'+esc(note)+'</div>' : '')+
    '<table><thead><tr><th>#</th><th>Student</th><th>From</th><th>To</th><th>Date</th></tr></thead><tbody>'+rowsHtml+'</tbody></table>'+
    '<button class="printbtn" onclick="window.print()">Print / Save as PDF</button>'+
    '</body></html>';
}

function progressRow(label, val, target, ok){
  var pct = Math.max(0, Math.min(100, Math.round((val/target)*100)));
  return '<div style="display:flex; flex-direction:column; gap:6px;">'+
    '<div style="display:flex; justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-muted); font-weight:600;">'+label+'</span><span style="font-weight:700;">'+val+' / '+target+'</span></div>'+
    '<div style="height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+(ok?"var(--success)":"var(--accent)")+';"></div></div></div>';
}

function GradeModal(){
  var s = currentStudent();
  var style = getStyle(s.styleId);
  var ranks = style.ranks.slice().sort(function(a,b){return a.order-b.order;});
  var pickedId = UI.gradePickedRankId || s.rankId;
  var picked = getRank(s.styleId, pickedId);
  var curRank = getRank(s.styleId, s.rankId);
  var isAdvancing = picked && curRank && picked.order > curRank.order;
  var skillsWarn = isAdvancing && skillsIncomplete(s);
  var hardBlocked = skillsWarn && style.skillsRequired;
  var missingSkillIds = skillsWarn ? incompleteSkillIds(s) : [];
  var toRankIsYears = picked ? isYearsRank(picked) : false;
  var draftDate = UI.gradeDraftDate || formatToday();
  var draftClasses = UI.gradeDraftClasses || 0;

  var html = '<div class="modal-backdrop"><div class="modal">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between;"><div style="display:flex; align-items:center; gap:10px;">'+avatarWrap(s.name, 30)+'<h3 style="font-size:16px; font-weight:700;">Grade '+esc(s.name)+'</h3></div>'+
    '<button onclick="App.closeModals()" style="background:none;border:none;color:var(--text-muted);">'+icon("close",18)+'</button></div>';
  html += '<div style="font-size:12.5px; color:var(--text-muted);">Pick any rank — you\'re not limited to the next one in line. Skipping ranks is allowed.</div>';
  html += '<div id="rankPickList" style="display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; max-height:280px; overflow:auto;">';
  ranks.forEach(function(r){
    var on = r.id===pickedId;
    html += '<button '+(r.id===s.rankId ? 'id="currentRankRow" ' : '')+'onclick="App.pickGradeRank(\''+r.id+'\')" style="display:flex; align-items:center; gap:12px; border:none; background:'+(on?"var(--accent-tint)":"var(--surface)")+'; padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); cursor:pointer; color:var(--text);">'+
      beltSwatch(r, 86, 22)+
      '<span style="font-size:13.5px; font-weight:600; flex:1;">'+esc(r.name)+'</span>'+
      (r.id===s.rankId ? '<span style="font-size:10.5px; font-weight:700; color:var(--text-muted);">CURRENT</span>' : '')+
      (on ? icon("check",16) : "")+'</button>';
  });
  html += '</div>';

  var missingSkillsListHtml = missingSkillIds.length ? '<div style="display:flex; flex-direction:column; gap:5px; margin-top:2px;">'+missingSkillIds.map(function(sid){
    var lesson = lessonsForSkill(sid)[0];
    return '<div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text);">'+
      '<span style="flex:1;">'+esc(skillName(sid))+'</span>'+
      (lesson ? '<button onclick="App.openLesson(\''+lesson.id+'\')" style="display:flex; align-items:center; gap:4px; border:1px solid var(--accent-border); background:var(--surface); border-radius:999px; padding:3px 9px; font-size:11px; font-weight:600; color:var(--accent); cursor:pointer; flex:0 0 auto;">'+icon("play",9)+'Watch</button>' : '')+
      '</div>';
  }).join("")+'</div>' : '';

  if(hardBlocked){
    html += '<div style="background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:10px;">'+
      '<div style="display:flex; gap:10px; align-items:flex-start;"><span style="color:var(--danger); flex:0 0 auto; margin-top:1px; display:flex;">'+icon("lock",15)+'</span>'+
      '<div style="font-size:12px; color:var(--danger); line-height:1.5;"><strong>Skills required for this style.</strong> '+esc(s.name)+' hasn\'t signed off every skill required for the next rank yet. Grading is blocked until they do — "Skills required before grading" is on for this style in Settings.</div></div>'+
      missingSkillsListHtml+
      '</div>';
  } else if(skillsWarn){
    html += '<div style="background:var(--accent-tint); border:1px solid var(--accent-border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:9px;">'+
      '<div style="font-size:12px; color:var(--text); display:flex; gap:9px; line-height:1.5;"><span style="color:var(--accent); flex:0 0 auto; display:flex; margin-top:1px;">'+icon("alert",14)+'</span><span>Not every required skill is signed off for the next rank. You can still grade, but confirm you\'re doing this knowingly.</span></div>'+
      missingSkillsListHtml+
      '<label style="display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; cursor:pointer;" onclick="App.toggleGradeAck()"><span class="board-check'+(UI.gradeAckWarning?" on":"")+'">'+(UI.gradeAckWarning?icon("check",11):"")+'</span>I acknowledge the required skills aren\'t signed off yet</label></div>';
  }

  if(!hardBlocked){
    html += '<div style="display:flex; align-items:center; gap:16px;">'+
      '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600;">Date '+
      '<input type="text" value="'+esc(draftDate)+'" onchange="App.setGradeDraftDate(this.value)" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; width:120px; background:var(--surface); color:var(--text);"/></label>'+
      (!toRankIsYears ? '<label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); font-weight:600;">Starting classes '+
      '<input type="number" min="0" value="'+draftClasses+'" onchange="App.setGradeDraftClasses(this.value)" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; width:60px; background:var(--surface); color:var(--text);"/></label>' : '')+
      '</div>';
  }

  var canConfirm = !hardBlocked && (!skillsWarn || UI.gradeAckWarning);
  html += '<div style="display:flex; justify-content:flex-end; gap:10px;"><button class="btn btn-ghost" onclick="App.closeModals()">Cancel</button>'+

/* ============== ACTIONS ============== */
var App = {
  nav: function(page){ UI.page = page; UI.toast=null; render(); },

  setCurriculumCategoryFilter: function(id){ UI.curriculumCategoryFilter=id; render(); },
  openLesson: function(id){ UI.lessonModalId=id; render(); },
  closeLesson: function(){ UI.lessonModalId=null; render(); },

  openAddLesson: function(categoryId){
    UI.lessonFormOpen=true; UI.lessonFormMode="add"; UI.lessonFormEditId=null; UI.lessonTitleError=false;
    UI.lessonDraft = { title:"", categoryId: categoryId || (DB.curriculum.categories[0] ? DB.curriculum.categories[0].id : null), instructor:"", duration:"", text:"", skillIds:[] };
    render();
  },
  openEditLesson: function(id){
    var l = getLesson(id);
    if(!l) return;
    UI.lessonFormOpen=true; UI.lessonFormMode="edit"; UI.lessonFormEditId=id; UI.lessonTitleError=false;
    UI.lessonDraft = { title:l.title, categoryId:l.categoryId, instructor:l.instructor, duration:l.duration, text:l.text, skillIds:l.skillIds.slice() };
    render();
  },
  cancelLessonForm: function(){ UI.lessonFormOpen=false; UI.lessonDraft=null; render(); },
  setLessonDraftCategory: function(id){ UI.lessonDraft.categoryId=id; render(); },
  toggleLessonDraftSkill: function(id){
    var d = UI.lessonDraft;
    var i = d.skillIds.indexOf(id);
    if(i>-1) d.skillIds.splice(i,1); else d.skillIds.push(id);
    render();
  },
  submitLesson: function(){
    var d = UI.lessonDraft;
    var titleEl = document.getElementById("lessonTitleInput");
    var instructorEl = document.getElementById("lessonInstructorInput");
    var durationEl = document.getElementById("lessonDurationInput");
    var textEl = document.getElementById("lessonTextInput");
    var title = titleEl ? titleEl.value.trim() : "";
    if(!title){ UI.lessonTitleError=true; render(); return; }
    var instructor = instructorEl ? instructorEl.value.trim() : "";
    var duration = durationEl ? durationEl.value.trim() : "";
    var text = textEl ? textEl.value.trim() : "";
    if(UI.lessonFormMode==="add"){
      var catLessons = DB.curriculum.lessons.filter(function(l){ return l.categoryId===d.categoryId; });
      var maxOrder = catLessons.reduce(function(m,l){ return Math.max(m,l.order); }, 0);
      var lesson = { id:nextId("lesson"), categoryId:d.categoryId, order:maxOrder+1, title:title, duration:duration||"0:00", instructor:instructor||"Unassigned", text:text||"No description yet.", skillIds:d.skillIds.slice() };
      DB.curriculum.lessons.push(lesson);
      UI.toast = "\"" + title + "\" added to " + (getCurriculumCategory(d.categoryId)||{}).name + ".";
    } else {
      var l = getLesson(UI.lessonFormEditId);
      if(l){
        if(l.categoryId!==d.categoryId){
          var newCatLessons = DB.curriculum.lessons.filter(function(x){ return x.categoryId===d.categoryId; });
          l.order = newCatLessons.reduce(function(m,x){ return Math.max(m,x.order); }, 0) + 1;
        }
        l.title=title; l.categoryId=d.categoryId; l.instructor=instructor||"Unassigned"; l.duration=duration||"0:00"; l.text=text||"No description yet."; l.skillIds=d.skillIds.slice();
        UI.toast = "\"" + title + "\" updated.";
      }
    }
    UI.lessonFormOpen=false; UI.lessonDraft=null;
    render();
  },
  deleteLesson: function(id){
    var l = getLesson(id);
    DB.curriculum.lessons = DB.curriculum.lessons.filter(function(x){ return x.id!==id; });
    if(UI.lessonFormEditId===id){ UI.lessonFormOpen=false; UI.lessonDraft=null; }
    if(l) UI.toast = "\"" + l.title + "\" deleted.";
    render();
  },

  /* Lesson drag-to-sort — same interaction pattern as the rank ladder's
     drag-to-reorder (dragOverRow/dragLeaveRow are shared with it), except
     dropping a lesson into a different category's list also re-categorizes
     it: the category IS the drop zone, so sorting and organizing are the
     same gesture. */
  dragStartLesson: function(e, id){
    UI.draggingLessonId = id;
    e.dataTransfer.effectAllowed = "move";
    e.currentTarget.style.opacity = "0.4";
  },
  dragEndLesson: function(e){
    if(e.currentTarget) e.currentTarget.style.opacity = "1";
    UI.draggingLessonId = null;
  },
  dropOnLessonZone: function(e, categoryId, targetLessonId){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
    var draggingId = UI.draggingLessonId;
    UI.draggingLessonId = null;
    if(!draggingId) return;
    if(draggingId===targetLessonId){ render(); return; }
    var moved = getLesson(draggingId);
    if(!moved) return;
    var destLessons = DB.curriculum.lessons.filter(function(l){ return l.categoryId===categoryId && l.id!==draggingId; }).sort(function(a,b){ return a.order-b.order; });
    var insertIdx;
    if(targetLessonId===null){
      insertIdx = destLessons.length; // dropped on the "add lesson" zone at the end of the category
    } else {
      var rect = e.currentTarget.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      insertIdx = destLessons.findIndex(function(l){ return l.id===targetLessonId; });
      if(insertIdx<0) insertIdx = destLessons.length;
      else if(after) insertIdx += 1;
    }
    destLessons.splice(insertIdx, 0, moved);
    moved.categoryId = categoryId;
    destLessons.forEach(function(l,i){ l.order=i+1; });
    var movedCategory = getCurriculumCategory(categoryId);
    UI.toast = "\"" + moved.title + "\" moved to " + (movedCategory?movedCategory.name:"") + ", position " + (insertIdx+1) + ".";
    render();
  },

  },
  dragLeaveRow: function(e){
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
  },
  dragEnd: function(e){
    if(e.currentTarget) e.currentTarget.style.opacity = "1";
    UI.draggingRankId = null;
  },
  dropOnRank: function(e, targetId){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.style.borderTop = "2px solid transparent";
    var draggingId = UI.draggingRankId;
    UI.draggingRankId = null;
    if(!draggingId) return;
    if(draggingId===targetId) { render(); return; }
    var style = getStyle(UI.selectedStyleId);
    var ranks = style.ranks.slice().sort(function(a,b){return a.order-b.order;});
    var fromIdx = ranks.findIndex(function(r){return r.id===draggingId;});
    if(fromIdx<0) return;
    var moved = ranks.splice(fromIdx,1)[0];
    var insertIdx;
    if(targetId===null){
      insertIdx = ranks.length; // dropped on the "end of ladder" zone
    } else {
      var rect = e.currentTarget.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      insertIdx = ranks.findIndex(function(r){return r.id===targetId;});
      if(insertIdx<0) insertIdx = ranks.length;
      else if(after) insertIdx += 1;
    }
    ranks.splice(insertIdx, 0, moved);
    ranks.forEach(function(r,i){ r.order=i+1; });
    style.ranks = ranks;
    UI.selectedRankId = moved.id;
    UI.toast = "\"" + moved.name + "\" moved to position " + (insertIdx+1) + " of " + ranks.length + ".";
    render();
  },

  setSkillFilter: function(id){ UI.skillFilter=id; render(); },
  toggleSkillForm: function(){
    UI.skillFormOpen=!UI.skillFormOpen; UI.newSkillError=false;
    if(UI.skillFormOpen){ UI.newSkillNameDraft=""; UI.newSkillDescDraft=""; }
    render();
  },
  setNewSkillStyle: function(id){ UI.newSkillStyleId=id; render(); },
  toggleExpandSkill: function(id){ UI.expandedSkillId = UI.expandedSkillId===id ? null : id; render(); },
  submitSkill: function(){
    var nameEl = document.getElementById("newSkillNameInput");
    var descEl = document.getElementById("newSkillDescInput");
    var name = nameEl ? nameEl.value.trim() : "";
    var desc = descEl ? descEl.value.trim() : "";
    if(!name){ UI.newSkillError=true; render(); return; }
    var styleId = UI.newSkillStyleId || UI.selectedStyleId;
    DB.skills.push({ id:nextId("skill"), name:name, description: desc || "No description yet.", styleId: styleId });
    UI.skillFormOpen=false; UI.newSkillError=false; UI.newSkillNameDraft=""; UI.newSkillDescDraft="";
    UI.toast = "\"" + name + "\" added to the skill library.";
    render();
  },

  logClass: function(){
    var s = currentStudent();
    var before = computeEligibility(s);
    s.classesAttended += 1;
    var after = computeEligibility(s);
    if(after.hasNext && after.eligible && !(before.hasNext && before.eligible)){
      UI.toast = "🔔 " + s.name + " just became eligible to grade — owner notified.";
    }
    render();
  },
  cycleSkill: function(sid){
    var s = currentStudent();
    s.skillStatus = s.skillStatus || {};
    var cur = s.skillStatus[sid] || "not_started";
    var next = cur==="not_started" ? "learning" : cur==="learning" ? "signed" : "not_started";
    var before = computeEligibility(s);
    s.skillStatus[sid] = next;
    var after = computeEligibility(s);
    if(after.hasNext && after.eligible && !(before.hasNext && before.eligible)){
      UI.toast = "🔔 " + s.name + " just became eligible to grade — owner notified.";
    }
    render();
  },
  dismissToast: function(){ UI.toast=null; render(); },

  toggleHistoryNoteEditor: function(hid){ UI.editingHistoryId = UI.editingHistoryId===hid ? null : hid; render(); },
  setHistoryNotes: function(hid, value){
    var s = currentStudent();
    var h = (s.history||[]).find(function(x, i){ return (x.id||("legacy-"+i))===hid; });
    if(h) h.notes = value;
    render();
  },
  askDeleteHistory: function(hid){ UI.confirmDeleteHistoryId = hid; render(); },
  cancelDeleteHistory: function(){ UI.confirmDeleteHistoryId = null; render(); },
  confirmDeleteHistory: function(hid){
    var s = currentStudent();
    s.history = (s.history||[]).filter(function(x, i){ return (x.id||("legacy-"+i))!==hid; });
    UI.confirmDeleteHistoryId = null;
    UI.editingHistoryId = null;
    render();
  },

  openGrade: function(){ var s=currentStudent(); UI.gradePickedRankId=s.rankId; UI.gradeDraftDate=formatToday(); UI.gradeDraftClasses=0; UI.gradeAckWarning=false; UI.gradeOpen=true; UI.downgradeOpen=false; UI.scrollToCurrentRankOnRender=true; render(); },
  openDowngrade: function(){ var s=currentStudent(); UI.gradePickedRankId=s.rankId; UI.downgradeOpen=true; UI.gradeOpen=false; UI.scrollToCurrentRankOnRender=true; render(); },
  closeModals: function(){ UI.gradeOpen=false; UI.downgradeOpen=false; render(); },
  pickGradeRank: function(id){
    // Picking a rank re-renders the whole app, which replaces the rank-list
    // DOM node and would otherwise silently reset its scroll position to the
    // top — forcing a rescroll after every click. Capture where the list was
    // scrolled to and hand it to afterRender() to restore post-render.
    var list = document.getElementById("rankPickList");
    UI.rankListScrollTop = list ? list.scrollTop : null;
    UI.gradePickedRankId=id;
    render();
  },
  setGradeDraftDate: function(v){ UI.gradeDraftDate=v; render(); },
  setGradeDraftClasses: function(v){ var n=parseInt(v,10); UI.gradeDraftClasses = isNaN(n) ? 0 : Math.max(0,n); render(); },
  toggleGradeAck: function(){ UI.gradeAckWarning=!UI.gradeAckWarning; render(); },
  confirmGrade: function(){
    var s = currentStudent();
    var style = getStyle(s.styleId);
    var fromRank = getRank(s.styleId, s.rankId);
    var toRank = getRank(s.styleId, UI.gradePickedRankId);
    var isAdvancing = toRank.order > fromRank.order;
    // Defense in depth — the confirm button is already disabled for both
    // cases below, so this only matters if something bypasses the UI.
    if(isAdvancing && style.skillsRequired && skillsIncomplete(s)) return;
    if(isAdvancing && !style.skillsRequired && skillsIncomplete(s) && !UI.gradeAckWarning) return;
    var skipped = toRank.order - fromRank.order;
    var note = skipped>1 ? "Skipped " + (skipped-1) + " rank" + (skipped-1>1?"s":"") + " in between."
      : skipped<0 ? "Moved to an earlier rank via Grade (not Downgrade)."
      : "";
    var date = UI.gradeDraftDate || formatToday();
    s.history = s.history || [];
    s.history.unshift({ id: nextHistoryId(), rankId: toRank.id, type:"promotion", date: date, by:"Gus (Owner)", note: note, notes:"" });
    s.rankId = toRank.id;
    s.since = date;
    s.classesAttended = isYearsRank(toRank) ? 0 : (UI.gradeDraftClasses||0);
    s.skillStatus = {};
    UI.gradeOpen=false;
    UI.toast = esc(s.name) + " graded to " + esc(toRank.name) + ".";
    render();
  },
  confirmDowngrade: function(){
    var s = currentStudent();
    var toRank = getRank(s.styleId, UI.gradePickedRankId);
    var reasonEl = document.getElementById("downgradeReason");
    var reason = reasonEl ? reasonEl.value.trim() : "";
    if(!reason) return;
    var today = formatToday();
    s.history = s.history || [];
    s.history.unshift({ id: nextHistoryId(), rankId: toRank.id, type:"downgrade", date: today, by:"Gus (Owner)", note:"Reason: " + reason, notes:"" });
    s.rankId = toRank.id;
    s.since = today;
    s.classesAttended = 0;
    s.skillStatus = {};
    UI.downgradeOpen=false;
    UI.toast = esc(s.name) + " downgraded to " + esc(toRank.name) + ".";
    render();
  },

  toggleFee: function(){ DB.settings.feeOn = !DB.settings.feeOn; render(); },
  toggleSkillsRequired: function(styleId){
    var sty = getStyle(styleId);
    if(!sty) return;
    sty.skillsRequired = !sty.skillsRequired;
    render();
  },
  toggleChannel: function(id){ DB.settings.channels[id] = !DB.settings.channels[id]; render(); },
  togglePerm: function(insId, styleKey){
    var ins = DB.settings.instructors.find(function(i){return i.id===insId;});
    ins.perm[styleKey] = !ins.perm[styleKey];
    render();
  },

  toggleSchedule: function(){ UI.scheduleOpen=!UI.scheduleOpen; render(); },
  createEvent: function(){
    var id = nextId("event");
    var evStyle = getStyle(UI.selectedStyleId);
    DB.events.unshift({ id:id, title:"New Grading Day"+(evStyle?" — "+evStyle.name:""), date:"TBD", venue:"Riverside — Main Mat", status:"scheduled",
      participants: DB.students.filter(function(s){ return computeEligibility(s).eligible; }).map(function(s){ return {id:s.id, name:s.name, result:null}; }) });
    UI.scheduleOpen=false; UI.eventsView="list";
    UI.toast = "Grading event created with pre-suggested eligible students.";
    render();
  },
  viewEvent: function(id){ UI.selectedEventId=id; UI.eventsView="run"; render(); },
  backToEvents: function(){ UI.eventsView="list"; render(); },
  setResult: function(eventId, participantId, result){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    var p = ev.participants.find(function(x){return x.id===participantId;});
    p.result = p.result===result ? null : result;
    render();
  },
  completeEvent: function(eventId){
    var ev = DB.events.find(function(e){return e.id===eventId;});
    ev.status="completed";
    var passCount = ev.participants.filter(function(p){return p.result==="pass";}).length;
    UI.toast = passCount + " participant" + (passCount===1?"":"s") + " bulk-promoted and logged to their history.";
    UI.eventsView="list";
    render();
  }
};
window.App = App;

render();
</script>

</body></html>
